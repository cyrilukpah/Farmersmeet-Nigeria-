          cat > app/src/main/java/ng/farmersmeet/nigeria/MarketplaceActivity.kt <<'EOF'
          package ng.farmersmeet.nigeria

          import android.content.Intent
          import android.os.Bundle
          import android.widget.Button
          import androidx.appcompat.app.AppCompatActivity

          class MarketplaceActivity : AppCompatActivity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_marketplace)

                  val categories = listOf(
                      R.id.cropsButton to "Crops and Farm Produce",
                      R.id.livestockButton to "Livestock",
                      R.id.poultryButton to "Poultry",
                      R.id.seedsButton to "Seeds and Seedlings",
                      R.id.equipmentButton to "Farm Equipment"
                  )

                  categories.forEach { (id, name) ->
                      findViewById<Button>(id).setOnClickListener {
                          val intent = Intent(this, ListingsActivity::class.java)
                          intent.putExtra("category", name)
                          startActivity(intent)
                      }
                  }

                  findViewById<Button>(R.id.sellButton).setOnClickListener {
                      startActivity(Intent(this, SellActivity::class.java))
                  }
              }
          }
          EOF

          cat > app/src/main/java/ng/farmersmeet/nigeria/ListingsActivity.kt <<'EOF'
          package ng.farmersmeet.nigeria

          import android.content.Intent
          import android.graphics.Color
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity

          data class Listing(
              val name: String,
              val price: String,
              val location: String,
              val seller: String,
              val description: String
          )

          class ListingsActivity : AppCompatActivity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_listings)

                  val category = intent.getStringExtra("category") ?: "Marketplace"
                  findViewById<TextView>(R.id.categoryTitle).text = category

                  val container = findViewById<LinearLayout>(R.id.listingsContainer)

                  val listings = when (category) {
                      "Crops and Farm Produce" -> listOf(
                          Listing("Fresh Maize", "₦150,000", "Abakaliki, Ebonyi", "John Farms", "Freshly harvested maize available in quantity."),
                          Listing("Local Rice", "₦95,000", "Aba, Abia", "Green Valley Farm", "Quality local rice suitable for household and commercial use."),
                          Listing("Cassava", "₦70,000", "Umuahia, Abia", "Chukwu Farm", "Fresh cassava available for bulk buyers.")
                      )

                      "Livestock" -> listOf(
                          Listing("Large White Pigs", "₦180,000", "Abakaliki, Ebonyi", "Peace Pig Farm", "Healthy pigs available for breeding or meat production."),
                          Listing("Goats", "₦120,000", "Aba, Abia", "Umuahia Livestock", "Healthy goats available for farmers and traders.")
                      )

                      "Poultry" -> listOf(
                          Listing("Broiler Chickens", "₦8,500", "Abakaliki, Ebonyi", "Victory Poultry", "Healthy mature broilers ready for sale."),
                          Listing("Day Old Chicks", "₦1,200", "Aba, Abia", "Sunrise Poultry", "Quality day old chicks available for farmers.")
                      )

                      "Seeds and Seedlings" -> listOf(
                          Listing("Hybrid Maize Seeds", "₦25,000", "Enugu, Enugu", "Agro Seed Centre", "Quality hybrid maize seeds for commercial farming."),
                          Listing("Vegetable Seedlings", "₦5,000", "Aba, Abia", "Green Garden", "Healthy vegetable seedlings ready for transplanting.")
                      )

                      else -> listOf(
                          Listing("Knapsack Sprayer", "₦45,000", "Aba, Abia", "Agro Tools Nigeria", "Manual farm sprayer suitable for crop protection."),
                          Listing("Water Pump", "₦120,000", "Abakaliki, Ebonyi", "Farm Equipment Hub", "Petrol water pump for irrigation and farm use.")
                      )
                  }

                  listings.forEach { listing ->
                      addListingCard(container, listing)
                  }
              }

              private fun addListingCard(
                  container: LinearLayout,
                  listing: Listing
              ) {
                  val card = LinearLayout(this)
                  card.orientation = LinearLayout.VERTICAL
                  card.setPadding(18, 18, 18, 18)
                  card.setBackgroundResource(R.drawable.card_background)

                  val params = LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  )
                  params.setMargins(0, 0, 0, 16)
                  card.layoutParams = params

                  val name = TextView(this)
                  name.text = listing.name
                  name.textSize = 21f
                  name.setTextColor(Color.parseColor("#176B35"))
                  name.setTypeface(null, android.graphics.Typeface.BOLD)

                  val price = TextView(this)
                  price.text = listing.price
                  price.textSize = 20f
                  price.setTextColor(Color.parseColor("#0D4D25"))
                  price.setTypeface(null, android.graphics.Typeface.BOLD)
                  price.setPadding(0, 8, 0, 4)

                  val location = TextView(this)
                  location.text = "Location: ${listing.location}"
                  location.textSize = 15f

                  val seller = TextView(this)
                  seller.text = "Seller: ${listing.seller}"
                  seller.textSize = 15f
                  seller.setPadding(0, 4, 0, 10)

                  val button = Button(this)
                  button.text = "VIEW DETAILS"
                  button.setTextColor(Color.WHITE)
                  button.setBackgroundResource(R.drawable.button_green)
                  button.gravity = Gravity.CENTER

                  button.setOnClickListener {
                      val intent = Intent(this, ProductActivity::class.java)
                      intent.putExtra("name", listing.name)
                      intent.putExtra("price", listing.price)
                      intent.putExtra("location", listing.location)
                      intent.putExtra("seller", listing.seller)
                      intent.putExtra("description", listing.description)
                      startActivity(intent)
                  }

                  card.addView(name)
                  card.addView(price)
                  card.addView(location)
                  card.addView(seller)
                  card.addView(button)

                  container.addView(card)
              }
          }
          EOF

          cat > app/src/main/java/ng/farmersmeet/nigeria/ProductActivity.kt <<'EOF'
          package ng.farmersmeet.nigeria

          import android.os.Bundle
