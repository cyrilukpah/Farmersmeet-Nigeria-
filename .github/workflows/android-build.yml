name: FarmersMeet Stage 10 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build FarmersMeet Stage 10
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify actual FarmersMeet source
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking repository..."

          test -d FarmersMeet_V2/android
          test -f FarmersMeet_V2/android/settings.gradle
          test -f FarmersMeet_V2/android/build.gradle
          test -f FarmersMeet_V2/android/app/build.gradle
          test -f FarmersMeet_V2/android/app/src/main/AndroidManifest.xml
          test -f FarmersMeet_V2/android/app/src/main/java/ng/farmersmeet/nigeria/MainActivity.kt

          echo "Actual FarmersMeet Android source found."

      - name: Install Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p FarmersMeet_V2/android/app

          if [ -f "Settings/google-services.json" ]; then
            cp "Settings/google-services.json" \
              "FarmersMeet_V2/android/app/google-services.json"

          elif [ -f "google-services.json" ]; then
            cp "google-services.json" \
              "FarmersMeet_V2/android/app/google-services.json"

          elif [ -f "FarmersMeet_V2/android/app/google-services.json" ]; then
            echo "Firebase configuration already exists."

          else
            echo "ERROR: google-services.json was not found."
            echo
            echo "Expected one of:"
            echo "  Settings/google-services.json"
            echo "  google-services.json"
            echo "  FarmersMeet_V2/android/app/google-services.json"
            exit 1
          fi

          test -s FarmersMeet_V2/android/app/google-services.json

          echo "Firebase configuration installed."

      - name: Verify Firebase package
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "FarmersMeet_V2/android/app/google-services.json"
          )

          data = json.loads(path.read_text())

          expected = "ng.farmersmeet.nigeria"

          clients = data.get("client", [])

          if not clients:
              raise SystemExit(
                  "ERROR: google-services.json contains no Android client."
              )

          packages = []

          for client in clients:
              package_name = (
                  client
                  .get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name")
              )

              if package_name:
                  packages.append(package_name)

          print("Firebase Android package(s):")

          for package_name in packages:
              print(" - " + package_name)

          if expected not in packages:
              raise SystemExit(
                  "ERROR: Firebase package mismatch.\n"
                  "Expected: " + expected + "\n"
                  "Found: " + str(packages)
              )

          print("Firebase package check PASSED.")
          PY

      - name: Configure Gradle for Firebase
        shell: bash
        run: |
          set -euo pipefail

          cd FarmersMeet_V2/android

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "FarmersMeetNigeria"

          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
              id 'com.google.gms.google-services' version '4.4.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
              id 'com.google.gms.google-services'
          }

          android {
              namespace 'ng.farmersmeet.nigeria'

              compileSdk 35

              defaultConfig {
                  applicationId 'ng.farmersmeet.nigeria'
                  minSdk 24
                  targetSdk 35
                  versionCode 10
                  versionName "10.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildTypes {
                  debug {
                      debuggable true
                      minifyEnabled false
                  }

                  release {
                      minifyEnabled false
                  }
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.15.0'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
              implementation 'androidx.activity:activity-ktx:1.10.0'

              implementation platform(
                  'com.google.firebase:firebase-bom:34.19.0'
              )

              implementation 'com.google.firebase:firebase-auth'
              implementation 'com.google.firebase:firebase-firestore'
              implementation 'com.google.firebase:firebase-storage'

              implementation 'com.paystack.android:paystack-ui:0.0.9'
          }
          EOF

          echo "Gradle configuration written."

      - name: Create Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd FarmersMeet_V2/android

          gradle wrapper \
            --gradle-version 8.7 \
            --distribution-type bin

          chmod +x gradlew

          test -f gradlew

          echo "Gradle wrapper created successfully."

      - name: Verify Gradle project
        shell: bash
        run: |
          set -euo pipefail

          cd FarmersMeet_V2/android

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:tasks

      - name: Build Stage 10 debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd FarmersMeet_V2/android

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            :app:assembleDebug

      - name: Verify Stage 10 APK
        shell: bash
        run: |
          set -euo pipefail

          APK="FarmersMeet_V2/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
              echo "ERROR: Stage 10 APK was not generated."
              exit 1
          fi

          echo
          echo "=========================================="
          echo " FARMERSMEET STAGE 10 APK SUCCESSFULLY BUILT"
          echo "=========================================="
          echo
          ls -lh "$APK"

      - name: Upload Stage 10 APK
        uses: actions/upload-artifact@v4
        with:
          name: FarmersMeet-Stage-10-APK
          path: FarmersMeet_V2/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
