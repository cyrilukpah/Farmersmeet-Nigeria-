name: FarmersMeet Stage 10 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build FarmersMeet Stage 10
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for FarmersMeet Android project..."

          PROJECT_ROOT=""

          while IFS= read -r SETTINGS_FILE; do
            CANDIDATE="$(dirname "$SETTINGS_FILE")"

            if [ -f "$CANDIDATE/app/build.gradle" ] || \
               [ -f "$CANDIDATE/app/build.gradle.kts" ]; then
              PROJECT_ROOT="$CANDIDATE"
              break
            fi
          done < <(
            find . \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -not -path "*/.gradle/*" \
              -print | sort
          )

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: Android project could not be located."

            echo
            echo "settings.gradle files found:"
            find . \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -not -path "*/.gradle/*" \
              -print | sort

            echo
            echo "Gradle build files found:"
            find . \
              -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              -not -path "*/.gradle/*" \
              -print | sort

            exit 1
          fi

          PROJECT_ROOT="${PROJECT_ROOT#./}"

          echo "Android project:"
          echo "$PROJECT_ROOT"

          echo "$PROJECT_ROOT" > "$GITHUB_WORKSPACE/.farmersmeet_project_root"

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT="$(cat "$GITHUB_WORKSPACE/.farmersmeet_project_root")"

          echo "Using Android project:"
          echo "$PROJECT_ROOT"

          test -f "$PROJECT_ROOT/settings.gradle" || \
          test -f "$PROJECT_ROOT/settings.gradle.kts"

          test -f "$PROJECT_ROOT/app/build.gradle" || \
          test -f "$PROJECT_ROOT/app/build.gradle.kts"

          test -d "$PROJECT_ROOT/app/src/main"

          echo
          echo "PROJECT VERIFICATION PASSED."

          echo
          echo "Project files:"
          find "$PROJECT_ROOT" -maxdepth 3 -type f \
            \( \
              -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "AndroidManifest.xml" \
              -o -name "google-services.json" \
            \) \
            -print | sort

      - name: Configure AndroidX
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT="$(cat "$GITHUB_WORKSPACE/.farmersmeet_project_root")"

          PROPERTIES_FILE="$PROJECT_ROOT/gradle.properties"

          touch "$PROPERTIES_FILE"

          if grep -q '^android.useAndroidX=' "$PROPERTIES_FILE"; then
            sed -i \
              's/^android.useAndroidX=.*/android.useAndroidX=true/' \
              "$PROPERTIES_FILE"
          else
            printf '%s\n' \
              'android.useAndroidX=true' \
              >> "$PROPERTIES_FILE"
          fi

          echo
          echo "AndroidX configuration:"
          cat "$PROPERTIES_FILE"

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT="$(cat "$GITHUB_WORKSPACE/.farmersmeet_project_root")"

          if [ -f "$PROJECT_ROOT/gradlew" ]; then
            chmod +x "$PROJECT_ROOT/gradlew"
            echo "Existing Gradle wrapper found."
          else
            echo "No Gradle wrapper found."
            echo "Generating Gradle 8.10 wrapper..."

            cd "$PROJECT_ROOT"

            gradle wrapper \
              --gradle-version 8.10 \
              --distribution-type bin

            chmod +x gradlew
          fi

          echo
          echo "Gradle wrapper:"
          "$PROJECT_ROOT/gradlew" --version

      - name: Show available Gradle tasks
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT="$(cat "$GITHUB_WORKSPACE/.farmersmeet_project_root")"

          cd "$PROJECT_ROOT"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            tasks \
            --all

      - name: Build FarmersMeet Debug APK
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT="$(cat "$GITHUB_WORKSPACE/.farmersmeet_project_root")"

          cd "$PROJECT_ROOT"

          echo "Building debug APK..."

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: Find generated APK
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT="$(cat "$GITHUB_WORKSPACE/.farmersmeet_project_root")"

          echo "Searching for generated APK..."

          APK="$(find "$PROJECT_ROOT/app/build" \
            -type f \
            -name "*.apk" \
            -print \
            | sort \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated."

            echo
            echo "Build directory:"
            find "$PROJECT_ROOT/app/build" \
              -maxdepth 5 \
              -type f \
              -print 2>/dev/null || true

            exit 1
          fi

          echo
          echo "=========================================="
          echo " FARMERSMEET STAGE 10 APK READY"
          echo "=========================================="
          echo
          ls -lh "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload FarmersMeet Stage 10 APK
        uses: actions/upload-artifact@v4
        with:
          name: FarmersMeet-Stage-10-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30
