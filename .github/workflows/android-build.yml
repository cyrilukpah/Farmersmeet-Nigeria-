name: FarmersMeet Stage 10 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build FarmersMeet Stage 10
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Extract Stage 10 source
        shell: bash
        run: |
          set -euo pipefail

          ZIP="FarmersMeet_Nigeria_V2_Full_Source.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Source archive not found:"
            echo "$ZIP"
            echo
            echo "Repository contents:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          rm -rf FarmersMeet

          mkdir -p FarmersMeet

          unzip -q "$ZIP" -d FarmersMeet

          echo "Extracted archive contents:"
          find FarmersMeet -maxdepth 3 -type f | sort | head -100

          # The supplied archive contains FarmersMeet_V2/android.
          # The proven Stage 7 build expects the Android project at
          # FarmersMeet/, so place the actual Android project there.
          if [ -d "FarmersMeet/FarmersMeet_V2/android" ]; then
            rm -rf FarmersMeet/build-source
            cp -a FarmersMeet/FarmersMeet_V2/android FarmersMeet/build-source
          elif [ -d "FarmersMeet/android" ]; then
            rm -rf FarmersMeet/build-source
            cp -a FarmersMeet/android FarmersMeet/build-source
          else
            echo "ERROR: Could not locate the Android project inside the archive."
            find FarmersMeet -maxdepth 5 -type d | sort
            exit 1
          fi

          test -f FarmersMeet/build-source/settings.gradle
          test -f FarmersMeet/build-source/build.gradle
          test -f FarmersMeet/build-source/app/build.gradle
          test -f FarmersMeet/build-source/app/src/main/AndroidManifest.xml

          echo "Actual Android project located successfully."

      - name: Install Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          APP="FarmersMeet/build-source/app"

          mkdir -p "$APP"

          if [ -f "Settings/google-services.json" ]; then
            cp "Settings/google-services.json" "$APP/google-services.json"
          elif [ -f "google-services.json" ]; then
            cp "google-services.json" "$APP/google-services.json"
          else
            echo "ERROR: google-services.json was not found."
            echo
            echo "Expected it in:"
            echo "  Settings/google-services.json"
            echo "or"
            echo "  google-services.json"
            exit 1
          fi

          test -s "$APP/google-services.json"

          echo "Firebase configuration installed."

      - name: Verify Firebase package
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import sys

          path = "FarmersMeet/build-source/app/google-services.json"
          expected = "ng.farmersmeet.nigeria"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          packages = []

          for client in data.get("client", []):
              package_name = (
                  client
                  .get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name")
              )

              if package_name:
                  packages.append(package_name)

          print("Firebase Android package(s):")
          for package_name in packages:
              print("  " + package_name)

          if expected not in packages:
              print()
              print("ERROR: Firebase package mismatch.")
              print("Expected:", expected)
              print("Found:", packages)
              sys.exit(1)

          print("Firebase package verification PASSED.")
          PY

      - name: Configure Google Services plugin
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="FarmersMeet/build-source"

          cat > "$PROJECT/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
              id 'com.google.gms.google-services' version '4.4.2' apply false
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          path = Path("FarmersMeet/build-source/app/build.gradle")
          text = path.read_text()

          if "com.google.gms.google-services" not in text:
              marker = "id 'org.jetbrains.kotlin.android'"

              if marker in text:
                  text = text.replace(
                      marker,
                      marker + "\n    id 'com.google.gms.google-services'",
                      1
                  )
              else:
                  text = (
                      "plugins {\n"
                      "    id 'com.android.application'\n"
                      "    id 'org.jetbrains.kotlin.android'\n"
                      "    id 'com.google.gms.google-services'\n"
                      "}\n\n"
                      + text
                  )

          path.write_text(text)
          PY

          echo "Google Services plugin configured."

      - name: Verify project configuration
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="FarmersMeet/build-source"

          grep -q "com.android.application" "$PROJECT/build.gradle"
          grep -q "com.google.gms.google-services" "$PROJECT/build.gradle"
          grep -q "com.google.gms.google-services" "$PROJECT/app/build.gradle"

          grep -q "firebase-auth" "$PROJECT/app/build.gradle"
          grep -q "firebase-firestore" "$PROJECT/app/build.gradle"
          grep -q "firebase-storage" "$PROJECT/app/build.gradle"

          echo "Project configuration verified."

      - name: Build APK
        working-directory: FarmersMeet/build-source
        shell: bash
        run: |
          set -euo pipefail

          gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="FarmersMeet/build-source/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not produced."
            echo
            echo "APK files found:"
            find FarmersMeet -type f -name "*.apk" -print || true
            exit 1
          fi

          echo
          echo "=========================================="
          echo " FARMERSMEET STAGE 10 APK SUCCESS"
          echo "=========================================="
          echo

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FarmersMeet-Stage-10-APK
          path: FarmersMeet/build-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
