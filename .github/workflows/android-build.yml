name: FarmersMeet Stage 10 Firebase Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build FarmersMeet Stage 10
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify repository structure
        shell: bash
        run: |
          set -e

          echo "Repository root:"
          pwd

          echo
          echo "Repository contents:"
          find . -maxdepth 3 -type f | sort

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

          echo
          echo "Android project files found at repository root."

      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -e

          if [ -f app/google-services.json ]; then
            echo "Firebase configuration found at app/google-services.json"
          elif [ -f Settings/google-services.json ]; then
            echo "Firebase configuration found at Settings/google-services.json"
            cp Settings/google-services.json app/google-services.json
            echo "Copied Firebase configuration into app/"
          else
            echo "ERROR: google-services.json was not found."
            echo
            echo "Expected either:"
            echo "  app/google-services.json"
            echo "or:"
            echo "  Settings/google-services.json"
            exit 1
          fi

          test -f app/google-services.json

      - name: Replace root settings.gradle
        shell: bash
        run: |
          set -e

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "FarmersMeetNigeria"

          include(":app")
          EOF

      - name: Replace root build.gradle
        shell: bash
        run: |
          set -e

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
              id 'com.google.gms.google-services' version '4.5.0' apply false
          }
          EOF

      - name: Replace gradle.properties
        shell: bash
        run: |
          set -e

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

      - name: Replace app build.gradle
        shell: bash
        run: |
          set -e

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
              id 'com.google.gms.google-services'
          }

          android {
              namespace 'ng.farmersmeet.nigeria'
              compileSdk 35

              defaultConfig {
                  applicationId 'ng.farmersmeet.nigeria'
                  minSdk 24
                  targetSdk 35
                  versionCode 10
                  versionName "10.0"
              }

              buildTypes {
                  debug {
                      debuggable true
                      minifyEnabled false
                  }

                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.15.0'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.activity:activity-ktx:1.10.1'

              implementation platform('com.google.firebase:firebase-bom:34.19.0')
              implementation 'com.google.firebase:firebase-auth'
          }
          EOF

      - name: Check Firebase package compatibility
        shell: bash
        run: |
          set -e

          echo "Checking Firebase Android package..."

          python3 - <<'PY'
          import json
          import sys

          with open("app/google-services.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          clients = data.get("client", [])

          expected = "ng.farmersmeet.nigeria"

          packages = []

          for client in clients:
              package_name = (
                  client
                  .get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name")
              )

              if package_name:
                  packages.append(package_name)

          print("Firebase Android package names:")
          for package_name in packages:
              print(" -", package_name)

          if expected not in packages:
              print()
              print("ERROR: google-services.json does not contain")
              print("the Android package:")
              print(expected)
              print()
              print("The Firebase Android app must use this exact package name.")
              sys.exit(1)

          print()
          print("Firebase package name is correct.")
          PY

      - name: Create Gradle wrapper
        shell: bash
        run: |
          set -e

          if [ ! -f gradlew ]; then
            gradle wrapper \
              --gradle-version 8.9 \
              --distribution-type bin
          fi

          chmod +x gradlew

      - name: Clean previous Gradle state
        shell: bash
        run: |
          set -e

          ./gradlew --no-daemon clean

      - name: Build Stage 10 debug APK
        shell: bash
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: Verify Stage 10 APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            echo
            echo "Available APK files:"
            find app/build -type f -name "*.apk" -print || true
            exit 1
          fi

          echo
          echo "=========================================="
          echo "STAGE 10 BUILD SUCCESSFUL"
          echo "=========================================="
          echo
          ls -lh "$APK"

      - name: Upload Stage 10 APK
        uses: actions/upload-artifact@v4
        with:
          name: FarmersMeet-Stage-10-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
