name: FarmersMeet Stage 7 Final APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Create FarmersMeet Stage 7 Final Project
        shell: bash
        run: |
          set -e

          rm -rf FarmersMeet

          mkdir -p FarmersMeet/app/src/main/java/ng/farmersmeet/nigeria
          mkdir -p FarmersMeet/app/src/main/res/values
          mkdir -p FarmersMeet/app/src/main/res/drawable

          cat > FarmersMeet/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "FarmersMeet"
          include(":app")
          EOF

          cat > FarmersMeet/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat > FarmersMeet/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > FarmersMeet/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'ng.farmersmeet.nigeria'
              compileSdk 35

              defaultConfig {
                  applicationId 'ng.farmersmeet.nigeria'
                  minSdk 24
                  targetSdk 35
                  versionCode 7
                  versionName "7.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.15.0'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.activity:activity-ktx:1.10.1'
          }
          EOF

          cat > FarmersMeet/app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="farm_green">#176B35</color>
              <color name="farm_dark_green">#0D4D25</color>
              <color name="farm_gold">#F4C430</color>
              <color name="farm_background">#F5F8F3</color>
              <color name="farm_text">#18351F</color>
              <color name="farm_white">#FFFFFF</color>
          </resources>
          EOF

          cat > FarmersMeet/app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="AppTheme"
                  parent="Theme.AppCompat.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#176B35</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:statusBarColor">#0D4D25</item>
                  <item name="android:navigationBarColor">#0D4D25</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowBackground">#F5F8F3</item>

              </style>

          </resources>
          EOF

          cat > FarmersMeet/app/src/main/res/drawable/button_green.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#176B35"/>
              <corners android:radius="14dp"/>
              <padding
                  android:left="16dp"
                  android:right="16dp"
                  android:top="4dp"
                  android:bottom="4dp"/>
          </shape>
          EOF

          cat > FarmersMeet/app/src/main/res/drawable/button_gold.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#F4C430"/>
              <corners android:radius="14dp"/>
              <padding
                  android:left="16dp"
                  android:right="16dp"
                  android:top="4dp"
                  android:bottom="4dp"/>
          </shape>
          EOF

          cat > FarmersMeet/app/src/main/res/drawable/card_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#FFFFFF"/>
              <corners android:radius="18dp"/>
              <stroke
                  android:width="1dp"
                  android:color="#DDE8DD"/>
              <padding
                  android:left="16dp"
                  android:right="16dp"
                  android:top="14dp"
                  android:bottom="14dp"/>
          </shape>
          EOF

          cat > FarmersMeet/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/AppTheme"
                  android:label="FarmersMeet"
                  android:allowBackup="true"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > FarmersMeet/app/src/main/java/ng/farmersmeet/nigeria/MainActivity.kt <<'EOF'
          package ng.farmersmeet.nigeria

          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Typeface
          import android.net.Uri
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.ArrayAdapter
          import android.widget.Button
          import android.widget.EditText
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.Spinner
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import org.json.JSONArray
          import org.json.JSONObject

          data class Listing(
              val id: Long,
              val name: String,
              val category: String,
              val price: String,
              val quantity: String,
              val location: String,
              val seller: String,
              val phone: String,
              val description: String,
              val photoUri: String,
              val isMine: Boolean
          )

          class MainActivity : AppCompatActivity() {

              private val green = Color.rgb(23, 107, 53)
              private val darkGreen = Color.rgb(13, 77, 37)
              private val gold = Color.rgb(244, 196, 48)
              private val background = Color.rgb(245, 248, 243)
              private val textColor = Color.rgb(24, 53, 31)
              private val white = Color.WHITE

              private val categories = arrayOf(
                  "Crops and Farm Produce",
                  "Pigs and Piglets",
                  "Fish and Aquaculture",
                  "Other Livestock",
                  "Poultry",
                  "Seeds and Seedlings",
                  "Farm Equipment"
              )

              private var selectedPhotoUri: Uri? = null
              private var selectedPhotoView: ImageView? = null

              private val photoPicker =
                  registerForActivityResult(
                      ActivityResultContracts.OpenDocument()
                  ) { uri ->

                      if (uri != null) {

                          try {
                              contentResolver.takePersistableUriPermission(
                                  uri,
                                  Intent.FLAG_GRANT_READ_URI_PERMISSION
                              )
                          } catch (_: Exception) {
                          }

                          selectedPhotoUri = uri

                          selectedPhotoView?.let { image ->
                              image.setImageURI(uri)
                              image.visibility = View.VISIBLE
                          }
                      }
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  seedListings()
                  showHome()
              }

              private fun dp(value: Int): Int =
                  (value * resources.displayMetrics.density).toInt()

              private fun rootLayout(): LinearLayout {

                  return LinearLayout(this).apply {

                      orientation = LinearLayout.VERTICAL

                      setBackgroundColor(background)

                      setPadding(
                          dp(18),
                          dp(18),
                          dp(18),
                          dp(24)
                      )
                  }
              }

              private fun scrollRoot(): ScrollView {

                  return ScrollView(this).apply {
                      isFillViewport = true
                      setBackgroundColor(background)
                  }
              }

              private fun heading(
                  textValue: String,
                  size: Float = 28f
              ): TextView {

                  return TextView(this).apply {

                      text = textValue
                      textSize = size

                      setTextColor(green)

                      setTypeface(
                          null,
                          Typeface.BOLD
                      )

                      setPadding(
                          0,
                          dp(8),
                          0,
                          dp(12)
                      )
                  }
              }

              private fun button(
                  textValue: String,
                  goldButton: Boolean = false
              ): Button {

                  return Button(this).apply {

                      text = textValue

                      textSize = 15f

                      isAllCaps = false

                      isClickable = true
                      isFocusable = true

                      setTypeface(
                          null,
                          Typeface.BOLD
                      )

                      setTextColor(
                          if (goldButton) textColor
                          else white
                      )

                      setBackgroundResource(
                          if (goldButton)
                              R.drawable.button_gold
                          else
                              R.drawable.button_green
                      )

                      stateListAnimator = null

                      minHeight = dp(52)

                      layoutParams =
                          LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.WRAP_CONTENT
                          ).apply {
                              setMargins(
                                  0,
                                  dp(5),
                                  0,
                                  dp(5)
                              )
                          }
                  }
              }

              private fun input(
                  hintValue: String,
                  multiline: Boolean = false
              ): EditText {

                  return EditText(this).apply {

                      hint = hintValue
                      textSize = 16f

                      setTextColor(textColor)

                      setSingleLine(!multiline)

                      if (multiline) {
                          minLines = 4
                          gravity = Gravity.TOP
                      }

                      layoutParams =
                          LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.WRAP_CONTENT
                          ).apply {
                              setMargins(
                                  0,
                                  dp(5),
                                  0,
                                  dp(5)
                              )
                          }
                  }
              }

              private fun showHome() {

                  val root = rootLayout()

                  root.gravity = Gravity.CENTER

                  val logo =
                      heading(
                          "FarmersMeet",
                          40f
                      )

                  logo.gravity = Gravity.CENTER

                  logo.setPadding(
                      0,
                      dp(10),
                      0,
                      dp(10)
                  )

                  root.addView(logo)

                  root.addView(
                      TextView(this).apply {

                          text =
                              "Nigeria's agricultural marketplace"

                          textSize = 17f

                          setTextColor(textColor)

                          gravity = Gravity.CENTER

                          setPadding(
                              dp(10),
                              0,
                              dp(10),
                              dp(28)
                          )
                      }
                  )

                  root.addView(
                      TextView(this).apply {

                          text =
                              "Buy • Sell • Connect"

                          textSize = 15f

                          setTextColor(green)

                          gravity = Gravity.CENTER

                          setPadding(
                              0,
                              0,
                              0,
                              dp(25)
                          )
                      }
                  )

                  root.addView(
                      button(
                          "Enter Marketplace",
                          true
                      ).apply {

                          setOnClickListener {
                              showMarketplace()
                          }
                      }
                  )

                  setContentView(root)
              }

              private fun showMarketplace() {

                  val scroll = scrollRoot()
                  val root = rootLayout()

                  root.addView(
                      heading(
                          "FarmersMeet Marketplace"
                      )
                  )

                  root.addView(
                      TextView(this).apply {

                          text =
                              "Buy and sell agricultural products across Nigeria."

                          textSize = 16f

                          setTextColor(textColor)

                          setPadding(
                              0,
                              0,
                              0,
                              dp(12)
                          )
                      }
                  )

                  val search = input(
                      "Search pigs, fish, crops, equipment..."
                  )

                  root.addView(search)

                  root.addView(
                      button(
                          "Search",
                          true
                      ).apply {

                          setOnClickListener {

                              showSearchResults(
                                  search.text
                                      .toString()
                                      .trim()
                              )
                          }
                      }
                  )

                  root.addView(
                      button(
                          "♥ My Favorites"
                      ).apply {

                          setOnClickListener {
                              showFavorites()
                          }
                      }
                  )

                  root.addView(
                      button(
                          "My Listings"
                      ).apply {

                          setOnClickListener {
                              showMyListings()
                          }
                      }
                  )

                  root.addView(
                      heading(
                          "Browse Categories",
                          21f
                      )
                  )

                  categories.forEach { category ->

                      root.addView(
                          button(category).apply {

                              setOnClickListener {
                                  showListings(category)
                              }
                          }
                      )
                  }

                  root.addView(
                      button(
                          "Sell an Item",
                          true
                      ).apply {

                          setOnClickListener {
                              showSell()
                          }
                      }
                  )

                  scroll.addView(root)

                  setContentView(scroll)
              }

              private fun showListings(
                  category: String
              ) {

                  val results =
                      getListings()
                          .filter {
                              it.category == category
                          }
                          .reversed()

                  showListingPage(
                      category,
                      results
                  )
              }

              private fun showSearchResults(
                  query: String
              ) {

                  val lower =
                      query.lowercase()

                  val results =
                      if (lower.isEmpty()) {

                          getListings()

                      } else {

                          getListings().filter {

                              it.name
                                  .lowercase()
                                  .contains(lower) ||

                              it.category
                                  .lowercase()
                                  .contains(lower) ||

                              it.location
                                  .lowercase()
                                  .contains(lower) ||

                              it.seller
                                  .lowercase()
                                  .contains(lower)
                          }
                      }

                  showListingPage(
                      if (query.isEmpty())
                          "All Listings"
                      else
                          "Search: $query",
                      results.reversed()
                  )
              }

              private fun showFavorites() {

                  val results =
                      getListings()
                          .filter {
                              isFavorite(it.id)
                          }
                          .reversed()

                  showListingPage(
                      "My Favorites",
                      results
                  )
              }

              private fun showMyListings() {

                  val results =
                      getListings()
                          .filter {
                              it.isMine
                          }
                          .reversed()

                  showListingPage(
                      "My Listings",
                      results,
                      true
                  )
              }

              private fun showListingPage(
                  pageTitle: String,
                  results: List<Listing>,
                  mineOnly: Boolean = false
              ) {

                  val scroll = scrollRoot()
                  val root = rootLayout()

                  root.addView(
                      heading(pageTitle)
                  )

                  if (results.isEmpty()) {

                      root.addView(
                          TextView(this).apply {

                              text =
                                  if (mineOnly)
                                      "You have not posted any listings yet."
                                  else
                                      "No listings found."

                              textSize = 18f

                              setTextColor(textColor)

                              setPadding(
                                  0,
                                  dp(20),
                                  0,
                                  dp(30)
                              )
                          }
                      )

                  } else {

                      results.forEach { listing ->

                          addListingCard(
                              root,
                              listing,
                              mineOnly
                          )
                      }
                  }

                  root.addView(
                      button(
                          "Sell an Item",
                          true
                      ).apply {

                          setOnClickListener {
                              showSell()
                          }
                      }
                  )

                  root.addView(
                      button(
                          "Back to Marketplace"
                      ).apply {

                          setOnClickListener {
                              showMarketplace()
                          }
                      }
                  )

                  scroll.addView(root)

                  setContentView(scroll)
              }

              private fun addListingCard(
                  root: LinearLayout,
                  listing: Listing,
                  mineOnly: Boolean
              ) {

                  val card =
                      LinearLayout(this).apply {

                          orientation =
                              LinearLayout.VERTICAL

                          setBackgroundResource(
                              R.drawable.card_background
                          )

                          layoutParams =
                              LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.WRAP_CONTENT
                              ).apply {

                                  setMargins(
                                      0,
                                      0,
                                      0,
                                      dp(14)
                                  )
                              }
                      }

                  if (listing.photoUri.isNotEmpty()) {

                      try {

                          val image =
                              ImageView(this)

                          image.layoutParams =
                              LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  dp(210)
                              )

                          image.scaleType =
                              ImageView.ScaleType.CENTER_CROP

                          image.setImageURI(
                              Uri.parse(
                                  listing.photoUri
                              )
                          )

                          card.addView(image)

                      } catch (_: Exception) {
                      }
                  }

                  card.addView(
                      TextView(this).apply {

                          text = listing.name

                          textSize = 21f

                          setTextColor(green)

                          setTypeface(
                              null,
                              Typeface.BOLD
                          )

                          setPadding(
                              0,
                              dp(8),
                              0,
                              dp(3)
                          )
                      }
                  )

                  card.addView(
                      TextView(this).apply {

                          text = listing.price

                          textSize = 20f

                          setTextColor(darkGreen)

                          setTypeface(
                              null,
                              Typeface.BOLD
                          )
                      }
                  )

                  card.addView(
                      TextView(this).apply {

                          text =
                              "Quantity: ${listing.quantity}\n" +
                              "Location: ${listing.location}\n" +
                              "Seller: ${listing.seller}"

                          textSize = 15f

                          setTextColor(textColor)

                          setPadding(
                              0,
                              dp(7),
                              0,
                              dp(7)
                          )
                      }
                  )

                  card.addView(
                      button(
                          if (isFavorite(listing.id))
                              "♥ Remove Favorite"
                          else
                              "♡ Save Favorite"
                      ).apply {

                          setOnClickListener {

                              toggleFavorite(
                                  listing.id
                              )

                              text =
                                  if (
                                      isFavorite(
                                          listing.id
                                      )
                                  )
                                      "♥ Remove Favorite"
                                  else
                                      "♡ Save Favorite"
                          }
                      }
                  )

                  card.addView(
                      button(
                          "View Details",
                          true
                      ).apply {

                          setOnClickListener {
                              showDetails(listing)
                          }
                      }
                  )

                  if (
                      mineOnly &&
                      listing.isMine
                  ) {

                      card.addView(
                          button(
                              "Delete Listing"
                          ).apply {

                              setOnClickListener {

                                  deleteListing(
                                      listing.id
                                  )

                                  Toast.makeText(
                                      this@MainActivity,
                                      "Listing deleted.",
                                      Toast.LENGTH_SHORT
                                  ).show()

                                  showMyListings()
                              }
                          }
                      )
                  }

                  root.addView(card)
              }

              private fun showDetails(
                  listing: Listing
              ) {

                  val scroll = scrollRoot()
                  val root = rootLayout()

                  root.addView(
                      heading(listing.name)
                  )

                  if (listing.photoUri.isNotEmpty()) {

                      try {

                          val image =
                              ImageView(this)

                          image.layoutParams =
                              LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  dp(280)
                              )

                          image.scaleType =
                              ImageView.ScaleType.CENTER_CROP

                          image.setImageURI(
                              Uri.parse(
                                  listing.photoUri
                              )
                          )

                          root.addView(image)

                      } catch (_: Exception) {
                      }
                  }

                  root.addView(
                      TextView(this).apply {

                          text =
                              "PRICE\n${listing.price}\n\n" +
                              "CATEGORY\n${listing.category}\n\n" +
                              "QUANTITY\n${listing.quantity}\n\n" +
                              "LOCATION\n${listing.location}\n\n" +
                              "SELLER\n${listing.seller}\n\n" +
                              "PHONE\n${listing.phone}\n\n" +
                              "DESCRIPTION\n" +
                              if (
                                  listing.description.isEmpty()
                              )
                                  "No description provided."
                              else
                                  listing.description

                          textSize = 17f

                          setTextColor(textColor)

                          setPadding(
                              0,
                              dp(15),
                              0,
                              dp(15)
                          )
                      }
                  )

                  root.addView(
                      button(
                          if (isFavorite(listing.id))
                              "♥ Remove Favorite"
                          else
                              "♡ Save Favorite"
                      ).apply {

                          setOnClickListener {

                              toggleFavorite(
                                  listing.id
                              )

                              text =
                                  if (
                                      isFavorite(
                                          listing.id
                                      )
                                  )
                                      "♥ Remove Favorite"
                                  else
                                      "♡ Save Favorite"
                          }
                      }
                  )

                  root.addView(
                      button(
                          "Call Seller",
                          true
                      ).apply {

                          setOnClickListener {

                              if (
                                  listing.phone.isEmpty()
                              ) {

                                  Toast.makeText(
                                      this@MainActivity,
                                      "No phone number provided.",
                                      Toast.LENGTH_SHORT
                                  ).show()

                              } else {

                                  startActivity(
                                      Intent(
                                          Intent.ACTION_DIAL,
                                          Uri.parse(
                                              "tel:${listing.phone}"
                                          )
                                      )
                                  )
                              }
                          }
                      }
                  )

                  root.addView(
                      button(
                          "WhatsApp Seller"
                      ).apply {

                          setOnClickListener {

                              if (
                                  listing.phone.isEmpty()
                              ) {

                                  Toast.makeText(
                                      this@MainActivity,
                                      "No phone number provided.",
                                      Toast.LENGTH_SHORT
                                  ).show()

                              } else {

                                  val clean =
                                      listing.phone
                                          .replace("+", "")
                                          .replace(" ", "")
                                          .replace("-", "")

                                  val message =
                                      "Hello, I saw your ${listing.name} listing on FarmersMeet."

                                  val uri =
                                      Uri.parse(
                                          "https://wa.me/$clean?text=" +
                                          Uri.encode(message)
                                      )

                                  startActivity(
                                      Intent(
                                          Intent.ACTION_VIEW,
                                          uri
                                      )
                                  )
                              }
                          }
                      }
                  )

                  if (listing.isMine) {

                      root.addView(
                          button(
                              "Delete Listing"
                          ).apply {

                              setOnClickListener {

                                  deleteListing(
                                      listing.id
                                  )

                                  Toast.makeText(
                                      this@MainActivity,
                                      "Listing deleted.",
                                      Toast.LENGTH_SHORT
                                  ).show()

                                  showMyListings()
                              }
                          }
                      )
                  }

                  root.addView(
                      button(
                          "Back to Listings"
                      ).apply {

                          setOnClickListener {
                              showListings(
                                  listing.category
                              )
                          }
                      }
                  )

                  root.addView(
                      button(
                          "Marketplace",
                          true
                      ).apply {

                          setOnClickListener {
                              showMarketplace()
                          }
                      }
                  )

                  scroll.addView(root)

                  setContentView(scroll)
              }

              private fun showSell() {

                  selectedPhotoUri = null
                  selectedPhotoView = null

                  val scroll = scrollRoot()
                  val root = rootLayout()

                  root.addView(
                      heading("Sell an Item")
                  )

                  root.addView(
                      TextView(this).apply {

                          text =
                              "Create a listing for buyers on FarmersMeet."

                          textSize = 15f

                          setTextColor(textColor)

                          setPadding(
                              0,
                              0,
                              0,
                              dp(10)
                          )
                      }
                  )

                  val category =
                      Spinner(this)

                  category.adapter =
                      ArrayAdapter(
                          this,
                          android.R.layout.simple_spinner_dropdown_item,
                          categories
                      )

                  root.addView(category)

                  root.addView(
                      TextView(this).apply {

                          text = "Product Photo"

                          textSize = 17f

                          setTextColor(green)

                          setTypeface(
                              null,
                              Typeface.BOLD
                          )

                          setPadding(
                              0,
                              dp(16),
                              0,
                              dp(6)
                          )
                      }
                  )

                  val photo =
                      ImageView(this).apply {

                          layoutParams =
                              LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  dp(220)
                              )

                          scaleType =
                              ImageView.ScaleType.CENTER_CROP

                          setBackgroundColor(
                              Color.LTGRAY
                          )

                          visibility = View.GONE
                      }

                  selectedPhotoView = photo

                  root.addView(photo)

                  root.addView(
                      button(
                          "Choose Product Photo",
                          true
                      ).apply {

                          setOnClickListener {

                              photoPicker.launch(
                                  arrayOf("image/*")
                              )
                          }
                      }
                  )

                  val name =
                      input("Product name")

                  val price =
                      input("Price in Naira")

                  val quantity =
                      input("Quantity")

                  val location =
                      input("Location")

                  val seller =
                      input("Seller name")

                  val phone =
                      input("Phone number")

                  val description =
                      input(
                          "Description",
                          true
                      )

                  root.addView(name)
                  root.addView(price)
                  root.addView(quantity)
                  root.addView(location)
                  root.addView(seller)
                  root.addView(phone)
                  root.addView(description)

                  root.addView(
                      button(
                          "Post Listing",
                          true
                      ).apply {

                          setOnClickListener {

                              val required =
                                  listOf(
                                      name,
                                      price,
                                      quantity,
                                      location,
                                      seller,
                                      phone
                                  )

                              if (
                                  required.any {
                                      it.text
                                          .toString()
                                          .trim()
                                          .isEmpty()
                                  }
                              ) {

                                  Toast.makeText(
                                      this@MainActivity,
                                      "Please complete all required fields.",
                                      Toast.LENGTH_SHORT
                                  ).show()

                                  return@setOnClickListener
                              }

                              val listing =
                                  Listing(
                                      System.currentTimeMillis(),
                                      name.text
                                          .toString()
                                          .trim(),

                                      category
                                          .selectedItem
                                          .toString(),

                                      "₦" +
                                          price.text
                                              .toString()
                                              .trim(),

                                      quantity.text
                                          .toString()
                                          .trim(),

                                      location.text
                                          .toString()
                                          .trim(),

                                      seller.text
                                          .toString()
                                          .trim(),

                                      phone.text
                                          .toString()
                                          .trim(),

                                      description.text
                                          .toString()
                                          .trim(),

                                      selectedPhotoUri
                                          ?.toString()
                                          ?: "",

                                      true
                                  )

                              saveListing(listing)

                              Toast.makeText(
                                  this@MainActivity,
                                  "Listing posted successfully!",
                                  Toast.LENGTH_LONG
                              ).show()

                              showListings(
                                  listing.category
                              )
                          }
                      }
                  )

                  root.addView(
                      button(
                          "Back to Marketplace"
                      ).apply {

                          setOnClickListener {
                              showMarketplace()
                          }
                      }
                  )

                  scroll.addView(root)

                  setContentView(scroll)
              }

              private fun saveListing(
                  listing: Listing
              ) {

                  val prefs =
                      getSharedPreferences(
                          "farmersmeet",
                          Context.MODE_PRIVATE
                      )

                  val array =
                      JSONArray(
                          prefs.getString(
                              "listings",
                              "[]"
                          ) ?: "[]"
                      )

                  val item =
                      JSONObject()

                  item.put("id", listing.id)
                  item.put("name", listing.name)
                  item.put("category", listing.category)
                  item.put("price", listing.price)
                  item.put("quantity", listing.quantity)
                  item.put("location", listing.location)
                  item.put("seller", listing.seller)
                  item.put("phone", listing.phone)
                  item.put("description", listing.description)
                  item.put("photoUri", listing.photoUri)
                  item.put("isMine", listing.isMine)

                  array.put(item)

                  prefs.edit()
                      .putString(
                          "listings",
                          array.toString()
                      )
                      .apply()
              }

              private fun getListings():
                  List<Listing> {

                  val prefs =
                      getSharedPreferences(
                          "farmersmeet",
                          Context.MODE_PRIVATE
                      )

                  val array =
                      JSONArray(
                          prefs.getString(
                              "listings",
                              "[]"
                          ) ?: "[]"
                      )

                  val result =
                      mutableListOf<Listing>()

                  for (
                      i in 0 until array.length()
                  ) {

                      val item =
                          array.getJSONObject(i)

                      result.add(
                          Listing(

                              item.optLong(
                                  "id",
                                  i.toLong()
                              ),

                              item.optString(
                                  "name"
                              ),

                              item.optString(
                                  "category"
                              ),

                              item.optString(
                                  "price"
                              ),

                              item.optString(
                                  "quantity"
                              ),

                              item.optString(
                                  "location"
                              ),

                              item.optString(
                                  "seller"
                              ),

                              item.optString(
                                  "phone"
                              ),

                              item.optString(
                                  "description"
                              ),

                              item.optString(
                                  "photoUri"
                              ),

                              item.optBoolean(
                                  "isMine",
                                  false
                              )
                          )
                      )
                  }

                  return result
              }

              private fun isFavorite(
                  id: Long
              ): Boolean {

                  val prefs =
                      getSharedPreferences(
                          "farmersmeet",
                          Context.MODE_PRIVATE
                      )

                  val favorites =
                      prefs.getStringSet(
                          "favorites",
                          emptySet()
                      ) ?: emptySet()

                  return favorites.contains(
                      id.toString()
                  )
              }

              private fun toggleFavorite(
                  id: Long
              ) {

                  val prefs =
                      getSharedPreferences(
                          "farmersmeet",
                          Context.MODE_PRIVATE
                      )

                  val favorites =
                      prefs.getStringSet(
                          "favorites",
                          emptySet()
                      )?.toMutableSet()
                      ?: mutableSetOf()

                  val key = id.toString()

                  if (
                      favorites.contains(key)
                  ) {
                      favorites.remove(key)
                  } else {
                      favorites.add(key)
                  }

                  prefs.edit()
                      .putStringSet(
                          "favorites",
                          favorites
                      )
                      .apply()
              }

              private fun deleteListing(
                  id: Long
              ) {

                  val prefs =
                      getSharedPreferences(
                          "farmersmeet",
                          Context.MODE_PRIVATE
                      )

                  val array =
                      JSONArray(
                          prefs.getString(
                              "listings",
                              "[]"
                          ) ?: "[]"
                      )

                  val newArray =
                      JSONArray()

                  for (
                      i in 0 until array.length()
                  ) {

                      val item =
                          array.getJSONObject(i)

                      if (
                          item.optLong("id") != id
                      ) {
                          newArray.put(item)
                      }
                  }

                  val favorites =
                      prefs.getStringSet(
                          "favorites",
                          emptySet()
                      )?.toMutableSet()
                      ?: mutableSetOf()

                  favorites.remove(
                      id.toString()
                  )

                  prefs.edit()
                      .putString(
                          "listings",
                          newArray.toString()
                      )
                      .putStringSet(
                          "favorites",
                          favorites
                      )
                      .apply()
              }

