name: FarmersMeet Stage 10 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build FarmersMeet Stage 10
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Prepare FarmersMeet source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf FarmersMeet

          mkdir -p FarmersMeet

          if [ -f "FarmersMeet_Nigeria_V2_Full_Source.zip" ]; then
            unzip -q "FarmersMeet_Nigeria_V2_Full_Source.zip" \
              -d FarmersMeet/extracted

            if [ -d "FarmersMeet/extracted/FarmersMeet_V2/android" ]; then
              cp -a \
                FarmersMeet/extracted/FarmersMeet_V2/android/. \
                FarmersMeet/

            elif [ -d "FarmersMeet/extracted/android" ]; then
              cp -a \
                FarmersMeet/extracted/android/. \
                FarmersMeet/

            else
              echo "ERROR: Android project was not found inside the source archive."
              find FarmersMeet/extracted -maxdepth 5 -type f | sort
              exit 1
            fi

          elif [ -f "settings.gradle" ] && [ -d "app" ]; then
            echo "Android project already exists at repository root."

            cp -a . FarmersMeet

          else
            echo "ERROR: FarmersMeet Android source was not found."
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          test -f FarmersMeet/settings.gradle
          test -f FarmersMeet/build.gradle
          test -f FarmersMeet/app/build.gradle
          test -f FarmersMeet/app/src/main/AndroidManifest.xml

          echo "FarmersMeet Android source verified."

      - name: Install Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p FarmersMeet/app

          if [ -f "Settings/google-services.json" ]; then
            cp \
              Settings/google-services.json \
              FarmersMeet/app/google-services.json

          elif [ -f "google-services.json" ]; then
            cp \
              google-services.json \
              FarmersMeet/app/google-services.json

          elif [ -f "FarmersMeet/app/google-services.json" ]; then
            echo "Firebase configuration already exists."

          else
            echo "ERROR: google-services.json was not found."
            exit 1
          fi

          test -s FarmersMeet/app/google-services.json

          echo "Firebase configuration installed."

      - name: Configure AndroidX and Gradle
        shell: bash
        run: |
          set -euo pipefail

          cat > FarmersMeet/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.code.style=official
          EOF

          cat > FarmersMeet/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "FarmersMeet"

          include(":app")
          EOF

          cat > FarmersMeet/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
              id 'com.google.gms.google-services' version '4.4.2' apply false
          }
          EOF

          echo "AndroidX and Gradle configuration created."

      - name: Configure Firebase Gradle plugin
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("FarmersMeet/app/build.gradle")
          text = path.read_text()

          if "com.google.gms.google-services" not in text:
              marker = "id 'org.jetbrains.kotlin.android'"

              if marker in text:
                  text = text.replace(
                      marker,
                      marker + "\n    id 'com.google.gms.google-services'",
                      1
                  )
              else:
                  text = (
                      "plugins {\n"
                      "    id 'com.android.application'\n"
                      "    id 'org.jetbrains.kotlin.android'\n"
                      "    id 'com.google.gms.google-services'\n"
                      "}\n\n"
                      + text
                  )

          path.write_text(text)
          PY

          echo "Google Services plugin configured."

      - name: Verify Firebase package
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json

          path = "FarmersMeet/app/google-services.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          expected = "ng.farmersmeet.nigeria"
          packages = []

          for client in data.get("client", []):
              package_name = (
                  client
                  .get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name")
              )

              if package_name:
                  packages.append(package_name)

          print("Firebase Android package(s):")
          for package_name in packages:
              print(" -", package_name)

          if expected not in packages:
              raise SystemExit(
                  "ERROR: Firebase package mismatch. "
                  f"Expected {expected}; found {packages}"
              )

          print("Firebase package verification PASSED.")
          PY

      - name: Verify AndroidX is enabled
        shell: bash
        run: |
          set -euo pipefail

          test "$(grep -c '^android.useAndroidX=true$' FarmersMeet/gradle.properties)" -eq 1
          test "$(grep -c '^android.enableJetifier=true$' FarmersMeet/gradle.properties)" -eq 1

          echo "AndroidX is ENABLED."
          echo "Jetifier is ENABLED."

      - name: Build Stage 10 debug APK
        working-directory: FarmersMeet
        shell: bash
        run: |
          set -euo pipefail

          gradle :app:assembleDebug --stacktrace

      - name: Verify Stage 10 APK
        shell: bash
        run: |
          set -euo pipefail

          APK="FarmersMeet/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: Stage 10 APK was not generated."
            exit 1
          fi

          echo
          echo "=========================================="
          echo " FARMERSMEET STAGE 10 APK SUCCESSFULLY BUILT"
          echo "=========================================="
          echo

          ls -lh "$APK"

      - name: Upload Stage 10 APK
        uses: actions/upload-artifact@v4
        with:
          name: FarmersMeet-Stage-10-APK
          path: FarmersMeet/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
