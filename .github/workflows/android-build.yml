name: FarmersMeet Stage 9 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build FarmersMeet Stage 9
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Check Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          test -d "$ANDROID_HOME"

          echo "Installed Android platforms:"
          ls -la "$ANDROID_HOME/platforms" || true

          echo
          echo "Installed Android build tools:"
          ls -la "$ANDROID_HOME/build-tools" || true

      - name: Create FarmersMeet Stage 9 project
        shell: bash
        run: |
          set -e

          rm -rf FarmersMeet

          mkdir -p FarmersMeet/app/src/main/java/ng/farmersmeet/nigeria
          mkdir -p FarmersMeet/app/src/main/res/values

          cat > FarmersMeet/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "FarmersMeetNigeria"
          include(":app")
          EOF

          cat > FarmersMeet/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat > FarmersMeet/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > FarmersMeet/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'ng.farmersmeet.nigeria'
              compileSdk 35

              defaultConfig {
                  applicationId 'ng.farmersmeet.nigeria"
                  minSdk 24
                  targetSdk 35

                  versionCode 10
                  versionName "9.0"
              }

              buildTypes {
                  debug {
                      debuggable true
                      minifyEnabled false
                  }

                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.15.0'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.activity:activity-ktx:1.10.1'
          }
          EOF

          cat > FarmersMeet/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="FarmersMeet"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > FarmersMeet/app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="Theme.AppCompat.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#176B35</item>
                  <item name="android:statusBarColor">#0D4D25</item>
                  <item name="android:navigationBarColor">#0D4D25</item>
                  <item name="android:windowLightStatusBar">false</item>

              </style>

          </resources>
          EOF

          cat > FarmersMeet/app/src/main/java/ng/farmersmeet/nigeria/MainActivity.kt <<'EOF'
          package ng.farmersmeet.nigeria

          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.ArrayAdapter
          import android.widget.Button
          import android.widget.EditText
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.Spinner
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import org.json.JSONArray
          import org.json.JSONObject

          data class Listing(
              val id: Long,
              val name: String,
              val category: String,
              val price: String,
              val quantity: String,
              val location: String,
              val seller: String,
              val phone: String,
              val description: String,
              val photoUri: String,
              val isMine: Boolean
          )

          data class SellerProfile(
              val name: String,
              val farmName: String,
              val phone: String,
              val location: String,
              val about: String
          )

          class MainActivity : AppCompatActivity() {

              private val green = Color.rgb(23, 107, 53)
              private val darkGreen = Color.rgb(13, 77, 37)
              private val yellow = Color.rgb(244, 196, 48)
              private val backgroundColor = Color.rgb(247, 250, 245)
              private val textColor = Color.rgb(24, 53, 31)

              private val categories = arrayOf(
                  "Crops and Farm Produce",
                  "Pigs and Piglets",
                  "Fish and Aquaculture",
                  "Other Livestock",
                  "Poultry",
                  "Seeds and Seedlings",
                  "Farm Equipment"
              )

              private var selectedPhotoUri: Uri? = null
              private var selectedPhotoView: ImageView? = null

              private val photoPicker =
                  registerForActivityResult(
                      ActivityResultContracts.OpenDocument()
                  ) { uri: Uri? ->

                      if (uri != null) {

                          try {
                              contentResolver.takePersistableUriPermission(
                                  uri,
                                  Intent.FLAG_GRANT_READ_URI_PERMISSION
                              )
                          } catch (_: Exception) {
                          }

                          selectedPhotoUri = uri

                          selectedPhotoView?.apply {
                              setImageURI(uri)
                              visibility = ImageView.VISIBLE
                          }
                      }
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  seedListings()
                  showHome()
              }

              private fun baseLayout(): LinearLayout {
                  return LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(backgroundColor)
                      setPadding(20, 20, 20, 20)
                  }
              }

              private fun heading(value: String): TextView {
                  return TextView(this).apply {
                      text = value
                      textSize = 28f
                      setTextColor(green)
                      setTypeface(
                          null,
                          android.graphics.Typeface.BOLD
                      )
                      setPadding(0, 10, 0, 18)
                  }
              }

              private fun makeButton(
                  value: String,
                  yellowButton: Boolean = false
              ): Button {

                  return Button(this).apply {

                      text = value
                      textSize = 15f

                      setTypeface(
                          null,
                          android.graphics.Typeface.BOLD
                      )

                      setTextColor(
                          if (yellowButton) {
                              textColor
                          } else {
                              Color.WHITE
                          }
                      )

                      setBackgroundColor(
                          if (yellowButton) {
                              yellow
                          } else {
                              green
                          }
                      )

                      layoutParams =
                          LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT,
                              LinearLayout.LayoutParams.WRAP_CONTENT
                          ).apply {
                              setMargins(0, 6, 0, 6)
                          }
                  }
              }

              private fun showHome() {

                  val root = baseLayout()

                  root.gravity = Gravity.CENTER

                  val logo = heading("FarmersMeet")

                  logo.textSize = 40f
                  logo.gravity = Gravity.CENTER

                  val subtitle = TextView(this).apply {
                      text =
                          "Connecting farmers, buyers and agricultural businesses"
                      textSize = 16f
                      setTextColor(textColor)
                      gravity = Gravity.CENTER
                      setPadding(10, 0, 10, 25)
                  }

                  val stage = TextView(this).apply {
                      text = "STAGE 9"
                      textSize = 13f
                      setTextColor(green)
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 12)
                  }

                  val enter =
                      makeButton(
                          "ENTER MARKETPLACE",
                          true
                      )

                  enter.setOnClickListener {
                      showMarketplace()
                  }

                  root.addView(logo)
                  root.addView(stage)
                  root.addView(subtitle)
                  root.addView(enter)

                  setContentView(root)
              }

              private fun showMarketplace() {

                  val scroll = ScrollView(this)
                  val root = baseLayout()

                  root.addView(
                      heading("FarmersMeet Marketplace")
                  )

                  root.addView(
                      TextView(this).apply {
                          text =
                              "Buy and sell agricultural products"
                          textSize = 16f
                          setTextColor(textColor)
                          setPadding(0, 0, 0, 12)
                      }
                  )

                  val search = EditText(this).apply {
                      hint =
                          "Search pigs, fish, crops..."
                      textSize = 16f
                      setSingleLine(true)
                      setTextColor(textColor)
                  }

                  root.addView(search)

                  val searchButton =
                      makeButton("SEARCH", true)

                  searchButton.setOnClickListener {
                      showSearchResults(
                          search.text.toString().trim()
                      )
                  }

                  root.addView(searchButton)

                  val profile =
                      makeButton("MY SELLER PROFILE")

                  profile.setOnClickListener {
                      showSellerProfile()
                  }

                  root.addView(profile)

                  val favorites =
                      makeButton("MY FAVORITES")

                  favorites.setOnClickListener {
                      showFavorites()
                  }

                  root.addView(favorites)

                  val myListings =
                      makeButton("MY LISTINGS")

                  myListings.setOnClickListener {
                      showMyListings()
                  }

                  root.addView(myListings)

                  root.addView(
                      TextView(this).apply {
                          text = "Browse Categories"
                          textSize = 21f
                          setTextColor(green)
                          setTypeface(
                              null,
                              android.graphics.Typeface.BOLD
                          )
                          setPadding(0, 15, 0, 8)
                      }
                  )

                  categories.forEach { category ->

                      val button =
                          makeButton(category)

                      button.setOnClickListener {
                          showListings(category)
                      }

                      root.addView(button)
                  }

                  val sell =
                      makeButton(
                          "SELL AN ITEM",
                          true
                      )

                  sell.setOnClickListener {
                      showSell(null)
                  }

                  root.addView(sell)

                  scroll.addView(root)

                  setContentView(scroll)
              }

              private fun showSellerProfile() {

                  val profile = getProfile()

                  val scroll = ScrollView(this)
                  val root = baseLayout()

                  root.addView(
                      heading("My Seller Profile")
                  )

                  val name = field("Your name")
                  name.setText(profile.name)

                  val farm =
                      field("Farm / Business name")
                  farm.setText(profile.farmName)

                  val phone =
                      field("Phone number")
                  phone.setText(profile.phone)

                  val location =
                      field(
                          "Farm / Business location"
                      )
                  location.setText(profile.location)

                  val about =
                      field(
                          "About your farm or business"
                      )

                  about.setText(profile.about)
                  about.minLines = 5
                  about.gravity = Gravity.TOP

                  root.addView(name)
                  root.addView(farm)
                  root.addView(phone)
                  root.addView(location)
                  root.addView(about)

                  val save =
                      makeButton(
                          "SAVE SELLER PROFILE",
                          true
                      )

                  save.setOnClickListener {

                      if (
                          name.text.toString().trim().isEmpty() ||
                          farm.text.toString().trim().isEmpty() ||
                          phone.text.toString().trim().isEmpty()
                      ) {

                          Toast.makeText(
                              this,
                              "Please provide your name, farm/business name and phone.",
                              Toast.LENGTH_LONG
                          ).show()

                          return@setOnClickListener
                      }

                      saveProfile(
                          SellerProfile(
                              name.text.toString().trim(),
                              farm.text.toString().trim(),
                              phone.text.toString().trim(),
                              location.text.toString().trim(),
                              about.text.toString().trim()
                          )
                      )

                      Toast.makeText(
                          this,
                          "Seller profile saved.",
                          Toast.LENGTH_SHORT
                      ).show()

                      showMarketplace()
                  }

                  root.addView(save)

                  val listings =
                      makeButton("VIEW MY LISTINGS")

                  listings.setOnClickListener {
                      showMyListings()
                  }

                  root.addView(listings)

                  val back =
                      makeButton("BACK TO MARKETPLACE")

                  back.setOnClickListener {
                      showMarketplace()
                  }

                  root.addView(back)

                  scroll.addView(root)
                  setContentView(scroll)
              }

              private fun showListings(
                  category: String
              ) {

                  val results =
                      getListings()
                          .filter {
                              it.category == category
                          }
                          .reversed()

                  showListingPage(
                      category,
                      results
                  )
              }

              private fun showSearchResults(
                  query: String
              ) {

                  val lower =
                      query.lowercase()

                  val results =
                      if (lower.isEmpty()) {

                          getListings()

                      } else {

                          getListings().filter {

                              it.name.lowercase()
                                  .contains(lower) ||

                              it.category.lowercase()
                                  .contains(lower) ||

                              it.location.lowercase()
                                  .contains(lower) ||

                              it.seller.lowercase()
                                  .contains(lower) ||

                              it.description.lowercase()
                                  .contains(lower)
                          }
                      }

                  showListingPage(
                      if (query.isEmpty()) {
                          "All Listings"
                      } else {
                          "Search: $query"
                      },
                      results.reversed()
                  )
              }

              private fun showFavorites() {

                  val favorites =
                      getListings()
                          .filter {
                              isFavorite(it.id)
                          }
                          .reversed()

                  showListingPage(
                      "My Favorites",
                      favorites
                  )
              }

              private fun showMyListings() {

                  val mine =
                      getListings()
                          .filter {
                              it.isMine
                          }
                          .reversed()

                  val scroll = ScrollView(this)
                  val root = baseLayout()

                  root.addView(
                      heading("My Listings")
                  )

                  if (mine.isEmpty()) {

                      root.addView(
                          TextView(this).apply {
                              text =
                                  "You have not posted any listings yet."
                              textSize = 18f
                              setTextColor(textColor)
                              setPadding(
                                  0,
                                  20,
                                  0,
                                  30
                              )
                          }
                      )

                  } else {

                      mine.forEach {
                          addListingCard(
                              root,
                              it,
                              true
                          )
                      }
                  }

                  val sell =
                      makeButton(
                          "SELL AN ITEM",
                          true
                      )

                  sell.setOnClickListener {
                      showSell(null)
                  }

                  root.addView(sell)

                  val back =
                      makeButton(
                          "BACK TO MARKETPLACE"
                      )

                  back.setOnClickListener {
                      showMarketplace()
                  }

                  root.addView(back)

                  scroll.addView(root)
                  setContentView(scroll)
              }

              private fun showListingPage(
                  pageTitle: String,
                  results: List<Listing>
              ) {

                  val scroll = ScrollView(this)
                  val root = baseLayout()

                  root.addView(
                      heading(pageTitle)
                  )

                  if (results.isEmpty()) {

                      root.addView(
                          TextView(this).apply {
                              text =
                                  "No listings found."
                              textSize = 18f
                              setTextColor(textColor)
                              setPadding(
                                  0,
                                  20,
                                  0,
                                  30
                              )
                          }
                      )

                  } else {

                      results.forEach {
                          addListingCard(
                              root,
                              it,
                              false
                          )
                      }
                  }

                  val sell =
                      makeButton(
                          "SELL AN ITEM",
                          true
                      )

                  sell.setOnClickListener {
                      showSell(null)
                  }

                  root.addView(sell)

                  val back =
                      makeButton(
                          "BACK TO MARKETPLACE"
                      )

                  back.setOnClickListener {
                      showMarketplace()
                  }

                  root.addView(back)

                  scroll.addView(root)
                  setContentView(scroll)
              }

              private fun addListingCard(
                  root: LinearLayout,
                  listing: Listing,
                  mineOnly: Boolean
              ) {

                  val card =
                      LinearLayout(this).apply {

                          orientation =
                              LinearLayout.VERTICAL

                          setBackgroundColor(
                              Color.WHITE
                          )

                          setPadding(
                              16,
                              14,
                              16,
                              14
                          )

                          layoutParams =
                              LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  LinearLayout.LayoutParams.WRAP_CONTENT
                              ).apply {
                                  setMargins(
                                      0,
                                      0,
                                      0,
                                      14
                                  )
                              }
                      }

                  if (
                      listing.photoUri.isNotEmpty()
                  ) {

                      try {

                          val image =
                              ImageView(this)

                          image.layoutParams =
                              LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  230
                              )

                          image.scaleType =
                              ImageView.ScaleType.CENTER_CROP

                          image.setImageURI(
                              Uri.parse(
                                  listing.photoUri
                              )
                          )

                          card.addView(image)

                      } catch (_: Exception) {
                      }
                  }

                  card.addView(
                      TextView(this).apply {

                          text = listing.name
                          textSize = 21f
                          setTextColor(green)

                          setTypeface(
                              null,
                              android.graphics.Typeface.BOLD
                          )

                          setPadding(
                              0,
                              8,
                              0,
                              4
                          )
                      }
                  )

                  card.addView(
                      TextView(this).apply {

                          text = listing.price
                          textSize = 20f
                          setTextColor(darkGreen)

                          setTypeface(
                              null,
                              android.graphics.Typeface.BOLD
                          )
                      }
                  )

                  card.addView(
                      TextView(this).apply {

                          text =
                              "Quantity: ${listing.quantity}\n" +
                              "Location: ${listing.location}\n" +
                              "Seller: ${listing.seller}"

                          textSize = 15f
                          setTextColor(textColor)

                          setPadding(
                              0,
                              5,
                              0,
                              8
                          )
                      }
                  )

                  val favorite =
                      makeButton(
                          if (
                              isFavorite(
                                  listing.id
                              )
                          ) {
                              "REMOVE FAVORITE"
                          } else {
                              "SAVE FAVORITE"
                          }
                      )

                  favorite.setOnClickListener {

                      toggleFavorite(
                          listing.id
                      )

                      favorite.text =
                          if (
                              isFavorite(
                                  listing.id
                              )
                          ) {
                              "REMOVE FAVORITE"
                          } else {
                              "SAVE FAVORITE"
                          }
                  }

                  card.addView(favorite)

                  val details =
                      makeButton(
                          "VIEW DETAILS"
                      )

                  details.setOnClickListener {
                      showDetails(listing)
                  }

                  card.addView(details)

                  if (!listing.isMine) {

                      val seller =
                          makeButton(
                              "VIEW SELLER PROFILE"
                          )

                      seller.setOnClickListener {
                          showPublicSellerProfile(
                              listing.seller
                          )
                      }

                      card.addView(seller)
                  }

                  if (
                      mineOnly &&
                      listing.isMine
                  ) {

                      val edit =
                          makeButton(
                              "EDIT LISTING",
                              true
                          )

                      edit.setOnClickListener {
                          showSell(listing)
                      }

                      card.addView(edit)

                      val delete =
                          makeButton(
                              "DELETE LISTING"
                          )

                      delete.setOnClickListener {

                          deleteListing(
                              listing.id
                          )

                          Toast.makeText(
                              this,
                              "Listing deleted.",
                              Toast.LENGTH_SHORT
                          ).show()

                          showMyListings()
                      }

                      card.addView(delete)
                  }

                  root.addView(card)
              }

              private fun showPublicSellerProfile(
                  sellerName: String
              ) {

                  val profile =
                      getProfileForSeller(
                          sellerName
                      )

                  val listings =
                      getListings()
                          .filter {
                              it.seller.equals(
                                  sellerName,
                                  ignoreCase = true
                              )
                          }
                          .reversed()

                  val scroll = ScrollView(this)
                  val root = baseLayout()

                  root.addView(
                      heading(
                          profile.farmName.ifEmpty {
                              sellerName
                          }
                      )
                  )

                  root.addView(
                      TextView(this).apply {

                          text =
                              "SELLER\n${profile.name}\n\n" +
                              "PHONE\n${profile.phone}\n\n" +
                              "LOCATION\n${profile.location}\n\n" +
                              "ABOUT\n" +
                              profile.about.ifEmpty {
                                  "No profile description provided."
                              }

                          textSize = 17f
                          setTextColor(textColor)

                          setPadding(
                              0,
                              5,
                              0,
                              20
                          )
                      }
                  )

                  root.addView(
                      TextView(this).apply {

                          text = "OTHER LISTINGS"
                          textSize = 21f
                          setTextColor(green)

                          setTypeface(
                              null,
                              android.graphics.Typeface.BOLD
                          )

                          setPadding(
                              0,
                              10,
                              0,
                              10
                          )
                      }
                  )

                  listings.forEach {
                      addListingCard(
                          root,
                          it,
                          false
                      )
                  }

                  val call =
                      makeButton(
                          "CALL SELLER",
                          true
                      )

                  call.setOnClickListener {

                      if (
                          profile.phone.isNotEmpty()
                      ) {

                          startActivity(
                              Intent(
                                  Intent.ACTION_DIAL,
                                  Uri.parse(
                                      "tel:${profile.phone}"
                                  )
                              )
                          )
                      }
                  }

                  root.addView(call)

                  val back =
                      makeButton("BACK")

                  back.setOnClickListener {
                      showMarketplace()
                  }

                  root.addView(back)

                  scroll.addView(root)
                  setContentView(scroll)
              }

              private fun getProfileForSeller(
                  seller: String
              ): SellerProfile {

                  val saved = getProfile()

                  if (
                      saved.name.equals(
                          seller,
                          ignoreCase = true
                      )
                  ) {
                      return saved
                  }

                  return SellerProfile(
                      seller,
                      seller,
                      "",
                      "",
                      ""
                  )
              }

              private fun showDetails(
                  listing: Listing
              ) {

                  val scroll = ScrollView(this)
                  val root = baseLayout()

                  root.addView(
                      heading(listing.name)
                  )

                  if (
                      listing.photoUri.isNotEmpty()
                  ) {

                      try {

                          val image =
                              ImageView(this)

                          image.layoutParams =
                              LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  280
                              )

                          image.scaleType =
                              ImageView.ScaleType.CENTER_CROP

                          image.setImageURI(
                              Uri.parse(
                                  listing.photoUri
                              )
                          )

                          root.addView(image)

                      } catch (_: Exception) {
                      }
                  }

                  root.addView(
                      TextView(this).apply {

                          text =
                              "PRICE\n${listing.price}\n\n" +
                              "CATEGORY\n${listing.category}\n\n" +
                              "QUANTITY\n${listing.quantity}\n\n" +
                              "LOCATION\n${listing.location}\n\n" +
                              "SELLER\n${listing.seller}\n\n" +
                              "PHONE\n${listing.phone}\n\n" +
                              "DESCRIPTION\n" +
                              listing.description.ifEmpty {
                                  "No description provided."
                              }

                          textSize = 17f
                          setTextColor(textColor)

                          setPadding(
                              0,
                              15,
                              0,
                              15
                          )
                      }
                  )

                  val favorite =
                      makeButton(
                          if (
                              isFavorite(
                                  listing.id
                              )
                          ) {
                              "REMOVE FAVORITE"
                          } else {
                              "SAVE FAVORITE"
                          }
                      )

                  favorite.setOnClickListener {

                      toggleFavorite(
                          listing.id
                      )

                      favorite.text =
                          if (
                              isFavorite(
                                  listing.id
                              )
                          ) {
                              "REMOVE FAVORITE"
                          } else {
                              "SAVE FAVORITE"
                          }
                  }

                  root.addView(favorite)

                  val call =
                      makeButton(
                          "CALL SELLER",
                          true
                      )

                  call.setOnClickListener {

                      if (
                          listing.phone.isNotEmpty()
                      ) {

                          startActivity(
                              Intent(
                                  Intent.ACTION_DIAL,
                                  Uri.parse(
                                      "tel:${listing.phone}"
                                  )
                              )
                          )
                      }
                  }

                  root.addView(call)

                  val whatsapp =
                      makeButton(
                          "WHATSAPP SELLER"
                      )

                  whatsapp.setOnClickListener {

                      if (
                          listing.phone.isNotEmpty()
                      ) {

                          val clean =
                              listing.phone
                                  .replace(
                                      "+",
                                      ""
                                  )
                                  .replace(
                                      " ",
                                      ""
                                  )

                          val message =
                              "Hello, I saw your ${listing.name} listing on FarmersMeet."

                          val uri =
                              Uri.parse(
                                  "https://wa.me/$clean?text=" +
                                  Uri.encode(message)
                              )

                          startActivity(
                              Intent(
                                  Intent.ACTION_VIEW,
                                  uri
                              )
                          )
                      }
                  }

                  root.addView(whatsapp)

                  if (listing.isMine) {

                      val edit =
                          makeButton(
                              "EDIT LISTING",
                              true
                          )

                      edit.setOnClickListener {
                          showSell(listing)
                      }

                      root.addView(edit)

                      val delete =
                          makeButton(
                              "DELETE LISTING"
                          )

                      delete.setOnClickListener {

                          deleteListing(
                              listing.id
                          )

                          showMyListings()
                      }

                      root.addView(delete)
                  }

                  val back =
                      makeButton("BACK")

                  back.setOnClickListener {
                      showListings(
                          listing.category
                      )
                  }

                  root.addView(back)

                  scroll.addView(root)
                  setContentView(scroll)
              }

              private fun showSell(
                  existing: Listing?
              ) {

                  selectedPhotoUri =
                      if (
                          existing?.photoUri
                              ?.isNotEmpty() == true
                      ) {
                          Uri.parse(
                              existing.photoUri
                          )
                      } else {
                          null
                      }

                  selectedPhotoView = null

                  val scroll = ScrollView(this)
                  val root = baseLayout()

                  root.addView(
                      heading(
                          if (existing == null) {
                              "Sell an Item"
                          } else {
                              "Edit Listing"
                          }
                      )
                  )

                  val category =
                      Spinner(this)

                  category.adapter =
                      ArrayAdapter(
                          this,
                          android.R.layout.simple_spinner_dropdown_item,
                          categories
                      )

                  if (existing != null) {

                      val index =
                          categories.indexOf(
                              existing.category
                          )

                      if (index >= 0) {
                          category.setSelection(
                              index
                          )
                      }
                  }

                  root.addView(category)

                  val photo =
                      ImageView(this)

                  photo.layoutParams =
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          220
                      )

                  photo.scaleType =
                      ImageView.ScaleType.CENTER_CROP

                  photo.setBackgroundColor(
                      Color.LTGRAY
                  )

                  if (
                      selectedPhotoUri != null
                  ) {

                      photo.setImageURI(
                          selectedPhotoUri
                      )

                      photo.visibility =
                          ImageView.VISIBLE

                  } else {

                      photo.visibility =
                          ImageView.GONE
                  }

                  selectedPhotoView = photo

                  root.addView(photo)

                  val choose =
                      makeButton(
                          "CHOOSE PHOTO",
                          true
                      )

                  choose.setOnClickListener {
                      photoPicker.launch(
                          arrayOf("image/*")
                      )
                  }

                  root.addView(choose)

                  val name =
                      field("Product name")

                  val price =
                      field("Price in Naira")

                  val quantity =
                      field("Quantity")

                  val location =
                      field("Location")

                  val seller =
                      field("Seller name")

                  val phone =
                      field("Phone number")

                  val description =
                      field("Description")

                  description.minLines = 4
                  description.gravity =
                      Gravity.TOP

                  if (existing != null) {

                      name.setText(
                          existing.name
                      )

                      price.setText(
                          existing.price.replace(
                              "₦",
                              ""
                          )
                      )

                      quantity.setText(
                          existing.quantity
                      )

                      location.setText(
                          existing.location
                      )

                      seller.setText(
                          existing.seller
                      )

                      phone.setText(
                          existing.phone
                      )

                      description.setText(
                          existing.description
                      )

                  } else {

                      val profile =
                          getProfile()

                      seller.setText(
                          profile.name
                      )

                      phone.setText(
                          profile.phone
                      )

                      location.setText(
                          profile.location
                      )
                  }

                  root.addView(name)
                  root.addView(price)
                  root.addView(quantity)
                  root.addView(location)
                  root.addView(seller)
                  root.addView(phone)
                  root.addView(description)

                  val save =
                      makeButton(
                          if (existing == null) {
                              "POST LISTING"
                          } else {
                              "SAVE CHANGES"
                          },
                          true
                      )

                  save.setOnClickListener {

                      if (
                          name.text.toString()
                              .trim()
                              .isEmpty() ||

                          price.text.toString()
                              .trim()
                              .isEmpty() ||

                          quantity.text.toString()
                              .trim()
                              .isEmpty() ||

                          location.text.toString()
                              .trim()
                              .isEmpty() ||

                          seller.text.toString()
                              .trim()
                              .isEmpty() ||

                          phone.text.toString()
                              .trim()
                              .isEmpty()
                      ) {

                          Toast.makeText(
                              this,
                              "Please complete the required fields.",
                              Toast.LENGTH_LONG
                          ).show()

                          return@setOnClickListener
                      }

                      val id =
                          existing?.id
                              ?: System.currentTimeMillis()

                      val listing =
                          Listing(
                              id,
                              name.text.toString()
                                  .trim(),

                              category.selectedItem
                                  .toString(),

                              "₦" +
                                  price.text.toString()
                                      .trim()
                                      .removePrefix(
                                          "₦"
                                      ),

                              quantity.text.toString()
                                  .trim(),

                              location.text.toString()
                                  .trim(),

                              seller.text.toString()
                                  .trim(),

                              phone.text.toString()
                                  .trim(),

                              description.text.toString()
                                  .trim(),

                              selectedPhotoUri
                                  ?.toString()
                                  ?: existing?.photoUri
                                  ?: "",

                              true
                          )

                      if (existing == null) {

                          saveListing(
                              listing
                          )

                      } else {

                          updateListing(
                              listing
                          )
                      }

                      Toast.makeText(
                          this,
                          if (existing == null) {
                              "Listing posted successfully!"
                          } else {
                              "Listing updated successfully!"
                          },
                          Toast.LENGTH_LONG
                      ).show()

                      showMyListings()
                  }

                  root.addView(save)

                  val cancel =
                      makeButton("CANCEL")

                  cancel.setOnClickListener {
                      showMyListings()
                  }

                  root.addView(cancel)

                  scroll.addView(root)
                  setContentView(scroll)
              }

              private fun field(
                  hintValue: String
              ): EditText {

                  return EditText(this).apply {

                      hint = hintValue
                      textSize = 16f
                      setTextColor(textColor)

                      layoutParams =
                          LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT,
                              LinearLayout.LayoutParams.WRAP_CONTENT
                          ).apply {
                              setMargins(
                                  0,
                                  5,
                                  0,
                                  5
                              )
                          }
                  }
              }

              private fun saveProfile(
                  profile: SellerProfile
              ) {

                  val prefs =
                      getSharedPreferences(
                          "farmersmeet",
                          Context.MODE_PRIVATE
                      )

                  prefs.edit()
                      .putString(
                          "profile_name",
                          profile.name
                      )
                      .putString(
                          "profile_farm",
                          profile.farmName
                      )
                      .putString(
                          "profile_phone",
                          profile.phone
                      )
                      .putString(
                          "profile_location",
                          profile.location
                      )
                      .putString(
                          "profile_about",
                          profile.about
                      )
                      .apply()
              }

              private fun getProfile():
                  SellerProfile {

                  val prefs =
                      getSharedPreferences(
                          "farmersmeet",
                          Context.MODE_PRIVATE
                      )

                  return SellerProfile(

                      prefs.getString(
                          "profile_name",
                          ""
                      ) ?: "",

                      prefs.getString(
                          "profile_farm",
                          ""
                      ) ?: "",

                      prefs.getString(
                          "profile_phone",
                          ""
                      ) ?: "",

                      prefs.getString(
                          "profile_location",
                          ""
                      ) ?: "",

                      prefs.getString(
                          "profile_about",
                          ""
                      ) ?: ""
                  )
              }

              private fun saveListing(
                  listing: Listing
              ) {

                  val prefs =
                      getSharedPreferences(
                          "farmersmeet",
                          Context.MODE_PRIVATE
                      )

                  val array =
                      JSONArray(
                          prefs.getString(
                              "listings",
                              "[]"
                          ) ?: "[]"
                      )

                  array.put(
                      listingToJson(
                          listing
                      )
                  )

                  prefs.edit()
                      .putString(
                          "listings",
                          array.toString()
                      )
                      .apply()
              }

              private fun updateListing(
                  listing: Listing
              ) {

                  val prefs =
                      getSharedPreferences(
                          "farmersmeet",
                          Context.MODE_PRIVATE
                      )

                  val old =
                      JSONArray(
                          prefs.getString(
                              "listings",
                              "[]"
                          ) ?: "[]"
                      )

                  val updated =
                      JSONArray()

                  for (
                      i in 0 until old.length()
                  ) {

                      val item =
                          old.getJSONObject(i)

                      if (
                          item.optLong(
                              "id"
                          ) == listing.id
                      ) {

                          updated.put(
                              listingToJson(
                                  listing
                              )
                          )

                      } else {

                          updated.put(item)
                      }
                  }

                  prefs.edit()
                      .putString(
                          "listings",
                          updated.toString()
                      )
                      .apply()
              }

              private fun listingToJson(
                  listing: Listing
              ): JSONObject {

                  return JSONObject().apply {

                      put(
                          "id",
                          listing.id
                      )

                      put(
                          "name",
                          listing.name
                      )

                      put(
                          "category",
                          listing.category
                      )

                      put(
                          "price",
                          listing.price
                      )

                      put(
                          "quantity",
                          listing.quantity
                      )

                      put(
                          "location",
                          listing.location
                      )

                      put(
                          "seller",
                          listing.seller
                      )

                      put(
                          "phone",
                          listing.phone
                      )

                      put(
                          "description",
                          listing.description
                      )

                      put(
                          "photoUri",
                          listing.photoUri
                      )

                      put(
                          "isMine",
                          listing.isMine
                      )
                  }
              }

              private fun getListings():
                  List<Listing> {

                  val prefs =
                      getSharedPreferences(
                          "farmersmeet",
                          Context.MODE_PRIVATE
                      )

                  val array =
                      JSONArray(
                          prefs.getString(
                              "listings",
                              "[]"
                          ) ?: "[]"
                      )

                  val result =
                      mutableListOf<Listing>()

                  for (
                      i in 0 until array.length()
                  ) {

                      val item =
                          array.getJSONObject(i)

                      result.add(
                          Listing(

                              item.optLong(
                                  "id",
                                  i.toLong()
                              ),

                              item.optString(
                                  "name"
                              ),

                              item.optString(
                                  "category"
                              ),

                              item.optString(
                                  "price"
                              ),

                              item.optString(
                                  "quantity"
                              ),

                              item.optString(
                                  "location"
                              ),

                              item.optString(
                                  "seller"
                              ),

                              item.optString(
                                  "phone"
                              ),

                              item.optString(
                                  "description"
                              ),

                              item.optString(
                                  "photoUri"
                              ),

                              item.optBoolean(
                                  "isMine",
                                  false
                              )
                          )
                      )
                  }

                  return result
              }

              private fun isFavorite(
                  id: Long
              ): Boolean {

                  val prefs =
                      getSharedPreferences(
                          "farmersmeet",
                          Context.MODE_PRIVATE
                      )

                  val favorites =
                      prefs.getStringSet(
                          "favorites",
                          emptySet()
                      ) ?: emptySet()

                  return favorites.contains(
                      id.toString()
                  )
              }

              private fun toggleFavorite(
                  id: Long
              ) {

                  val prefs =
                      getSharedPreferences(
                          "farmersmeet",
                          Context.MODE_PRIVATE
                      )

                  val favorites =
                      prefs.getStringSet(
                          "favorites",
                          emptySet()
                      )?.toMutableSet()
                          ?: mutableSetOf()

                  val key =
                      id.toString()

                  if (
                      favorites.contains(key)
                  ) {

                      favorites.remove(key)

                  } else {

                      favorites.add(key)
                  }

                  prefs.edit()
                      .putStringSet(
                          "favorites",
                          favorites
                      )
                      .apply()
              }

              private fun deleteListing(
                  id: Long
              ) {

                  val prefs =
                      getSharedPreferences(
                          "farmersmeet",
                          Context.MODE_PRIVATE
                      )

                  val array =
                      JSONArray(
                          prefs.getString(
                              "listings",
                              "[]"
                          ) ?: "[]"
                      )

                  val newArray =
                      JSONArray()

                  for (
                      i in 0 until array.length()
                  ) {

                      val item =
                          array.getJSONObject(i)

                      if (
                          item.optLong(
                              "id"
                          ) != id
                      ) {

                          newArray.put(item)
                      }
                  }

                  val favorites =
                      prefs.getStringSet(
                          "favorites",
                          emptySet()
                      )?.toMutableSet()
                          ?: mutableSetOf()

                  favorites.remove(
                      id.toString()
                  )

                  prefs.edit()
                      .putString(
                          "listings",
                          newArray.toString()
                      )
                      .putStringSet(
                          "favorites",
                          favorites
                      )
                      .apply()
              }

