name: FarmersMeet Stage 10 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build FarmersMeet Stage 10
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$(command -v sdkmanager)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi

          echo "Using sdkmanager:"
          "$SDKMANAGER" --version

          echo
          echo "Accepting Android SDK licenses..."

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          echo
          echo "Installing platform-tools..."

          "$SDKMANAGER" "platform-tools"

          echo
          echo "Installing Android SDK Platform 35..."

          "$SDKMANAGER" "platforms;android-35"

          echo
          echo "Installing Android Build Tools 35.0.0..."

          "$SDKMANAGER" "build-tools;35.0.0"

          echo
          echo "Android SDK packages installed."

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          echo "Checking Android SDK..."

          test -d "$SDK"
          test -d "$SDK/platform-tools"
          test -d "$SDK/platforms/android-35"
          test -d "$SDK/build-tools/35.0.0"

          echo
          echo "Android SDK verification successful."

          echo
          echo "Platform:"
          ls -ld "$SDK/platforms/android-35"

          echo
          echo "Build tools:"
          ls -ld "$SDK/build-tools/35.0.0"

      - name: Verify repository structure
        shell: bash
        run: |
          set -e

          echo "===== REPOSITORY ROOT ====="
          find . -maxdepth 2 -type f | sort

          echo
          echo "Checking Android project..."

          test -f settings.gradle
          test -d app
          test -f app/build.gradle

          echo
          echo "Android project structure is valid."

      - name: Prepare Firebase configuration
        shell: bash
        run: |
          set -e

          echo "Checking Firebase configuration..."

          if [ -f "google-services.json" ]; then

            echo "Found google-services.json in repository root."

          elif [ -f "Settings/google-services.json" ]; then

            echo "Found Settings/google-services.json."
            cp "Settings/google-services.json" "google-services.json"

          else

            echo "ERROR: google-services.json was not found."
            echo
            echo "Expected:"
            echo "  google-services.json"
            echo "or:"
            echo "  Settings/google-services.json"
            exit 1

          fi

          cp "google-services.json" "app/google-services.json"

          test -s "app/google-services.json"

          echo
          echo "Firebase configuration is ready."

      - name: Prepare root Gradle build file
        shell: bash
        run: |
          set -e

          if [ -f "build.gradle" ]; then

            echo "Root build.gradle found."

          elif [ -f "app-build.gradle" ]; then

            echo "Root build.gradle not found."
            echo "Using app-build.gradle as build.gradle."

            cp "app-build.gradle" "build.gradle"

          else

            echo "ERROR: No root build.gradle or app-build.gradle found."
            exit 1

          fi

          echo
          echo "===== ROOT BUILD FILE ====="
          cat build.gradle

      - name: Show Android project configuration
        shell: bash
        run: |
          set -e

          echo "===== settings.gradle ====="
          cat settings.gradle

          echo
          echo "===== app/build.gradle ====="
          cat app/build.gradle

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -e

          GRADLE_HOME="$HOME/gradle-8.9"

          if [ ! -x "$GRADLE_HOME/bin/gradle" ]; then

            echo "Downloading Gradle 8.9..."

            curl -fL \
              "https://services.gradle.org/distributions/gradle-8.9-bin.zip" \
              -o "$HOME/gradle-8.9-bin.zip"

            rm -rf "$GRADLE_HOME"

            mkdir -p "$GRADLE_HOME"

            unzip -q \
              "$HOME/gradle-8.9-bin.zip" \
              -d "$HOME"

          fi

          echo "$GRADLE_HOME/bin" >> "$GITHUB_PATH"

          export PATH="$GRADLE_HOME/bin:$PATH"

          echo
          echo "===== GRADLE VERSION ====="
          gradle --version

      - name: Create Gradle wrapper
        shell: bash
        run: |
          set -e

          export PATH="$HOME/gradle-8.9/bin:$PATH"

          if [ ! -f "gradlew" ]; then

            echo "Creating Gradle wrapper..."

            gradle wrapper \
              --gradle-version 8.9 \
              --distribution-type bin

          else

            echo "Gradle wrapper already exists."

          fi

          chmod +x gradlew

          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.properties

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          echo "===== GRADLE WRAPPER ====="

          ./gradlew --version

      - name: Clean project
        shell: bash
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean

      - name: Build FarmersMeet Stage 10 APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " BUILDING FARMERSMEET STAGE 10"
          echo "=========================================="

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Verify Stage 10 APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          echo "Checking APK..."

          test -f "$APK"

          echo
          echo "=========================================="
          echo " FARMERSMEET STAGE 10 BUILD SUCCESSFUL"
          echo "=========================================="

          echo
          ls -lh "$APK"

      - name: Upload FarmersMeet Stage 10 APK
        uses: actions/upload-artifact@v4
        with:
          name: FarmersMeet-Stage-10-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
