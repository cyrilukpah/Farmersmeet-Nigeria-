name: FarmersMeet Stage 10 - Firebase Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build FarmersMeet Stage 10
    runs-on: ubuntu-22.04

    steps:

      # ---------------------------------------------------------
      # 1. CHECK OUT THE ACTUAL REPOSITORY
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. SET UP JAVA
      # ---------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ---------------------------------------------------------
      # 3. DO NOT RUN SDKMANAGER
      #
      # GitHub's Ubuntu runner already contains the Android SDK.
      # We only verify that the required Android 35 SDK exists.
      # ---------------------------------------------------------
      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ -z "$ANDROID_HOME" ]; then
            echo "ERROR: ANDROID_HOME is not set."
            exit 1
          fi

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "ERROR: Android SDK directory does not exist."
            exit 1
          fi

          echo
          echo "Android SDK platforms:"
          ls -la "$ANDROID_HOME/platforms" || true

          echo
          echo "Android SDK build tools:"
          ls -la "$ANDROID_HOME/build-tools" || true

          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            echo
            echo "ERROR: Android SDK platform 35 is not installed on this runner."
            echo "The workflow intentionally does not use sdkmanager."
            exit 1
          fi

          if [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            echo
            echo "ERROR: Android Build Tools 35.0.0 are not installed."
            echo "The workflow intentionally does not use sdkmanager."
            exit 1
          fi

          echo
          echo "Android SDK 35 is available."

      # ---------------------------------------------------------
      # 4. SHOW THE REAL REPOSITORY STRUCTURE
      # ---------------------------------------------------------
      - name: Check repository structure
        shell: bash
        run: |
          set -e

          echo "Repository root:"
          pwd

          echo
          echo "Repository contents:"
          find . -maxdepth 3 -type f \
            ! -path "./.git/*" \
            | sort

          echo
          echo "Checking required project files..."

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle

          echo "Required Gradle project files found."

      # ---------------------------------------------------------
      # 5. INSTALL FIREBASE CONFIGURATION
      # ---------------------------------------------------------
      - name: Install Firebase configuration
        shell: bash
        run: |
          set -e

          if [ ! -f "Settings/google-services.json" ]; then
            echo "ERROR: Settings/google-services.json was not found."
            exit 1
          fi

          mkdir -p app

          cp "Settings/google-services.json" \
             "app/google-services.json"

          echo "Firebase google-services.json installed."

          echo
          echo "Firebase file:"
          ls -lh app/google-services.json

      # ---------------------------------------------------------
      # 6. WRITE ROOT SETTINGS
      #
      # This guarantees Gradle knows where the Android plugin
      # comes from.
      # ---------------------------------------------------------
      - name: Configure root Gradle files
        shell: bash
        run: |
          set -e

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "FarmersMeetNigeria"

          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
              id 'com.google.gms.google-services' version '4.4.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true

          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

          kotlin.code.style=official
          EOF

          echo "Root Gradle files configured."

      # ---------------------------------------------------------
      # 7. CONFIGURE THE APP MODULE
      #
      # Firebase Authentication is included here.
      # ---------------------------------------------------------
      - name: Configure Android app
        shell: bash
        run: |
          set -e

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
              id 'com.google.gms.google-services'
          }

          android {
              namespace 'ng.farmersmeet.nigeria'

              compileSdk 35

              defaultConfig {
                  applicationId 'ng.farmersmeet.nigeria"

                  minSdk 24

                  targetSdk 35

                  versionCode 10

                  versionName "10.0"
              }

              buildTypes {
                  debug {
                      debuggable true
                      minifyEnabled false
                  }

                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {

              implementation 'androidx.core:core-ktx:1.15.0'

              implementation 'androidx.appcompat:appcompat:1.7.0'

              implementation 'androidx.activity:activity-ktx:1.10.1'

              implementation platform(
                  'com.google.firebase:firebase-bom:33.7.0'
              )

              implementation 'com.google.firebase:firebase-auth'
          }
          EOF

          echo "Android app Gradle configuration written."

      # ---------------------------------------------------------
      # 8. FIX THE APPLICATION ID QUOTE
      #
      # Kept as a separate validation step so a malformed
      # generated file cannot silently continue.
      # ---------------------------------------------------------
      - name: Validate Android Gradle configuration
        shell: bash
        run: |
          set -e

          if grep -q 'applicationId "ng.farmersmeet.nigeria"' app/build.gradle; then
            echo "Application ID is valid."
          else
            echo "ERROR: Application ID configuration is invalid."
            sed -n '1,160p' app/build.gradle
            exit 1
          fi

          echo
          echo "Root build.gradle:"
          cat build.gradle

          echo
          echo "App build.gradle:"
          cat app/build.gradle

      # ---------------------------------------------------------
      # 9. ENSURE MANIFEST EXISTS
      # ---------------------------------------------------------
      - name: Verify Android manifest
        shell: bash
        run: |
          set -e

          test -f app/src/main/AndroidManifest.xml

          echo "AndroidManifest.xml found."

      # ---------------------------------------------------------
      # 10. CREATE GRADLE WRAPPER
      # ---------------------------------------------------------
      - name: Create Gradle wrapper
        shell: bash
        run: |
          set -e

          if [ ! -f gradlew ]; then
            echo "Gradle wrapper not found."
            echo "Creating Gradle wrapper with Gradle 8.9..."

            gradle wrapper \
              --gradle-version 8.9 \
              --distribution-type bin
          else
            echo "Existing Gradle wrapper found."
          fi

          chmod +x gradlew

          echo
          echo "Gradle wrapper:"
          ls -lh gradlew

      # ---------------------------------------------------------
      # 11. VERIFY GRADLE ENVIRONMENT
      # ---------------------------------------------------------
      - name: Verify Gradle
        shell: bash
        run: |
          set -e

          ./gradlew --version

      # ---------------------------------------------------------
      # 12. VERIFY GRADLE PROJECT
      # ---------------------------------------------------------
      - name: Verify Gradle project
        shell: bash
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            --stacktrace \
            tasks

      # ---------------------------------------------------------
      # 13. BUILD DEBUG APK
      # ---------------------------------------------------------
      - name: Build Stage 10 debug APK
        shell: bash
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

      # ---------------------------------------------------------
      # 14. VERIFY APK
      # ---------------------------------------------------------
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not produced."
            exit 1
          fi

          echo
          echo "=============================================="
          echo "FARMERSMEET STAGE 10 APK CREATED"
          echo "=============================================="
          echo
          ls -lh "$APK"

      # ---------------------------------------------------------
      # 15. UPLOAD APK
      # ---------------------------------------------------------
      - name: Upload FarmersMeet Stage 10 APK
        uses: actions/upload-artifact@v4
        with:
          name: FarmersMeet-Stage-10-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
