name: FarmersMeet Stage 2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Create complete FarmersMeet app
        shell: bash
        run: |
          rm -rf FarmersMeet

          mkdir -p FarmersMeet/app/src/main/java/ng/farmersmeet/nigeria

          cat > FarmersMeet/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "FarmersMeetNigeria"
          include(":app")
          EOF

          cat > FarmersMeet/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat > FarmersMeet/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > FarmersMeet/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'ng.farmersmeet.nigeria'
              compileSdk 35

              defaultConfig {
                  applicationId 'ng.farmersmeet.nigeria'
                  minSdk 24
                  targetSdk 35
                  versionCode 3
                  versionName "3.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.15.0'
              implementation 'androidx.appcompat:appcompat:1.7.0'
          }
          EOF

          cat > FarmersMeet/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/AppTheme"
                  android:label="FarmersMeet"
                  android:allowBackup="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          mkdir -p FarmersMeet/app/src/main/res/values

          cat > FarmersMeet/app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#176B35</item>
                  <item name="android:statusBarColor">#0D4D25</item>
                  <item name="android:navigationBarColor">#0D4D25</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > FarmersMeet/app/src/main/java/ng/farmersmeet/nigeria/MainActivity.kt <<'EOF'
          package ng.farmersmeet.nigeria

          import android.app.Activity
          import android.content.Context
          import android.graphics.Color
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.widget.*
          import org.json.JSONArray
          import org.json.JSONObject

          data class Listing(
              val name: String,
              val category: String,
              val price: String,
              val quantity: String,
              val location: String,
              val seller: String,
              val description: String
          )

          class MainActivity : Activity() {

              private val green = Color.rgb(23, 107, 53)
              private val darkGreen = Color.rgb(13, 77, 37)
              private val yellow = Color.rgb(244, 196, 48)
              private val cream = Color.rgb(247, 250, 245)
              private val white = Color.WHITE
              private val text = Color.rgb(24, 53, 31)

              private val categories = arrayOf(
                  "Crops and Farm Produce",
                  "Pigs and Piglets",
                  "Fish and Aquaculture",
                  "Other Livestock",
                  "Poultry",
                  "Seeds and Seedlings",
                  "Farm Equipment"
              )

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  showHome()
              }

              private fun base(): LinearLayout {
                  return LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(cream)
                      setPadding(20, 20, 20, 20)
                  }
              }

              private fun title(textValue: String): TextView {
                  return TextView(this).apply {
                      text = textValue
                      textSize = 28f
                      setTextColor(green)
                      setTypeface(null, android.graphics.Typeface.BOLD)
                      setPadding(0, 10, 0, 18)
                  }
              }

              private fun button(
                  label: String,
                  yellowButton: Boolean = false
              ): Button {
                  return Button(this).apply {
                      text = label
                      textSize = 15f
                      setTypeface(null, android.graphics.Typeface.BOLD)
                      setTextColor(if (yellowButton) text else white)
                      setBackgroundColor(if (yellowButton) yellow else green)
                      isAllCaps = false

                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply {
                          setMargins(0, 7, 0, 7)
                      }
                  }
              }

              private fun showHome() {
                  val root = base()
                  root.gravity = Gravity.CENTER

                  val logo = title("FarmersMeet")
                  logo.textSize = 40f
                  logo.gravity = Gravity.CENTER

                  val subtitle = TextView(this).apply {
                      text = "Connecting farmers, buyers and agricultural businesses"
                      textSize = 16f
                      setTextColor(text)
                      gravity = Gravity.CENTER
                      setPadding(10, 0, 10, 25)
                  }

                  val enter = button("ENTER MARKETPLACE", true)

                  enter.setOnClickListener {
                      showMarketplace()
                  }

                  root.addView(logo)
                  root.addView(subtitle)
                  root.addView(enter)

                  setContentView(root)
              }

              private fun showMarketplace() {
                  val scroll = ScrollView(this)
                  val root = base()

                  val heading = title("FarmersMeet Marketplace")

                  val intro = TextView(this).apply {
                      text = "Buy and sell agricultural products"
                      textSize = 16f
                      setTextColor(text)
                      setPadding(0, 0, 0, 15)
                  }

                  root.addView(heading)
                  root.addView(intro)

                  for (category in categories) {
                      val b = button(category)
                      b.setOnClickListener {
                          showListings(category)
                      }
                      root.addView(b)
                  }

                  val sell = button("SELL AN ITEM", true)

                  sell.setOnClickListener {
                      showSell()
                  }

                  root.addView(sell)

                  scroll.addView(root)
                  setContentView(scroll)
              }

              private fun showSell() {
                  val scroll = ScrollView(this)
                  val root = base()

                  root.addView(title("Sell an Item"))

                  val info = TextView(this).apply {
                      text = "Create a marketplace listing"
                      textSize = 16f
                      setTextColor(text)
                  }

                  root.addView(info)

                  val categorySpinner = Spinner(this)

                  categorySpinner.adapter = ArrayAdapter(
                      this,
                      android.R.layout.simple_spinner_dropdown_item,
                      categories
                  )

                  root.addView(categorySpinner)

                  val name = field("Product name")
                  val price = field("Price in Naira")
                  val quantity = field("Quantity")
                  val location = field("Location")
                  val seller = field("Seller name")
                  val description = field("Description")

                  description.minLines = 4
                  description.gravity = Gravity.TOP

                  root.addView(name)
                  root.addView(price)
                  root.addView(quantity)
                  root.addView(location)
                  root.addView(seller)
                  root.addView(description)

                  val post = button("POST LISTING", true)

                  post.setOnClickListener {

                      if (
                          name.text.toString().trim().isEmpty() ||
                          price.text.toString().trim().isEmpty() ||
                          quantity.text.toString().trim().isEmpty() ||
                          location.text.toString().trim().isEmpty() ||
                          seller.text.toString().trim().isEmpty()
                      ) {
                          Toast.makeText(
                              this,
                              "Please complete the required fields.",
                              Toast.LENGTH_SHORT
                          ).show()
                          return@setOnClickListener
                      }

                      saveListing(
                          Listing(
                              name.text.toString().trim(),
                              categorySpinner.selectedItem.toString(),
                              "₦" + price.text.toString().trim(),
                              quantity.text.toString().trim(),
                              location.text.toString().trim(),
                              seller.text.toString().trim(),
                              description.text.toString().trim()
                          )
                      )

                      Toast.makeText(
                          this,
                          "Listing posted successfully!",
                          Toast.LENGTH_LONG
                      ).show()

                      showListings(categorySpinner.selectedItem.toString())
                  }

                  root.addView(post)

                  val back = button("BACK TO MARKETPLACE")
                  back.setOnClickListener {
                      showMarketplace()
                  }

                  root.addView(back)

                  scroll.addView(root)
                  setContentView(scroll)
              }

              private fun field(hintText: String): EditText {
                  return EditText(this).apply {
                      hint = hintText
                      textSize = 16f
                      setTextColor(text)
                      setHintTextColor(Color.GRAY)

                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply {
                          setMargins(0, 5, 0, 5)
                      }
                  }
              }

              private fun showListings(category: String) {
                  val scroll = ScrollView(this)
                  val root = base()

                  root.addView(title(category))

                  val listings = getListings().filter {
                      it.category == category
                  }.reversed()

                  if (listings.isEmpty()) {
                      val empty = TextView(this).apply {
                          text = "No listings yet in this category."
                          textSize = 17f
                          setTextColor(text)
                          setPadding(0, 20, 0, 20)
                      }

                      root.addView(empty)
                  } else {
                      listings.forEach { listing ->

                          val card = LinearLayout(this).apply {
                              orientation = LinearLayout.VERTICAL
                              setBackgroundColor(white)
                              setPadding(18, 18, 18, 18)

                              layoutParams = LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  LinearLayout.LayoutParams.WRAP_CONTENT
                              ).apply {
                                  setMargins(0, 0, 0, 16)
                              }
                          }

                          val name = TextView(this).apply {
                              text = listing.name
                              textSize = 21f
                              setTextColor(green)
                              setTypeface(null, android.graphics.Typeface.BOLD)
                          }

                          val price = TextView(this).apply {
                              text = listing.price
                              textSize = 20f
                              setTextColor(darkGreen)
                              setTypeface(null, android.graphics.Typeface.BOLD)
                          }

                          val details = TextView(this).apply {
                              text =
                                  "Quantity: ${listing.quantity}\n" +
                                  "Location: ${listing.location}\n" +
                                  "Seller: ${listing.seller}"
                              textSize = 15f
                              setTextColor(text)
                              setPadding(0, 8, 0, 8)
                          }

                          val view = button("VIEW DETAILS")

                          view.setOnClickListener {
                              showDetails(listing)
                          }

                          card.addView(name)
                          card.addView(price)
                          card.addView(details)
                          card.addView(view)

                          root.addView(card)
                      }
                  }

                  val back = button("BACK TO MARKETPLACE")
                  back.setOnClickListener {
                      showMarketplace()
                  }

                  root.addView(back)

                  scroll.addView(root)
                  setContentView(scroll)
              }

              private fun showDetails(listing: Listing) {
                  val root = base()

                  root.addView(title(listing.name))

                  val details = TextView(this).apply {
                      text =
                          "PRICE\n${listing.price}\n\n" +
                          "CATEGORY\n${listing.category}\n\n" +
                          "QUANTITY\n${listing.quantity}\n\n" +
                          "LOCATION\n${listing.location}\n\n" +
                          "SELLER\n${listing.seller}\n\n" +
                          "DESCRIPTION\n${listing.description.ifEmpty { "No description provided." }}"
                      textSize = 17f
                      setTextColor(text)
                      setPadding(0, 5, 0, 20)
                  }

                  root.addView(details)

                  val back = button("BACK TO LISTINGS")
                  back.setOnClickListener {
                      showListings(listing.category)
                  }

                  root.addView(back)

                  val market = button("MARKETPLACE", true)
                  market.setOnClickListener {
                      showMarketplace()
                  }

                  root.addView(market)

                  setContentView(root)
              }

              private fun saveListing(listing: Listing) {
                  val prefs = getSharedPreferences(
                      "farmersmeet",
                      Context.MODE_PRIVATE
                  )

                  val array = JSONArray(
                      prefs.getString("listings", "[]") ?: "[]"
                  )

                  val item = JSONObject()

                  item.put("name", listing.name)
                  item.put("category", listing.category)
                  item.put("price", listing.price)
                  item.put("quantity", listing.quantity)
                  item.put("location", listing.location)
                  item.put("seller", listing.seller)
                  item.put("description", listing.description)

                  array.put(item)

                  prefs.edit()
                      .putString("listings", array.toString())
                      .apply()
              }

              private fun getListings(): List<Listing> {
                  val prefs = getSharedPreferences(
                      "farmersmeet",
                      Context.MODE_PRIVATE
                  )

                  val array = JSONArray(
                      prefs.getString("listings", "[]") ?: "[]"
                  )

                  val result = mutableListOf<Listing>()

                  for (i in 0 until array.length()) {
                      val item = array.getJSONObject(i)

                      result.add(
                          Listing(
                              item.optString("name"),
                              item.optString("category"),
                              item.optString("price"),
                              item.optString("quantity"),
                              item.optString("location"),
                              item.optString("seller"),
                              item.optString("description")
                          )
                      )
                  }

                  return result
                       categories
                  )

                  root.addView(categorySpinner)

                  val name = field("Product name")
                  val price = field("Price in Naira")
                  val quantity = field("Quantity")
                  val location = field("Location")
                  val seller = field("Seller name")
                  val description = field("Description")

                  description.minLines = 4
                  description.gravity = Gravity.TOP

                  root.addView(name)
                  root.addView(price)
                  root.addView(quantity)
                  root.addView(location)
                  root.addView(seller)
                  root.addView(description)

                  val post = button("POST LISTING", true)

                  post.setOnClickListener {

                      if (
                          name.text.toString().trim().isEmpty() ||
                          price.text.toString().trim().isEmpty() ||
                          quantity.text.toString().trim().isEmpty() ||
                          location.text.toString().trim().isEmpty() ||
                          seller.text.toString().trim().isEmpty()
                      ) {
                          Toast.makeText(
                              this,
                              "Please complete the required fields.",
                              Toast.LENGTH_SHORT
                          ).show()
                          return@setOnClickListener
                      }

                      saveListing(
                          Listing(
                              name.text.toString().trim(),
                              categorySpinner.selectedItem.toString(),
                              "₦" + price.text.toString().trim(),
                              quantity.text.toString().trim(),
                              location.text.toString().trim(),
                              seller.text.toString().trim(),
                              description.text.toString().trim()
                          )
                      )

                      Toast.makeText(
                          this,
                          "Listing posted successfully!",
                          Toast.LENGTH_LONG
                      ).show()

                      showListings(categorySpinner.selectedItem.toString())
                  }

                  root.addView(post)

                  val back = button("BACK TO MARKETPLACE")
                  back.setOnClickListener {
                      showMarketplace()
                  }

                  root.addView(back)

                  scroll.addView(root)
                  setContentView(scroll)
              }

              private fun field(hintText: String): EditText {
                  return EditText(this).apply {
                      hint = hintText
                      textSize = 16f
                      setTextColor(text)
                      setHintTextColor(Color.GRAY)

                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply {
                          setMargins(0, 5, 0, 5)
                      }
                  }
              }

              private fun showListings(category: String) {
                  val scroll = ScrollView(this)
                  val root = base()

                  root.addView(title(category))

                  val listings = getListings().filter {
                      it.category == category
                  }.reversed()

                  if (listings.isEmpty()) {
                      val empty = TextView(this).apply {
                          text = "No listings yet in this category."
                          textSize = 17f
                          setTextColor(text)
                          setPadding(0, 20, 0, 20)
                      }

                      root.addView(empty)
                  } else {
                      listings.forEach { listing ->

                          val card = LinearLayout(this).apply {
                              orientation = LinearLayout.VERTICAL
                              setBackgroundColor(white)
                              setPadding(18, 18, 18, 18)

                              layoutParams = LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  LinearLayout.LayoutParams.WRAP_CONTENT
                              ).apply {
                                  setMargins(0, 0, 0, 16)
                              }
                          }

                          val name = TextView(this).apply {
                              text = listing.name
                              textSize = 21f
                              setTextColor(green)
                              setTypeface(null, android.graphics.Typeface.BOLD)
                          }

                          val price = TextView(this).apply {
                              text = listing.price
                              textSize = 20f
                              setTextColor(darkGreen)
                              setTypeface(null, android.graphics.Typeface.BOLD)
                          }

                          val details = TextView(this).apply {
                              text =
                                  "Quantity: ${listing.quantity}\n" +
                                  "Location: ${listing.location}\n" +
                                  "Seller: ${listing.seller}"
                              textSize = 15f
                              setTextColor(text)
                              setPadding(0, 8, 0, 8)
                          }

                          val view = button("VIEW DETAILS")

                          view.setOnClickListener {
                              showDetails(listing)
                          }

                          card.addView(name)
                          card.addView(price)
                          card.addView(details)
                          card.addView(view)

                          root.addView(card)
                      }
                  }

                  val back = button("BACK TO MARKETPLACE")
                  back.setOnClickListener {
                      showMarketplace()
                  }

                  root.addView(back)

                  scroll.addView(root)
                  setContentView(scroll)
              }

              private fun showDetails(listing: Listing) {
                  val root = base()

                  root.addView(title(listing.name))

                  val details = TextView(this).apply {
                      text =
                          "PRICE\n${listing.price}\n\n" +
                          "CATEGORY\n${listing.category}\n\n" +
                          "QUANTITY\n${listing.quantity}\n\n" +
                          "LOCATION\n${listing.location}\n\n" +
                          "SELLER\n${listing.seller}\n\n" +
                          "DESCRIPTION\n${listing.description.ifEmpty { "No description provided." }}"
                      textSize = 17f
                      setTextColor(text)
                      setPadding(0, 5, 0, 20)
                  }

                  root.addView(details)

                  val back = button("BACK TO LISTINGS")
                  back.setOnClickListener {
                      showListings(listing.category)
                  }

                  root.addView(back)

                  val market = button("MARKETPLACE", true)
                  market.setOnClickListener {
                      showMarketplace()
                  }

                  root.addView(market)

                  setContentView(root)
              }

              private fun saveListing(listing: Listing) {
                  val prefs = getSharedPreferences(
                      "farmersmeet",
                      Context.MODE_PRIVATE
                  )

                  val array = JSONArray(
                      prefs.getString("listings", "[]") ?: "[]"
                  )

                  val item = JSONObject()

                  item.put("name", listing.name)
                  item.put("category", listing.category)
                  item.put("price", listing.price)
                  item.put("quantity", listing.quantity)
                  item.put("location", listing.location)
                  item.put("seller", listing.seller)
                  item.put("description", listing.description)

                  array.put(item)

                  prefs.edit()
                      .putString("listings", array.toString())
                      .apply()
              }

              private fun getListings(): List<Listing> {
                  val prefs = getSharedPreferences(
                      "farmersmeet",
                      Context.MODE_PRIVATE
                  )

                  val array = JSONArray(
                      prefs.getString("listings", "[]") ?: "[]"
                  )

                  val result = mutableListOf<Listing>()

                  for (i in 0 until array.length()) {
                      val item = array.getJSONObject(i)

                      result.add(
                          Listing(
                              item.optString("name"),
                              item.optString("category"),
                              item.optString("price"),
                              item.optString("quantity"),
                              item.optString("location"),
                              item.optString("seller"),
                              item.optString("description")
                          )
                      )
                  }

                  return result
             
