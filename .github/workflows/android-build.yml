      - name: Verify project files
        shell: bash
        run: |
          set -e

          test -f FarmersMeet/settings.gradle
          test -f FarmersMeet/build.gradle
          test -f FarmersMeet/gradle.properties
          test -f FarmersMeet/app/build.gradle
          test -f FarmersMeet/app/src/main/AndroidManifest.xml
          test -f FarmersMeet/app/src/main/res/values/themes.xml
          test -f FarmersMeet/app/src/main/java/ng/farmersmeet/nigeria/MainActivity.kt

          echo "FarmersMeet Stage 9 project files verified."

      - name: Build APK
        working-directory: FarmersMeet
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          test -s FarmersMeet/app/build/outputs/apk/debug/app-debug.apk

          echo "FarmersMeet Stage 9 APK created successfully."
          ls -lh FarmersMeet/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FarmersMeet-Stage9-Full-Marketplace-APK
          path: FarmersMeet/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
