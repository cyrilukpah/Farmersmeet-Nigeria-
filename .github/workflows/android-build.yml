name: FarmersMeet Stage 10 Firebase Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: FarmersMeet Stage 10
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Locate preinstalled Android SDK
        shell: bash
        run: |
          set -e

          if [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK="$ANDROID_SDK_ROOT"
          elif [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then
            SDK="$ANDROID_HOME"
          elif [ -d "/usr/local/lib/android/sdk" ]; then
            SDK="/usr/local/lib/android/sdk"
          else
            echo "ERROR: Android SDK was not found on the GitHub runner."
            exit 1
          fi

          echo "Android SDK:"
          echo "$SDK"

          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/emulator" >> "$GITHUB_PATH"

      - name: Check Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"

          test -d "$ANDROID_SDK_ROOT"

          echo
          echo "Installed SDK platforms:"
          ls -la "$ANDROID_SDK_ROOT/platforms" || true

          echo
          echo "Installed build tools:"
          ls -la "$ANDROID_SDK_ROOT/build-tools" || true

      - name: Install missing Android SDK components
        shell: bash
        run: |
          set -e

          SDK="$ANDROID_SDK_ROOT"

          SDKMANAGER=""

          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$SDK/cmdline-tools/22.0/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/cmdline-tools/22.0/bin/sdkmanager"
          elif [ -x "$SDK/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/cmdline-tools/16.0/bin/sdkmanager"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            echo
            find "$SDK/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          if [ ! -d "$SDK/platforms/android-35" ]; then
            echo "Android 35 platform is missing."

            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

            "$SDKMANAGER" "platforms;android-35"
          fi

          if [ ! -d "$SDK/build-tools/35.0.0" ]; then
            echo "Android 35.0.0 build tools are missing."

            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

            "$SDKMANAGER" "build-tools;35.0.0"
          fi

          if [ ! -d "$SDK/platform-tools" ]; then
            echo "Platform tools are missing."

            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

            "$SDKMANAGER" "platform-tools"
          fi

      - name: Verify Android SDK components
        shell: bash
        run: |
          set -e

          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"
          test -d "$ANDROID_SDK_ROOT/platform-tools"

          echo "Android SDK verification successful."

      - name: Verify repository structure
        shell: bash
        run: |
          set -e

          echo "Repository:"
          pwd

          echo
          echo "Files:"
          find . -maxdepth 3 -type f | sort

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -d app/src/main

          echo
          echo "Root Android project verified."

      - name: Prepare Firebase configuration
        shell: bash
        run: |
          set -e

          if [ -f app/google-services.json ]; then
            echo "Found app/google-services.json"
          elif [ -f Settings/google-services.json ]; then
            echo "Found Settings/google-services.json"
            cp Settings/google-services.json app/google-services.json
          else
            echo "ERROR: Firebase google-services.json was not found."
            exit 1
          fi

          test -f app/google-services.json

      - name: Verify Firebase Android package
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          import json
          import sys

          expected = "ng.farmersmeet.nigeria"

          with open(
              "app/google-services.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          clients = data.get("client", [])

          packages = []

          for client in clients:
              package_name = (
                  client
                  .get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name")
              )

              if package_name:
                  packages.append(package_name)

          print("Firebase Android packages found:")

          for package_name in packages:
              print(" - " + package_name)

          if expected not in packages:
              print()
              print("ERROR:")
              print("Firebase package does not match the application.")
              print()
              print("Required:")
              print(expected)
              print()
              print("Found:")
              for package_name in packages:
                  print(package_name)

              sys.exit(1)

          print()
          print("Firebase package verification successful.")
          PY

      - name: Verify Gradle plugin configuration
        shell: bash
        run: |
          set -e

          echo "Root build.gradle:"
          cat build.gradle

          echo
          echo "App build.gradle:"
          cat app/build.gradle

          grep -q "com.android.application.*8.7.3" build.gradle
          grep -q "com.google.gms.google-services" build.gradle
          grep -q "com.android.application" app/build.gradle
          grep -q "com.google.gms.google-services" app/build.gradle

          echo
          echo "Gradle plugin configuration verified."

      - name: Create Gradle wrapper
        shell: bash
        run: |
          set -e

          if [ ! -f gradlew ]; then
            gradle wrapper \
              --gradle-version 8.9 \
              --distribution-type bin
          fi

          chmod +x gradlew

      - name: Show Gradle version
        shell: bash
        run: |
          set -e

          ./gradlew --version

      - name: Clean project
        shell: bash
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean

      - name: Build Stage 10 APK
        shell: bash
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Stage 10 APK was not generated."

            echo
            echo "APK files found:"
            find . -type f -name "*.apk" -print || true

            exit 1
          fi

          echo
          echo "=========================================="
          echo "FARMERSMEET STAGE 10 BUILD SUCCESSFUL"
          echo "=========================================="
          echo
          ls -lh "$APK"

      - name: Upload Stage 10 APK
        uses: actions/upload-artifact@v4
        with:
          name: FarmersMeet-Stage-10-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
