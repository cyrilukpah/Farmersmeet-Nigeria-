name: FarmersMeet Stage 10 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build FarmersMeet Stage 10
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extract actual FarmersMeet source
        shell: bash
        run: |
          set -euo pipefail

          ZIP="FarmersMeet_Nigeria_V2_Full_Source.zip"

          test -f "$ZIP"

          rm -rf FarmersMeet_V2

          unzip -q "$ZIP"

          test -d FarmersMeet_V2/android
          test -f FarmersMeet_V2/android/settings.gradle
          test -f FarmersMeet_V2/android/build.gradle
          test -f FarmersMeet_V2/android/app/build.gradle
          test -f FarmersMeet_V2/android/app/src/main/AndroidManifest.xml
          test -f FarmersMeet_V2/android/app/src/main/java/ng/farmersmeet/nigeria/MainActivity.kt

          echo "Actual FarmersMeet Android project found."

      - name: Install Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p FarmersMeet_V2/android/app

          if [ -f "Settings/google-services.json" ]; then
            cp "Settings/google-services.json" \
              "FarmersMeet_V2/android/app/google-services.json"

          elif [ -f "google-services.json" ]; then
            cp "google-services.json" \
              "FarmersMeet_V2/android/app/google-services.json"

          else
            echo "ERROR: google-services.json was not found."
            echo
            echo "The Firebase configuration must be present in the repository."
            exit 1
          fi

          test -s FarmersMeet_V2/android/app/google-services.json

          echo "Firebase configuration installed."

      - name: Verify Firebase package
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json

          path = "FarmersMeet_V2/android/app/google-services.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          expected = "ng.farmersmeet.nigeria"

          clients = data.get("client", [])

          packages = []

          for client in clients:
              package_name = (
                  client
                  .get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name")
              )

              if package_name:
                  packages.append(package_name)

          print("Firebase packages found:")
          for package_name in packages:
              print("  " + package_name)

          if expected not in packages:
              raise SystemExit(
                  "Firebase package mismatch. "
                  f"Expected {expected}, found {packages}"
              )

          print("Firebase package verification passed.")
          PY

      - name: Configure Google Services plugin
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="FarmersMeet_V2/android"

          cat > "$PROJECT/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
              id 'com.google.gms.google-services' version '4.4.2' apply false
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "FarmersMeet_V2/android/app/build.gradle"
          )

          text = path.read_text()

          if "com.google.gms.google-services" not in text:
              text = text.replace(
                  "id 'org.jetbrains.kotlin.android'\n",
                  "id 'org.jetbrains.kotlin.android'\n"
                  "    id 'com.google.gms.google-services'\n"
              )

          if "compileOptions" not in text:
              text += """

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          """

          path.write_text(text)
          PY

          echo "Google Services plugin configured."

      - name: Verify Gradle configuration
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="FarmersMeet_V2/android"

          grep -q "com.android.application" \
            "$PROJECT/build.gradle"

          grep -q "com.google.gms.google-services" \
            "$PROJECT/build.gradle"

          grep -q "com.google.gms.google-services" \
            "$PROJECT/app/build.gradle"

          grep -q "firebase-auth" \
            "$PROJECT/app/build.gradle"

          grep -q "firebase-firestore" \
            "$PROJECT/app/build.gradle"

          grep -q "firebase-storage" \
            "$PROJECT/app/build.gradle"

          grep -q "ng.farmersmeet.nigeria" \
            "$PROJECT/app/build.gradle"

          echo "Gradle configuration verified."

      - name: Show Gradle and Android environment
        shell: bash
        run: |
          set -euo pipefail

          gradle --version

          echo
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"

          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME"

      - name: Build Stage 10 APK
        working-directory: FarmersMeet_V2/android
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            clean \
            :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="FarmersMeet_V2/android/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo
          echo "=========================================="
          echo " FARMERSMEET STAGE 10 APK BUILT"
          echo "=========================================="
          echo

          ls -lh "$APK"

      - name: Upload Stage 10 APK
        uses: actions/upload-artifact@v4
        with:
          name: FarmersMeet-Stage-10-APK
          path: FarmersMeet_V2/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
