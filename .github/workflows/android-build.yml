name: FarmersMeet Stage 10 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build FarmersMeet Stage 10
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ -z "$ANDROID_HOME" ]; then
            if [ -d "/usr/local/lib/android/sdk" ]; then
              export ANDROID_HOME="/usr/local/lib/android/sdk"
              export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
            else
              echo "ERROR: Android SDK was not found."
              exit 1
            fi
          fi

          echo "Using Android SDK:"
          echo "$ANDROID_HOME"

          test -d "$ANDROID_HOME"

          echo
          echo "SDK contents:"
          ls -la "$ANDROID_HOME"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK/cmdline-tools/22.0/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-35"
          "$SDKMANAGER" "build-tools;35.0.0"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          echo "Checking Android SDK..."

          test -d "$SDK/platform-tools"
          test -d "$SDK/platforms/android-35"
          test -d "$SDK/build-tools/35.0.0"

          echo
          echo "Android SDK 35 is installed correctly."

          echo
          echo "Platform:"
          ls -ld "$SDK/platforms/android-35"

          echo
          echo "Build tools:"
          ls -ld "$SDK/build-tools/35.0.0"

      - name: Show repository structure
        shell: bash
        run: |
          set -e

          echo "===== REPOSITORY ====="
          find . -maxdepth 2 -type f | sort

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo "Checking project at repository root..."

          test -f settings.gradle
          test -d app
          test -f app/build.gradle

          echo "settings.gradle: OK"
          echo "app/: OK"
          echo "app/build.gradle: OK"

      - name: Prepare Firebase configuration
        shell: bash
        run: |
          set -e

          echo "Checking Firebase configuration..."

          if [ -f "google-services.json" ]; then
            echo "Root google-services.json found."

          elif [ -f "Settings/google-services.json" ]; then
            echo "Settings/google-services.json found."
            cp "Settings/google-services.json" "google-services.json"

          else
            echo "ERROR: google-services.json was not found."
            exit 1
          fi

          cp "google-services.json" "app/google-services.json"

          test -s "app/google-services.json"

          echo "Firebase configuration ready."

      - name: Prepare root Gradle build file
        shell: bash
        run: |
          set -e

          if [ -f "build.gradle" ]; then
            echo "build.gradle found."

          elif [ -f "app-build.gradle" ]; then
            echo "build.gradle not found."
            echo "Using app-build.gradle."
            cp "app-build.gradle" "build.gradle"

          else
            echo "ERROR: No root build.gradle found."
            exit 1
          fi

          echo
          echo "===== ROOT BUILD FILE ====="
          cat build.gradle

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -e

          if [ ! -x "$HOME/.gradle-install/gradle-8.9/bin/gradle" ]; then

            mkdir -p "$HOME/.gradle-install"

            curl -L \
              -o "$HOME/.gradle-install/gradle-8.9-bin.zip" \
              "https://services.gradle.org/distributions/gradle-8.9-bin.zip"

            unzip -q \
              "$HOME/.gradle-install/gradle-8.9-bin.zip" \
              -d "$HOME/.gradle-install"

          fi

          export PATH="$HOME/.gradle-install/gradle-8.9/bin:$PATH"

          gradle --version

      - name: Create Gradle wrapper
        shell: bash
        run: |
          set -e

          export PATH="$HOME/.gradle-install/gradle-8.9/bin:$PATH"

          if [ ! -f "gradlew" ]; then
            gradle wrapper \
              --gradle-version 8.9 \
              --distribution-type bin
          fi

          chmod +x gradlew

          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.properties

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew --version

      - name: Clean project
        shell: bash
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            clean

      - name: Build Stage 10 APK
        shell: bash
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo
          echo "========================================"
          echo " FARMERSMEET STAGE 10 APK CREATED"
          echo "========================================"
          echo
          ls -lh "$APK"

      - name: Upload Stage 10 APK
        uses: actions/upload-artifact@v4
        with:
          name: FarmersMeet-Stage-10-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
