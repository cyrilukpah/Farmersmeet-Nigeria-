name: FarmersMeet Stage 4 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Create project folders
        shell: bash
        run: |
          rm -rf FarmersMeet
          mkdir -p FarmersMeet/app/src/main/java/ng/farmersmeet/nigeria
          mkdir -p FarmersMeet/app/src/main/res/values

      - name: Create settings
        shell: bash
        run: |
          cat > FarmersMeet/settings.gradle <<'SETTINGS'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "FarmersMeetNigeria"
          include(":app")
          SETTINGS

      - name: Create root Gradle file
        shell: bash
        run: |
          cat > FarmersMeet/build.gradle <<'BUILD'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          BUILD

      - name: Create Gradle properties
        shell: bash
        run: |
          cat > FarmersMeet/gradle.properties <<'PROPERTIES'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          PROPERTIES

      - name: Create app Gradle file
        shell: bash
        run: |
          cat > FarmersMeet/app/build.gradle <<'BUILD'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'ng.farmersmeet.nigeria'
              compileSdk 35

              defaultConfig {
                  applicationId 'ng.farmersmeet.nigeria'
                  minSdk 24
                  targetSdk 35
                  versionCode 5
                  versionName "5.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.15.0'
              implementation 'androidx.appcompat:appcompat:1.7.0'
          }
          BUILD

      - name: Create Android manifest
        shell: bash
        run: |
          cat > FarmersMeet/app/src/main/AndroidManifest.xml <<'MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/AppTheme"
                  android:label="FarmersMeet"
                  android:allowBackup="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          MANIFEST

      - name: Create theme
        shell: bash
        run: |
          cat > FarmersMeet/app/src/main/res/values/themes.xml <<'THEME'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#176B35</item>
                  <item name="android:statusBarColor">#0D4D25</item>
                  <item name="android:navigationBarColor">#0D4D25</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>

          </resources>
          THEME

      - name: Create MainActivity
        shell: bash
        run: |
          cat > FarmersMeet/app/src/main/java/ng/farmersmeet/nigeria/MainActivity.kt <<'KOTLIN'
          package ng.farmersmeet.nigeria

          import android.app.Activity
          import android.content.Context
          import android.graphics.Color
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.*
          import org.json.JSONArray
          import org.json.JSONObject

          data class Listing(
              val name: String,
              val category: String,
              val price: String,
              val quantity: String,
              val location: String,
              val seller: String,
              val description: String
          )

          class MainActivity : Activity() {

              private val green = Color.rgb(23, 107, 53)
              private val darkGreen = Color.rgb(13, 77, 37)
              private val yellow = Color.rgb(244, 196, 48)
              private val backgroundColor = Color.rgb(247, 250, 245)
              private val textColor = Color.rgb(24, 53, 31)

              private val categories = arrayOf(
                  "All Categories",
                  "Crops and Farm Produce",
                  "Pigs and Piglets",
                  "Fish and Aquaculture",
                  "Other Livestock",
                  "Poultry",
                  "Seeds and Seedlings",
                  "Farm Equipment"
              )

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  seedListings()
                  showHome()
              }

              private fun baseLayout(): LinearLayout {
                  return LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(backgroundColor)
                      setPadding(20, 20, 20, 20)
                  }
              }

              private fun heading(value: String): TextView {
                  return TextView(this).apply {
                      text = value
                      textSize = 28f
                      setTextColor(green)
                      setTypeface(null, android.graphics.Typeface.BOLD)
                      setPadding(0, 10, 0, 18)
                  }
              }

              private fun makeButton(
                  value: String,
                  yellowButton: Boolean = false
              ): Button {
                  return Button(this).apply {
                      text = value
                      textSize = 15f
                      setTypeface(null, android.graphics.Typeface.BOLD)
                      setTextColor(
                          if (yellowButton) textColor else Color.WHITE
                      )
                      setBackgroundColor(
                          if (yellowButton) yellow else green
                      )

                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply {
                          setMargins(0, 6, 0, 6)
                      }
                  }
              }

              private fun makeSearch(): EditText {
                  return EditText(this).apply {
                      hint = "Search pigs, fish, crops..."
                      textSize = 16f
                      setSingleLine(true)
                      setTextColor(textColor)

                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply {
                          setMargins(0, 5, 0, 12)
                      }
                  }
              }

              private fun showHome() {
                  val root = baseLayout()
                  root.gravity = Gravity.CENTER

                  val logo = heading("FarmersMeet")
                  logo.textSize = 40f
                  logo.gravity = Gravity.CENTER

                  val subtitle = TextView(this).apply {
                      text = "Connecting farmers, buyers and agricultural businesses"
                      textSize = 16f
                      setTextColor(textColor)
                      gravity = Gravity.CENTER
                      setPadding(10, 0, 10, 25)
                  }

                  val enter = makeButton("ENTER MARKETPLACE", true)

                  enter.setOnClickListener {
                      showMarketplace()
                  }

                  root.addView(logo)
                  root.addView(subtitle)
                  root.addView(enter)

                  setContentView(root)
              }

              private fun showMarketplace() {
                  val scroll = ScrollView(this)
                  val root = baseLayout()

                  root.addView(heading("FarmersMeet Marketplace"))

                  val subtitle = TextView(this).apply {
                      text = "Buy and sell agricultural products"
                      textSize = 16f
                      setTextColor(textColor)
                      setPadding(0, 0, 0, 12)
                  }

                  root.addView(subtitle)

                  val search = makeSearch()
                  root.addView(search)

                  val searchButton = makeButton("SEARCH", true)

                  searchButton.setOnClickListener {
                      val query = search.text.toString().trim()
                      showSearchResults(query)
                  }

                  root.addView(searchButton)

                  val categoryTitle = TextView(this).apply {
                      text = "Browse Categories"
                      textSize = 21f
                      setTextColor(green)
                      setTypeface(null, android.graphics.Typeface.BOLD)
                      setPadding(0, 15, 0, 8)
                  }

                  root.addView(categoryTitle)

                  categories.drop(1).forEach { category ->

                      val button = makeButton(category)

                      button.setOnClickListener {
                          showListings(category)
                      }

                      root.addView(button)
                  }

                  val sell = makeButton("SELL AN ITEM", true)

                  sell.setOnClickListener {
                      showSell()
                  }

                  root.addView(sell)

                  scroll.addView(root)
                  setContentView(scroll)
              }

              private fun showListings(category: String) {
                  val results = getListings().filter {
                      it.category == category
                  }

                  showListingPage(category, results)
              }

              private fun showSearchResults(query: String) {
                  val lower = query.lowercase()

                  val results = if (lower.isEmpty()) {
                      getListings()
                  } else {
                      getListings().filter {
                          it.name.lowercase().contains(lower) ||
                          it.category.lowercase().contains(lower) ||
                          it.location.lowercase().contains(lower) ||
                          it.seller.lowercase().contains(lower)
                      }
                  }

                  showListingPage(
                      if (query.isEmpty()) "All Listings"
                      else "Search: $query",
                      results
                  )
              }

              private fun showListingPage(
                  title: String,
                  results: List<Listing>
              ) {
                  val scroll = ScrollView(this)
                  val root = baseLayout()

                  root.addView(heading(title))

                  if (results.isEmpty()) {

                      val empty = TextView(this).apply {
                          text = "No listings found."
                          textSize = 18f
                          setTextColor(textColor)
                          setPadding(0, 20, 0, 30)
                      }

                      root.addView(empty)

                  } else {

                      results.forEach { listing ->

                          val card = LinearLayout(this).apply {
                              orientation = LinearLayout.VERTICAL
                              setBackgroundColor(Color.WHITE)
                              setPadding(16, 14, 16, 14)

                              layoutParams = LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  LinearLayout.LayoutParams.WRAP_CONTENT
                              ).apply {
                                  setMargins(0, 0, 0, 14)
                              }
                          }

                          val name = TextView(this).apply {
                              text = listing.name
                              textSize = 21f
                              setTextColor(green)
                              setTypeface(null, android.graphics.Typeface.BOLD)
                          }

                          val price = TextView(this).apply {
                              text = listing.price
                              textSize = 20f
                              setTextColor(darkGreen)
                              setTypeface(null, android.graphics.Typeface.BOLD)
                              setPadding(0, 4, 0, 4)
                          }

                          val info = TextView(this).apply {
                              text =
                                  "Quantity: ${listing.quantity}\n" +
                                  "Location: ${listing.location}\n" +
                                  "Seller: ${listing.seller}"

                              textSize = 15f
                              setTextColor(textColor)
                              setPadding(0, 4, 0, 8)
                          }

                          val view = makeButton("VIEW DETAILS")

                          view.setOnClickListener {
                              showDetails(listing)
                          }

                          card.addView(name)
                          card.addView(price)
                          card.addView(info)
                          card.addView(view)

                          root.addView(card)
                      }
                  }

                  val sell = makeButton("SELL AN ITEM", true)

                  sell.setOnClickListener {
                      showSell()
                  }

                  root.addView(sell)

                  val back = makeButton("BACK TO MARKETPLACE")

                  back.setOnClickListener {
                      showMarketplace()
                  }

                  root.addView(back)

                  scroll.addView(root)
                  setContentView(scroll)
              }

              private fun showDetails(listing: Listing) {
                  val scroll = ScrollView(this)
                  val root = baseLayout()

                  root.addView(heading(listing.name))

                  val details = TextView(this).apply {
                      text =
                          "PRICE\n${listing.price}\n\n" +
                          "CATEGORY\n${listing.category}\n\n" +
                          "QUANTITY\n${listing.quantity}\n\n" +
                          "LOCATION\n${listing.location}\n\n" +
                          "SELLER\n${listing.seller}\n\n" +
                          "DESCRIPTION\n${listing.description}"

                      textSize = 17f
                      setTextColor(textColor)
                      setPadding(0, 5, 0, 20)
                  }

                  root.addView(details)

                  val back = makeButton("BACK TO LISTINGS")

                  back.setOnClickListener {
                      showListings(listing.category)
                  }

                  root.addView(back)

                  val market = makeButton("MARKETPLACE", true)

                  market.setOnClickListener {
                      showMarketplace()
                  }

                  root.addView(market)

                  scroll.addView(root)
                  setContentView(scroll)
              }

              private fun showSell() {
                  val scroll = ScrollView(this)
                  val root = baseLayout()

                  root.addView(heading("Sell an Item"))

                  val category = Spinner(this)

                  category.adapter = ArrayAdapter(
                      this,
                      android.R.layout.simple_spinner_dropdown_item,
                      categories.drop(1)
                  )

                  root.addView(category)

                  val name = field("Product name")
                  val price = field("Price in Naira")
                  val quantity = field("Quantity")
                  val location = field("Location")
                  val seller = field("Seller name")
                  val description = field("Description")

                  description.minLines = 4
                  description.gravity = Gravity.TOP

                  root.addView(name)
                  root.addView(price)
                  root.addView(quantity)
                  root.addView(location)
                  root.addView(seller)
                  root.addView(description)

                  val post = makeButton("POST LISTING", true)

                  post.setOnClickListener {

                      if (
                          name.text.toString().trim().isEmpty() ||
                          price.text.toString().trim().isEmpty() ||
                          quantity.text.toString().trim().isEmpty() ||
                          location.text.toString().trim().isEmpty() ||
                          seller.text.toString().trim().isEmpty()
                      ) {
                          Toast.makeText(
                              this,
                              "Please complete the required fields.",
                              Toast.LENGTH_SHORT
                          ).show()
                          return@setOnClickListener
                      }

                      val listing = Listing(
                          name.text.toString().trim(),
                          category.selectedItem.toString(),
                          "₦" + price.text.toString().trim(),
                          quantity.text.toString().trim(),
                          location.text.toString().trim(),
                          seller.text.toString().trim(),
                          description.text.toString().trim()
                      )

                      saveListing(listing)

                      Toast.makeText(
                          this,
                          "Listing posted successfully!",
                          Toast.LENGTH_LONG
                      ).show()

                      showListings(listing.category)
                  }

                  root.addView(post)

                  val back = makeButton("BACK TO MARKETPLACE")

                  back.setOnClickListener {
                      showMarketplace()
                  }

                  root.addView(back)

                  scroll.addView(root)
                  setContentView(scroll)
              }

              private fun field(hintValue: String): EditText {
                  return EditText(this).apply {
                      hint = hintValue
                      textSize = 16f
                      setTextColor(textColor)

                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply {
                          setMargins(0, 5, 0, 5)
                      }
                  }
              }

              private fun saveListing(listing: Listing) {

                  val prefs = getSharedPreferences(
                      "farmersmeet",
                      Context.MODE_PRIVATE
                  )

                  val array = JSONArray(
                      prefs.getString("listings", "[]") ?: "[]"
                  )

                  val item = JSONObject()

                  item.put("name", listing.name)
                  item.put("category", listing.category)
                  item.put("price", listing.price)
                  item.put("quantity", listing.quantity)
                  item.put("location", listing.location)
                  item.put("seller", listing.seller)
                  item.put("description", listing.description)

                  array.put(item)

                  prefs.edit()
                      .putString("listings", array.toString())
                      .apply()
              }

              private fun getListings(): List<Listing> {

                  val prefs = getSharedPreferences(
                      "farmersmeet",
                      Context.MODE_PRIVATE
                  )

                  val array = JSONArray(
                      prefs.getString("listings", "[]") ?: "[]"
                  )

                  val result = mutableListOf<Listing>()

                  for (i in 0 until array.length()) {

                      val item = array.getJSONObject(i)

                      result.add(
                          Listing(
                              item.optString("name"),
                              item.optString("category"),
                              item.optString("price"),
                              item.optString("quantity"),
                              item.optString("location"),
                              item.optString("seller"),
                              item.optString("description")
                          )
                      )
                  }

                  return result
              }

              private fun seedListings() {

                  val prefs = getSharedPreferences(
                      "farmersmeet",
                      Context.MODE_PRIVATE
                  )

                  if (prefs.getBoolean("seeded", false)) {
                      return
                  }

                  val sampleListings = listOf(

                      Listing(
                          "Healthy Large Pig",
                          "Pigs and Piglets",
                          "₦250,000",
                          "1 pig",
                          "Aba, Abia State",
                          "John's Pig Farm",
                          "Healthy mature pig suitable for breeding."
                      ),

                      Listing(
                          "Weaner Piglets",
                          "Pigs and Piglets",
                          "₦85,000",
                          "2 piglets",
                          "Umuahia, Abia State",
                          "Green Valley Farm",
                          "Healthy weaner piglets."
                      ),

                      Listing(
                          "Fresh Catfish",
                          "Fish and Aquaculture",
                          "₦2,500",
                          "10 kg",
                          "Abakaliki, Ebonyi State",
                          "Ebonyi Fish Farm",
                          "Fresh farm-raised catfish."
                      ),

                      Listing(
                          "Catfish Fingerlings",
                          "Fish and Aquaculture",
                          "₦25,000",
                          "1,000 fingerlings",
                          "Umuahia, Abia State",
                          "AquaGrow Nigeria",
                          "Healthy catfish fingerlings."
                      ),

                      Listing(
                          "Dried Maize",
                          "Crops and Farm Produce",
                          "₦65,000",
                          "100 kg",
                          "Abakaliki, Ebonyi State",
                          "Agro Best Farm",
                          "Clean dried maize."
                      ),

                      Listing(
                          "Broiler Chickens",
                          "Poultry",
                          "₦12,000",
                          "10 birds",
                          "Umuahia, Abia State",
                          "Sunrise Poultry",
                          "Healthy broiler chickens."
                      ),

                      Listing(
                          "Healthy Goats",
                          "Other Livestock",
                          "₦120,000",
                          "2 goats",
                          "Abakaliki, Ebonyi State",
                          "Ebony Livestock Farm",
                          "Healthy goats for sale."
                      ),

                      Listing(
                          "Hybrid Maize Seeds",
                          "Seeds and Seedlings",
                          "₦18,000",
                          "5 kg",
                          "Aba, Abia State",
                          "Farm Input Centre",
                          "Quality hybrid maize seeds."
                      ),

                      Listing(
                          "Knapsack Sprayer",
                          "Farm Equipment",
                          "₦45,000",
                          "1 unit",
                          "Aba, Abia State",
                          "Agro Tools Nigeria",
                          "Farm spraying equipment."
                      )
                  )

                  sampleListings.forEach {
                      saveListing(it)
                  }

                  prefs.edit()
                      .putBoolean("seeded", true)
                      .apply()
              }
          }
          KOTLIN

      - name: Verify project files
        shell: bash
        run: |
          test -f FarmersMeet/settings.gradle
          test -f FarmersMeet/build.gradle
          test -f FarmersMeet/app/build.gradle
          test -f FarmersMeet/app/src/main/AndroidManifest.xml
          test -f FarmersMeet/app/src/main/res/values/themes.xml
          test -f FarmersMeet/app/src/main/java/ng/farmersmeet/nigeria/MainActivity.kt
          echo "FarmersMeet Stage 4 files verified."

      - name: Build APK
        working-directory: FarmersMeet
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FarmersMeet-Stage4-APK
          path: FarmersMeet/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
