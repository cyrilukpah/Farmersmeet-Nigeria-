          cat > FarmersMeet/app/src/main/java/ng/farmersmeet/nigeria/MainActivity.kt <<'EOF'
          package ng.farmersmeet.nigeria

          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.widget.ArrayAdapter
          import android.widget.Button
          import android.widget.EditText
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.Spinner
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import org.json.JSONArray
          import org.json.JSONObject

          data class Listing(
              val id: Long,
              val name: String,
              val category: String,
              val price: String,
              val quantity: String,
              val location: String,
              val seller: String,
              val phone: String,
              val description: String,
              val photoUri: String,
              val isMine: Boolean
          )

          class MainActivity : AppCompatActivity() {

              private val green = Color.rgb(23, 107, 53)
              private val darkGreen = Color.rgb(13, 77, 37)
              private val yellow = Color.rgb(244, 196, 48)
              private val backgroundColor = Color.rgb(247, 250, 245)
              private val textColor = Color.rgb(24, 53, 31)

              private val categories = arrayOf(
                  "Crops and Farm Produce",
                  "Pigs and Piglets",
                  "Fish and Aquaculture",
                  "Other Livestock",
                  "Poultry",
                  "Seeds and Seedlings",
                  "Farm Equipment"
              )

              private var selectedPhotoUri: Uri? = null
              private var selectedPhotoView: ImageView? = null

              private val photoPicker =
                  registerForActivityResult(
                      ActivityResultContracts.OpenDocument()
                  ) { uri ->

                      if (uri != null) {

                          try {
                              contentResolver.takePersistableUriPermission(
                                  uri,
                                  Intent.FLAG_GRANT_READ_URI_PERMISSION
                              )
                          } catch (_: Exception) {
                          }

                          selectedPhotoUri = uri

                          selectedPhotoView?.apply {
                              setImageURI(uri)
                              visibility = View.VISIBLE
                          }
                      }
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  try {
                      seedListings()
                      showHome()
                  } catch (e: Exception) {
                      showStartupError(e)
                  }
              }

              private fun showStartupError(error: Exception) {

                  val root = baseLayout()

                  root.gravity = Gravity.CENTER

                  val title = TextView(this).apply {
                      text = "FarmersMeet"
                      textSize = 32f
                      setTextColor(green)
                      gravity = Gravity.CENTER
                  }

                  val message = TextView(this).apply {
                      text = "FarmersMeet could not start correctly.\n\nPlease restart the app."
                      textSize = 17f
                      setTextColor(textColor)
                      gravity = Gravity.CENTER
                      setPadding(20, 20, 20, 20)
                  }

                  root.addView(title)
                  root.addView(message)

                  setContentView(root)
              }

              private fun baseLayout(): LinearLayout {
                  return LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(backgroundColor)
                      setPadding(20, 20, 20, 20)
                  }
              }

              private fun heading(value: String): TextView {
                  return TextView(this).apply {
                      text = value
                      textSize = 28f
                      setTextColor(green)
                      setTypeface(null, android.graphics.Typeface.BOLD)
                      setPadding(0, 10, 0, 18)
                  }
              }

              private fun makeButton(
                  value: String,
                  yellowButton: Boolean = false
              ): Button {

                  return Button(this).apply {

                      text = value
                      textSize = 15f

                      setTypeface(
                          null,
                          android.graphics.Typeface.BOLD
                      )

                      setTextColor(
                          if (yellowButton) textColor else Color.WHITE
                      )

                      setBackgroundColor(
                          if (yellowButton) yellow else green
                      )

                      layoutParams =
                          LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT,
                              LinearLayout.LayoutParams.WRAP_CONTENT
                          ).apply {
                              setMargins(0, 6, 0, 6)
                          }
                  }
              }

              private fun showHome() {

                  val root = baseLayout()

                  root.gravity = Gravity.CENTER

                  val logo = heading("FarmersMeet")

                  logo.textSize = 40f
                  logo.gravity = Gravity.CENTER

                  val subtitle = TextView(this).apply {
                      text =
                          "Connecting farmers, buyers and agricultural businesses"
                      textSize = 16f
                      setTextColor(textColor)
                      gravity = Gravity.CENTER
                      setPadding(10, 0, 10, 25)
                  }

                  val enter =
                      makeButton(
                          "ENTER MARKETPLACE",
                          true
                      )

                  enter.setOnClickListener {
                      showMarketplace()
                  }

                  root.addView(logo)
                  root.addView(subtitle)
                  root.addView(enter)

                  setContentView(root)
              }

              private fun showMarketplace() {

                  val scroll = ScrollView(this)
                  val root = baseLayout()

                  root.addView(
                      heading("FarmersMeet Marketplace")
                  )

                  val subtitle = TextView(this).apply {
                      text = "Buy and sell agricultural products"
                      textSize = 16f
                      setTextColor(textColor)
                      setPadding(0, 0, 0, 12)
                  }

                  root.addView(subtitle)

                  val search = EditText(this).apply {
                      hint = "Search pigs, fish, crops..."
                      textSize = 16f
                      setSingleLine(true)
                      setTextColor(textColor)

                      layoutParams =
                          LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT,
                              LinearLayout.LayoutParams.WRAP_CONTENT
                          )
                  }

                  root.addView(search)

                  val searchButton =
                      makeButton("SEARCH", true)

                  searchButton.setOnClickListener {
                      showSearchResults(
                          search.text.toString().trim()
                      )
                  }

                  root.addView(searchButton)

                  val favorites =
                      makeButton("❤️ MY FAVORITES")

                  favorites.setOnClickListener {
                      showFavorites()
                  }

                  root.addView(favorites)

                  val myListings =
                      makeButton("MY LISTINGS")

                  myListings.setOnClickListener {
                      showMyListings()
                  }

                  root.addView(myListings)

                  val categoryTitle =
                      TextView(this).apply {
                          text = "Browse Categories"
                          textSize = 21f
                          setTextColor(green)
                          setTypeface(
                              null,
                              android.graphics.Typeface.BOLD
                          )
                          setPadding(0, 15, 0, 8)
                      }

                  root.addView(categoryTitle)

                  categories.forEach { category ->

                      val button = makeButton(category)

                      button.setOnClickListener {
                          showListings(category)
                      }

                      root.addView(button)
                  }

                  val sell =
                      makeButton(
                          "SELL AN ITEM",
                          true
                      )

                  sell.setOnClickListener {
                      showSell()
                  }

                  root.addView(sell)

                  scroll.addView(root)

                  setContentView(scroll)
              }

              private fun showListings(category: String) {

                  val results =
                      getListings()
                          .filter {
                              it.category == category
                          }
                          .reversed()

                  showListingPage(category, results)
              }

              private fun showSearchResults(query: String) {

                  val lower = query.lowercase()

                  val results =
                      if (lower.isEmpty()) {
                          getListings()
                      } else {
                          getListings().filter {

                              it.name.lowercase().contains(lower) ||
                              it.category.lowercase().contains(lower) ||
                              it.location.lowercase().contains(lower) ||
                              it.seller.lowercase().contains(lower)
                          }
                      }

                  showListingPage(
                      if (query.isEmpty())
                          "All Listings"
                      else
                          "Search: $query",
                      results.reversed()
                  )
              }

              private fun showFavorites() {

                  val favorites =
                      getListings()
                          .filter {
                              isFavorite(it.id)
                          }
                          .reversed()

                  showListingPage(
                      "My Favorites",
                      favorites
                  )
              }

              private fun showMyListings() {

