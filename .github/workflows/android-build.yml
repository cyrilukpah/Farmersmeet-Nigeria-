name: FarmersMeet Stage 7 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build FarmersMeet Stage 7
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Create FarmersMeet Stage 7 project
        shell: bash
        run: |
          set -e

          rm -rf FarmersMeet

          mkdir -p FarmersMeet/app/src/main/java/ng/farmersmeet/nigeria
          mkdir -p FarmersMeet/app/src/main/res/values

          cat > FarmersMeet/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "FarmersMeetNigeria"
          include(":app")
          EOF

          cat > FarmersMeet/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat > FarmersMeet/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > FarmersMeet/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'ng.farmersmeet.nigeria'
              compileSdk 35

              defaultConfig {
                  applicationId 'ng.farmersmeet.nigeria'
                  minSdk 24
                  targetSdk 35
                  versionCode 8
                  versionName "8.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.15.0'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.activity:activity-ktx:1.10.1'
          }
          EOF

          cat > FarmersMeet/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/AppTheme"
                  android:label="FarmersMeet"
                  android:allowBackup="true"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > FarmersMeet/app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="AppTheme"
                  parent="Theme.AppCompat.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#176B35</item>
                  <item name="android:statusBarColor">#0D4D25</item>
                  <item name="android:navigationBarColor">#0D4D25</item>
                  <item name="android:windowLightStatusBar">false</item>

              </style>

          </resources>
          EOF

          cat > FarmersMeet/app/src/main/java/ng/farmersmeet/nigeria/MainActivity.kt <<'EOF'
          package ng.farmersmeet.nigeria

          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              private val green = Color.rgb(23, 107, 53)
              private val darkGreen = Color.rgb(13, 77, 37)
              private val yellow = Color.rgb(244, 196, 48)
              private val background = Color.rgb(247, 250, 245)
              private val text = Color.rgb(24, 53, 31)

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  showHome()
              }

              private fun root(): LinearLayout =
                  LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(background)
                      setPadding(24, 24, 24, 24)
                  }

              private fun title(value: String): TextView =
                  TextView(this).apply {
                      this.text = value
                      textSize = 30f
                      setTextColor(green)
                      setTypeface(null, android.graphics.Typeface.BOLD)
                      gravity = Gravity.CENTER
                      setPadding(0, 20, 0, 20)
                  }

              private fun button(
                  value: String,
                  gold: Boolean = false
              ): Button =
                  Button(this).apply {
                      text = value
                      textSize = 16f
                      isAllCaps = false
                      isClickable = true
                      isFocusable = true
                      setTextColor(
                          if (gold) text else Color.WHITE
                      )
                      setBackgroundColor(
                          if (gold) yellow else green
                      )

                      layoutParams =
                          LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.WRAP_CONTENT
                          ).apply {
                              setMargins(0, 8, 0, 8)
                          }
                  }

              private fun showHome() {
                  val r = root().apply {
                      gravity = Gravity.CENTER
                  }

                  val logo = title("FarmersMeet").apply {
                      textSize = 40f
                  }

                  val subtitle =
                      TextView(this).apply {
                          text =
                              "Connecting farmers, buyers and agricultural businesses"
                          textSize = 17f
                          setTextColor(text)
                          gravity = Gravity.CENTER
                          setPadding(0, 0, 0, 30)
                      }

                  val enter =
                      button("ENTER MARKETPLACE", true)

                  enter.setOnClickListener {
                      showMarketplace()
                  }

                  r.addView(logo)
                  r.addView(subtitle)
                  r.addView(enter)

                  setContentView(r)
              }

              private fun showMarketplace() {
                  val scroll = ScrollView(this)
                  val r = root()

                  r.addView(title("FarmersMeet Marketplace"))

                  r.addView(
                      TextView(this).apply {
                          text =
                              "Buy and sell agricultural products across Nigeria."
                          textSize = 17f
                          setTextColor(text)
                          setPadding(0, 0, 0, 15)
                      }
                  )

                  val search = EditText(this).apply {
                      hint = "Search products..."
                      textSize = 16f
                      setSingleLine(true)
                  }

                  r.addView(search)

                  r.addView(
                      button("SEARCH", true).apply {
                          setOnClickListener {
                              val q =
                                  search.text.toString().trim()

                              Toast.makeText(
                                  this@MainActivity,
                                  if (q.isEmpty())
                                      "Showing all listings"
                                  else
                                      "Searching for: $q",
                                  Toast.LENGTH_SHORT
                              ).show()
                          }
                      }
                  )

                  val categories = arrayOf(
                      "Crops & Farm Produce",
                      "Pigs & Piglets",
                      "Fish & Aquaculture",
                      "Other Livestock",
                      "Poultry",
                      "Seeds & Seedlings",
                      "Farm Equipment"
                  )

                  r.addView(
                      TextView(this).apply {
                          text = "Browse Categories"
                          textSize = 22f
                          setTextColor(green)
                          setTypeface(
                              null,
                              android.graphics.Typeface.BOLD
                          )
                          setPadding(0, 20, 0, 10)
                      }
                  )

                  categories.forEach { category ->
                      r.addView(
                          button(category).apply {
                              setOnClickListener {
                                  Toast.makeText(
                                      this@MainActivity,
                                      "$category selected",
                                      Toast.LENGTH_SHORT
                                  ).show()
                              }
                          }
                      )
                  }

                  r.addView(
                      button("SELL AN ITEM", true).apply {
                          setOnClickListener {
                              showSell()
                          }
                      }
                  )

                  r.addView(
                      button("EXIT").apply {
                          setOnClickListener {
                              finish()
                          }
                      }
                  )

                  scroll.addView(r)
                  setContentView(scroll)
              }

              private fun showSell() {
                  val scroll = ScrollView(this)
                  val r = root()

                  r.addView(title("Sell an Item"))

                  val fields = listOf(
                      "Product name",
                      "Price in Naira",
                      "Quantity",
                      "Location",
                      "Seller name",
                      "Phone number",
                      "Description"
                  )

                  val inputs = mutableListOf<EditText>()

                  fields.forEach { hint ->
                      val edit =
                          EditText(this).apply {
                              this.hint = hint
                              textSize = 16f
                              setSingleLine(
                                  hint != "Description"
                              )
                          }

                      inputs.add(edit)
                      r.addView(edit)
                  }

                  r.addView(
                      button("POST LISTING", true).apply {
                          setOnClickListener {
                              if (
                                  inputs.take(6).any {
                                      it.text.toString()
                                          .trim()
                                          .isEmpty()
                                  }
                              ) {
                                  Toast.makeText(
                                      this@MainActivity,
                                      "Please complete all required fields.",
                                      Toast.LENGTH_SHORT
                                  ).show()
                              } else {
                                  Toast.makeText(
                                      this@MainActivity,
                                      "Listing posted successfully!",
                                      Toast.LENGTH_LONG
                                  ).show()
                              }
                          }
                      }
                  )

                  r.addView(
                      button("BACK TO MARKETPLACE").apply {
                          setOnClickListener {
                              showMarketplace()
                          }
                      }
                  )

                  scroll.addView(r)
                  setContentView(scroll)
              }
          }
          EOF

      - name: Verify project
        shell: bash
        run: |
          set -e

          test -f FarmersMeet/settings.gradle
          test -f FarmersMeet/build.gradle
          test -f FarmersMeet/app/build.gradle
          test -f FarmersMeet/app/src/main/AndroidManifest.xml
          test -f FarmersMeet/app/src/main/res/values/themes.xml
          test -f FarmersMeet/app/src/main/java/ng/farmersmeet/nigeria/MainActivity.kt

          echo "Project files verified."

      - name: Build APK
        working-directory: FarmersMeet
        shell: bash
        run: |
          set -e
          gradle :app:assembleDebug --stacktrace

      - name: Verify APK exists
        shell: bash
        run: |
          set -e

          APK="FarmersMeet/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            find FarmersMeet/app/build -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK FOUND:"
          ls -lh "$APK"

          echo "APK SIZE:"
          du -h "$APK"

      - name: Upload Stage 7 APK
        uses: actions/upload-artifact@v4
        with:
          name: FarmersMeet-Stage7-APK
          path: FarmersMeet/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
