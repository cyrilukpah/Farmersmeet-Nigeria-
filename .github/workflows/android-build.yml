          cat > app/src/main/java/ng/farmersmeet/nigeria/SellActivity.kt <<'EOF'
          package ng.farmersmeet.nigeria

          import android.os.Bundle
          import android.widget.Button
          import android.widget.EditText
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity

          class SellActivity : AppCompatActivity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_sell)

                  findViewById<Button>(R.id.postButton).setOnClickListener {
                      val item = findViewById<EditText>(R.id.itemName).text.toString().trim()

                      if (item.isEmpty()) {
                          findViewById<EditText>(R.id.itemName).error =
                              "Enter product name"
                          return@setOnClickListener
                      }

                      Toast.makeText(
                          this,
                          "Listing for $item is ready for the next stage.",
                          Toast.LENGTH_LONG
                      ).show()
                  }
              }
          }
          EOF

      - name: Set up JDK 17
