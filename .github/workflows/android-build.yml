name: Build FarmersMeet APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Show project structure
        run: |
          echo "===== PROJECT STRUCTURE ====="
          find . -maxdepth 4 -type f | sort

      - name: Show Gradle configuration
        run: |
          echo "===== SETTINGS.GRADLE ====="
          cat settings.gradle || true

          echo "===== ROOT BUILD.GRADLE ====="
          cat build.gradle || true

          echo "===== APP BUILD.GRADLE ====="
          cat app/build.gradle || true

      - name: Show available Gradle tasks
        run: |
          echo "===== ROOT TASKS ====="
          gradle tasks --all

          echo "===== APP TASKS ====="
          gradle :app:tasks --all
