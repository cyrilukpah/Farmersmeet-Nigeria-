name: FarmersMeet Stage 9 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  GRADLE_VERSION: 8.10.2

jobs:
  build:
    name: Build FarmersMeet Stage 9
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. CHECKOUT
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # 2. JAVA 17
      # ---------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # ---------------------------------------------------------
      # 3. ANDROID SDK
      #
      # IMPORTANT:
      # We DO NOT install "tools".
      # We install only the packages actually required.
      # ---------------------------------------------------------
      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "Android SDK directory not found."
            exit 1
          fi

          SDKMANAGER=""

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -name sdkmanager \
              -perm -111 \
              2>/dev/null | sort -V | tail -1 || true)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager could not be found."
            find "$ANDROID_HOME" -maxdepth 5 -type f -name sdkmanager -print || true
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          echo "Accepting Android SDK licenses..."

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses \
            >/dev/null 2>&1 || true

          echo "Installing required Android SDK packages..."

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK packages installed."

          echo "Installed platforms:"
          "$ANDROID_HOME/cmdline-tools/$(basename "$(dirname "$(dirname "$SDKMANAGER")")")/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" --list \
            2>/dev/null | grep "platforms;android-35" | head -5 || true


      # ---------------------------------------------------------
      # 4. ADD ANDROID TO PATH
      # ---------------------------------------------------------
      - name: Configure Android PATH
        shell: bash
        run: |
          set -e

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

          SDKMANAGER_DIR=$(find "$ANDROID_HOME/cmdline-tools" \
            -type d \
            -name bin \
            2>/dev/null | sort -V | tail -1 || true)

          if [ -n "$SDKMANAGER_DIR" ]; then
            echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          fi

          echo "Android PATH configured."


      # ---------------------------------------------------------
      # 5. CREATE FARMERSMEET STAGE 9 PROJECT
      # ---------------------------------------------------------
      - name: Create FarmersMeet Stage 9 project
        shell: bash
        run: |
          set -e

          rm -rf FarmersMeet

          mkdir -p \
            FarmersMeet/app/src/main/java/ng/farmersmeet/nigeria

          mkdir -p \
            FarmersMeet/app/src/main/res/values


          # -----------------------------------------------------
          # settings.gradle
          # -----------------------------------------------------
          cat > FarmersMeet/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "FarmersMeetNigeria"

          include(":app")
          EOF


          # -----------------------------------------------------
          # ROOT build.gradle
          # -----------------------------------------------------
          cat > FarmersMeet/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF


          # -----------------------------------------------------
          # gradle.properties
          # -----------------------------------------------------
          cat > FarmersMeet/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF


          # -----------------------------------------------------
          # APP build.gradle
          # -----------------------------------------------------
          cat > FarmersMeet/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'ng.farmersmeet.nigeria'

              compileSdk 35

              defaultConfig {
                  applicationId 'ng.farmersmeet.nigeria'

                  minSdk 24
                  targetSdk 35

                  versionCode 10
                  versionName "9.0"
              }

              buildTypes {
                  debug {
                      debuggable true
                      minifyEnabled false
                  }

                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.15.0'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.activity:activity-ktx:1.10.1'
          }
          EOF


          # -----------------------------------------------------
          # AndroidManifest.xml
          # -----------------------------------------------------
          cat > FarmersMeet/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="FarmersMeet"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


          # -----------------------------------------------------
          # THEME
          # -----------------------------------------------------
          cat > FarmersMeet/app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="Theme.AppCompat.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:colorAccent">
                      #176B35
                  </item>

                  <item name="android:statusBarColor">
                      #0D4D25
                  </item>

                  <item name="android:navigationBarColor">
                      #0D4D25
                  </item>

                  <item name="android:windowLightStatusBar">
                      false
                  </item>

              </style>

          </resources>
          EOF


      # ---------------------------------------------------------
      # 6. CREATE MAIN ACTIVITY
      #
      # The actual Stage 9 application code is inserted here.
      # ---------------------------------------------------------
      - name: Create Stage 9 MainActivity
        shell: bash
        run: |
          set -e

          cat > FarmersMeet/app/src/main/java/ng/farmersmeet/nigeria/MainActivity.kt <<'EOF'
          package ng.farmersmeet.nigeria

          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.ArrayAdapter
          import android.widget.Button
          import android.widget.EditText
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.Spinner
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import org.json.JSONArray
          import org.json.JSONObject

          data class Listing(
              val id: Long,
              val name: String,
              val category: String,
              val price: String,
              val quantity: String,
              val location: String,
              val seller: String,
              val phone: String,
              val description: String,
              val photoUri: String,
              val isMine: Boolean
          )

          data class SellerProfile(
              val name: String,
              val farmName: String,
              val phone: String,
              val location: String,
              val about: String
          )

          class MainActivity : AppCompatActivity() {

              private val green = Color.rgb(23, 107, 53)
              private val darkGreen = Color.rgb(13, 77, 37)
              private val yellow = Color.rgb(244, 196, 48)
              private val backgroundColor = Color.rgb(247, 250, 245)
              private val textColor = Color.rgb(24, 53, 31)

              private val categories = arrayOf(
                  "Crops and Farm Produce",
                  "Pigs and Piglets",
                  "Fish and Aquaculture",
                  "Other Livestock",
                  "Poultry",
                  "Seeds and Seedlings",
                  "Farm Equipment"
              )

              private var selectedPhotoUri: Uri? = null
              private var selectedPhotoView: ImageView? = null

              private val photoPicker =
                  registerForActivityResult(
                      ActivityResultContracts.OpenDocument()
                  ) { uri ->

                      if (uri != null) {

                          try {
                              contentResolver.takePersistableUriPermission(
                                  uri,
                                  Intent.FLAG_GRANT_READ_URI_PERMISSION
                              )
                          } catch (_: Exception) {
                          }

                          selectedPhotoUri = uri

                          selectedPhotoView?.apply {
                              setImageURI(uri)
                              visibility = ImageView.VISIBLE
                          }
                      }
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  seedListings()
                  showHome()
              }

              private fun baseLayout(): LinearLayout {
                  return LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(backgroundColor)
                      setPadding(20, 20, 20, 20)
                  }
              }

              private fun heading(value: String): TextView {
                  return TextView(this).apply {
                      text = value
                      textSize = 28f
                      setTextColor(green)
                      setTypeface(
                          null,
                          android.graphics.Typeface.BOLD
                      )
                      setPadding(0, 10, 0, 18)
                  }
              }

              private fun makeButton(
                  value: String,
                  yellowButton: Boolean = false
              ): Button {

                  return Button(this).apply {

                      text = value
                      textSize = 15f

                      setTypeface(
                          null,
                          android.graphics.Typeface.BOLD
                      )

                      setTextColor(
                          if (yellowButton) {
                              textColor
                          } else {
                              Color.WHITE
                          }
                      )

                      setBackgroundColor(
                          if (yellowButton) {
                              yellow
                          } else {
                              green
                          }
                      )

                      layoutParams =
                          LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT,
                              LinearLayout.LayoutParams.WRAP_CONTENT
                          ).apply {
                              setMargins(0, 6, 0, 6)
                          }
                  }
              }

              private fun showHome() {

                  val root = baseLayout()

                  root.gravity = Gravity.CENTER

                  val logo = heading("FarmersMeet")

                  logo.textSize = 40f
                  logo.gravity = Gravity.CENTER

                  val stage = TextView(this).apply {
                      text = "STAGE 9"
                      textSize = 13f
                      setTextColor(green)
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 12)
                  }

                  val subtitle = TextView(this).apply {
                      text =
                          "Connecting farmers, buyers and agricultural businesses"
                      textSize = 16f
                      setTextColor(textColor)
                      gravity = Gravity.CENTER
                      setPadding(10, 0, 10, 25)
                  }

                  val enter =
                      makeButton(
                          "ENTER MARKETPLACE",
                          true
                      )

                  enter.setOnClickListener {
                      showMarketplace()
                  }

                  root.addView(logo)
                  root.addView(stage)
                  root.addView(subtitle)
                  root.addView(enter)

                  setContentView(root)
              }

              private fun showMarketplace() {

                  val scroll = ScrollView(this)
                  val root = baseLayout()

                  root.addView(
                      heading("FarmersMeet Marketplace")
                  )

                  root.addView(
                      TextView(this).apply {
                          text =
                              "Buy and sell agricultural products"
                          textSize = 16f
                          setTextColor(textColor)
                          setPadding(0, 0, 0, 12)
                      }
                  )

                  val search = EditText(this).apply {
                      hint = "Search pigs, fish, crops..."
                      textSize = 16f
                      setSingleLine(true)
                      setTextColor(textColor)
                  }

                  root.addView(search)

                  val searchButton =
                      makeButton("SEARCH", true)

                  searchButton.setOnClickListener {
                      showSearchResults(
                          search.text.toString().trim()
                      )
                  }

                  root.addView(searchButton)

                  val profile =
                      makeButton("MY SELLER PROFILE")

                  profile.setOnClickListener {
                      showSellerProfile()
                  }

                  root.addView(profile)

                  val favorites =
                      makeButton("❤️ MY FAVORITES")

                  favorites.setOnClickListener {
                      showFavorites()
                  }

                  root.addView(favorites)

                  val myListings =
                      makeButton("MY LISTINGS")

                  myListings.setOnClickListener {
                      showMyListings()
                  }

                  root.addView(myListings)

                  root.addView(
                      TextView(this).apply {
                          text = "Browse Categories"
                          textSize = 21f
                          setTextColor(green)
                          setTypeface(
                              null,
                              android.graphics.Typeface.BOLD
                          )
                          setPadding(0, 15, 0, 8)
                      }
                  )

                  categories.forEach { category ->

                      val button =
                          makeButton(category)

                      button.setOnClickListener {
                          showListings(category)
                      }

                      root.addView(button)
                  }

                  val sell =
                      makeButton(
                          "SELL AN ITEM",
                          true
                      )

                  sell.setOnClickListener {
                      showSell(null)
                  }

                  root.addView(sell)

                  scroll.addView(root)

                  setContentView(scroll)
              }

              private fun showSellerProfile() {

                  val profile = getProfile()

                  val scroll = ScrollView(this)
                  val root = baseLayout()

                  root.addView(
                      heading("My Seller Profile")
                  )

                  val name = field("Your name")
                  name.setText(profile.name)

                  val farm =
                      field("Farm / Business name")
                  farm.setText(profile                  }

                  enter.setOnClickListener {
                      showMarketplace()
                  }

                  root.addView(logo)
                  root.addView(stage)
                  root.addView(subtitle)
                  root.addView(enter)

                  setContentView(root)
              }

              private fun showMarketplace() {

                  val scroll = ScrollView(this)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(background)
                      setPadding(22, 22, 22, 22)
                  }

                  val title = TextView(this).apply {
                      text = "FarmersMeet Marketplace"
                      textSize = 28f
                      setTextColor(green)
                      setTypeface(null, android.graphics.Typeface.BOLD)
                      setPadding(0, 10, 0, 12)
                  }

                  val description = TextView(this).apply {
                      text = "Buy and sell agricultural products"
                      textSize = 17f
                      setTextColor(text)
                      setPadding(0, 0, 0, 20)
                  }

                  root.addView(title)
                  root.addView(description)

                  val categories = arrayOf(
                      "Crops and Farm Produce",
                      "Pigs and Piglets",
                      "Fish and Aquaculture",
                      "Other Livestock",
                      "Poultry",
                      "Seeds and Seedlings",
                      "Farm Equipment"
                  )

                  categories.forEach { category ->

                      val button = Button(this).apply {
                          this.text = category
                          textSize = 15f
                          setTextColor(Color.WHITE)
                          setBackgroundColor(green)

                          layoutParams =
                              LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  LinearLayout.LayoutParams.WRAP_CONTENT
                              ).apply {
                                  setMargins(0, 5, 0, 5)
                              }
                      }

                      button.setOnClickListener {

                          showCategory(category)
                      }

                      root.addView(button)
                  }

                  val sell = Button(this).apply {
                      text = "SELL AN ITEM"
                      textSize = 16f
                      setTextColor(text)
                      setBackgroundColor(yellow)

                      layoutParams =
                          LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT,
                              LinearLayout.LayoutParams.WRAP_CONTENT
                          ).apply {
                              setMargins(0, 20, 0, 8)
                          }
                  }

                  sell.setOnClickListener {
                      showSellInfo()
                  }

                  root.addView(sell)

                  val profile = Button(this).apply {
                      text = "MY SELLER PROFILE"
                      textSize = 15f
                      setTextColor(Color.WHITE)
                      setBackgroundColor(darkGreen)

                      layoutParams =
                          LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT,
                              LinearLayout.LayoutParams.WRAP_CONTENT
                          )
                  }

                  profile.setOnClickListener {
                      showProfile()
                  }

                  root.addView(profile)

                  scroll.addView(root)

                  setContentView(scroll)
              }

              private fun showCategory(category: String) {

                  val scroll = ScrollView(this)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(background)
                      setPadding(22, 22, 22, 22)
                  }

                  val title = TextView(this).apply {
                      text = category
                      textSize = 27f
                      setTextColor(green)
                      setTypeface(null, android.graphics.Typeface.BOLD)
                      setPadding(0, 10, 0, 18)
                  }

                  root.addView(title)

                  val sample = TextView(this).apply {
                      text = when (category) {
                          "Pigs and Piglets" ->
                              "Healthy pigs and piglets available from Nigerian farms."

                          "Fish and Aquaculture" ->
                              "Catfish, fingerlings and other aquaculture products."

                          "Crops and Farm Produce" ->
                              "Fresh and processed agricultural produce."

                          "Poultry" ->
                              "Broilers, layers and other poultry products."

                          "Other Livestock" ->
                              "Goats, sheep and other livestock."

                          "Seeds and Seedlings" ->
                              "Seeds and planting materials for farmers."

                          else ->
                              "Farm tools, machinery and agricultural equipment."
                      }

                      textSize = 17f
                      setTextColor(text)
                      setPadding(0, 0, 0, 25)
                  }

                  root.addView(sample)

                  val back = Button(this).apply {
                      text = "BACK TO MARKETPLACE"
                      setTextColor(Color.WHITE)
                      setBackgroundColor(green)
                  }

                  back.setOnClickListener {
                      showMarketplace()
                  }

                  root.addView(back)

                  scroll.addView(root)

                  setContentView(scroll)
              }

              private fun showSellInfo() {

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(background)
                      setPadding(22, 22, 22, 22)
                  }

                  val title = TextView(this).apply {
                      text = "Sell an Item"
                      textSize = 28f
                      setTextColor(green)
                      setTypeface(null, android.graphics.Typeface.BOLD)
                  }

                  val message = TextView(this).apply {
                      text =
                          "Stage 9 seller marketplace is ready.\n\n" +
                          "Create your seller profile first, then add your agricultural products."
                      textSize = 17f
                      setTextColor(text)
                      setPadding(0, 20, 0, 25)
                  }

                  val profile = Button(this).apply {
                      text = "CREATE / EDIT SELLER PROFILE"
                      setTextColor(Color.WHITE)
                      setBackgroundColor(green)
                  }

                  profile.setOnClickListener {
                      showProfile()
                  }

                  val back = Button(this).apply {
                      text = "BACK TO MARKETPLACE"
                      setTextColor(text)
                      setBackgroundColor(yellow)
                  }

                  back.setOnClickListener {
                      showMarketplace()
                  }

                  root.addView(title)
                  root.addView(message)
                  root.addView(profile)
                  root.addView(back)

                  setContentView(root)
              }

              private fun showProfile() {

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(background)
                      setPadding(22, 22, 22, 22)
                  }

                  val title = TextView(this).apply {
                      text = "My Seller Profile"
                      textSize = 28f
                      setTextColor(green)
                      setTypeface(null, android.graphics.Typeface.BOLD)
                  }

                  val profile = getSharedPreferences(
                      "farmersmeet",
                      Context.MODE_PRIVATE
                  )

                  val details = TextView(this).apply {
                      text =
                          "Seller profile\n\n" +
                          "Name: " +
                          profile.getString("name", "Not yet set") +
                          "\n\nFarm/Business: " +
                          profile.getString("farm", "Not yet set") +
                          "\n\nPhone: " +
                          profile.getString("phone", "Not yet set")

                      textSize = 17f
                      setTextColor(text)
                      setPadding(0, 20, 0, 25)
                  }

                  val back = Button(this).apply {
                      text = "BACK TO MARKETPLACE"
                      setTextColor(Color.WHITE)
                      setBackgroundColor(green)
                  }

                  back.setOnClickListener {
                      showMarketplace()
                  }

                  root.addView(title)
                  root.addView(details)
                  root.addView(back)

                  setContentView(root)
              }
          }
          EOF

      # ------------------------------------------------------------
      # 5. VERIFY SOURCE
      # ------------------------------------------------------------
      - name: Verify Stage 9 source files
        shell: bash
        run: |
          set -e

          test -f FarmersMeet/settings.gradle
          test -f FarmersMeet/build.gradle
          test -f FarmersMeet/app/build.gradle
          test -f FarmersMeet/app/src/main/AndroidManifest.xml
          test -f FarmersMeet/app/src/main/res/values/themes.xml
          test -f FarmersMeet/app/src/main/java/ng/farmersmeet/nigeria/MainActivity.kt

          grep -q 'versionCode 10' \
            FarmersMeet/app/build.gradle

          grep -q 'versionName "9.0"' \
            FarmersMeet/app/build.gradle

          grep -q 'android:name=".MainActivity"' \
            FarmersMeet/app/src/main/AndroidManifest.xml

          echo "Stage 9 source verification PASSED."

      # ------------------------------------------------------------
      # 6. GRADLE WRAPPER
      # ------------------------------------------------------------
      - name: Generate Gradle wrapper
        working-directory: FarmersMeet
        shell: bash
        run: |
          set -e

          gradle wrapper \
            --gradle-version 8.10.2 \
            --distribution-type bin

      # ------------------------------------------------------------
      # 7. GRADLE CHECK
      # ------------------------------------------------------------
      - name: Check Gradle environment
        working-directory: FarmersMeet
        shell: bash
        run: |
          set -e

          ./gradlew --version

          ./gradlew :app:tasks --all >/dev/null

          echo "Gradle environment PASSED."

      # ------------------------------------------------------------
      # 8. BUILD APK
      # ------------------------------------------------------------
      - name: Build FarmersMeet Stage 9 APK
        working-directory: FarmersMeet
        shell: bash
        run: |
          set -e

          ./gradlew clean :app:assembleDebug \
            --stacktrace \
            --no-daemon

      # ------------------------------------------------------------
      # 9. VERIFY APK
      # ------------------------------------------------------------
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="FarmersMeet/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="${ANDROID_SDK_ROOT}/build-tools/35.0.0/aapt"

          test -f "$APK"
          test -s "$APK"
          test -x "$AAPT"

          "$AAPT" dump badging "$APK" > /tmp/badging.txt

          grep -q \
            "package: name='ng.farmersmeet.nigeria'" \
            /tmp/badging.txt

          grep -q \
            "versionCode='10'" \
            /tmp/badging.txt

          grep -q \
            "versionName='9.0'" \
            /tmp/badging.txt

          grep -q \
            "launchable-activity" \
            /tmp/badging.txt

          echo "APK verification PASSED."

          ls -lh "$APK"

      # ------------------------------------------------------------
      # 10. CREATE ANDROID EMULATOR
      # ------------------------------------------------------------
      - name: Create Android emulator
        shell: bash
        run: |
          set -e

          echo "no" | avdmanager create avd \
            --force \
            --name FarmersMeetStage9 \
            --package "system-images;android-35;google_apis;x86_64" \
            --device "pixel_2"

          echo "Emulator created."

      # ------------------------------------------------------------
      # 11. START EMULATOR
      # ------------------------------------------------------------
      - name: Start Android emulator
        shell: bash
        run: |
          set -e

          nohup emulator \
            -avd FarmersMeetStage9 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            -no-snapshot \
            > /tmp/emulator.log 2>&1 &

          adb wait-for-device

          echo "Waiting for Android to finish booting..."

          timeout 180 bash -c '
            until adb shell getprop sys.boot_completed | tr -d "\r" | grep -q "1";
            do
              sleep 3;
            done
          '

          adb shell input keyevent 82 || true

          echo "Android emulator booted successfully."

      # ------------------------------------------------------------
      # 12. INSTALL APK
      # ------------------------------------------------------------
      - name: Install FarmersMeet Stage 9 APK
        shell: bash
        run: |
          set -e

          APK="FarmersMeet/app/build/outputs/apk/debug/app-debug.apk"

          adb install -r "$APK"

          adb shell pm list packages |
            grep -q "ng.farmersmeet.nigeria"

          echo "FarmersMeet APK installed successfully."

      # ------------------------------------------------------------
      # 13. LAUNCH TEST
      # ------------------------------------------------------------
      - name: Launch FarmersMeet Stage 9
        shell: bash
        run: |
          set -e

          adb shell am force-stop ng.farmersmeet.nigeria

          adb shell monkey \
            -p ng.farmersmeet.nigeria \
            -c android.intent.category.LAUNCHER \
            1

          sleep 8

          echo
          echo "Checking current foreground application..."

          adb shell dumpsys activity activities |
            grep -E \
            "mResumedActivity|mFocusedApp" \
            || true

          echo
          echo "Checking for FarmersMeet process..."

          adb shell pidof ng.farmersmeet.nigeria

          echo
          echo "FarmersMeet Stage 9 launch test PASSED."

      # ------------------------------------------------------------
      # 14. CHECK LOGCAT FOR FATAL CRASH
      # ------------------------------------------------------------
      - name: Check launch log
        shell: bash
        run: |
          set -e

          adb logcat -d > /tmp/farmersmeet-logcat.txt

          if grep -q \
            "FATAL EXCEPTION" \
            /tmp/farmersmeet-logcat.txt; then

              echo "A fatal Android exception was detected."

              grep -A 40 -B 10 \
                "FATAL EXCEPTION" \
                /tmp/farmersmeet-logcat.txt \
                || true

              exit 1
          fi

          echo "No fatal Android exception detected."

      # ------------------------------------------------------------
      # 15. CAPTURE LOGS IF SOMETHING GOES WRONG
      # ------------------------------------------------------------
      - name: Save Android logs
        if: always()
        shell: bash
        run: |
          adb logcat -d > /tmp/farmersmeet-logcat.txt || true

      # ------------------------------------------------------------
      # 16. UPLOAD APK
      # ------------------------------------------------------------
      - name: Upload FarmersMeet Stage 9 APK
        uses: actions/upload-artifact@v4
        with:
          name: FarmersMeet-Stage9-Full-Marketplace-APK
          path: FarmersMeet/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ------------------------------------------------------------
      # 17. UPLOAD LOGCAT
      # ------------------------------------------------------------
      - name: Upload Android launch logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FarmersMeet-Stage9-Android-Logs
          path: /tmp/farmersmeet-logcat.txt
          if-no-files-found: ignore
          retention-days: 7
