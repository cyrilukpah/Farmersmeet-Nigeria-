name: FarmersMeet Stage 7 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build FarmersMeet Stage 7
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Java 17
      # --------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # --------------------------------------------------
      # 3. Gradle
      # --------------------------------------------------
      - name: Set up Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      # --------------------------------------------------
      # 4. Android SDK environment
      # --------------------------------------------------
      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"

          if [ -z "${ANDROID_HOME}" ]; then
            export ANDROID_HOME="${ANDROID_SDK_ROOT}"
          fi

          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "$GITHUB_ENV"

          echo "${ANDROID_HOME}/platform-tools" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          if [ -d "${ANDROID_HOME}/build-tools" ]; then
            for dir in "${ANDROID_HOME}"/build-tools/*; do
              if [ -d "$dir" ]; then
                echo "$dir" >> "$GITHUB_PATH"
              fi
            done
          fi

      # --------------------------------------------------
      # 5. Create clean Stage 7 project
      # --------------------------------------------------
      - name: Create clean FarmersMeet project
        shell: bash
        run: |
          set -e

          rm -rf FarmersMeet

          mkdir -p FarmersMeet/app/src/main/java/ng/farmersmeet/nigeria
          mkdir -p FarmersMeet/app/src/main/res/values

          # ----------------------------------------------
          # settings.gradle
          # ----------------------------------------------
          cat > FarmersMeet/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "FarmersMeetNigeria"

          include(":app")
          EOF

          # ----------------------------------------------
          # Root build.gradle
          # ----------------------------------------------
          cat > FarmersMeet/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          # ----------------------------------------------
          # gradle.properties
          # ----------------------------------------------
          cat > FarmersMeet/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # ----------------------------------------------
          # App build.gradle
          # ----------------------------------------------
          cat > FarmersMeet/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'ng.farmersmeet.nigeria'

              compileSdk 35

              defaultConfig {
                  applicationId 'ng.farmersmeet.nigeria"

                  minSdk 24
                  targetSdk 35

                  versionCode 8
                  versionName "8.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildTypes {
                  debug {
                      debuggable true
                      minifyEnabled false
                  }

                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.15.0'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.activity:activity-ktx:1.10.1'
          }
          EOF

          # ----------------------------------------------
          # AndroidManifest.xml
          # ----------------------------------------------
          cat > FarmersMeet/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="FarmersMeet"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          # ----------------------------------------------
          # Theme
          # ----------------------------------------------
          cat > FarmersMeet/app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="Theme.AppCompat.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#176B35</item>
                  <item name="android:statusBarColor">#0D4D25</item>
                  <item name="android:navigationBarColor">#0D4D25</item>
                  <item name="android:windowLightStatusBar">false</item>

              </style>

          </resources>
          EOF

          # ----------------------------------------------
          # MainActivity.kt
          #
          # IMPORTANT:
          # This is Stage 7 application code.
          # ----------------------------------------------
          cat > FarmersMeet/app/src/main/java/ng/farmersmeet/nigeria/MainActivity.kt <<'EOF'
          package ng.farmersmeet.nigeria

          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.ArrayAdapter
          import android.widget.Button
          import android.widget.EditText
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.Spinner
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import org.json.JSONArray
          import org.json.JSONObject

          data class Listing(
              val id: Long,
              val name: String,
              val category: String,
              val price: String,
              val quantity: String,
              val location: String,
              val seller: String,
              val phone: String,
              val description: String,
              val photoUri: String,
              val isMine: Boolean
          )

          class MainActivity : AppCompatActivity() {

              private val green = Color.rgb(23, 107, 53)
              private val darkGreen = Color.rgb(13, 77, 37)
              private val yellow = Color.rgb(244, 196, 48)
              private val backgroundColor = Color.rgb(247, 250, 245)
              private val textColor = Color.rgb(24, 53, 31)

              private val categories = arrayOf(
                  "Crops and Farm Produce",
                  "Pigs and Piglets",
                  "Fish and Aquaculture",
                  "Other Livestock",
                  "Poultry",
                  "Seeds and Seedlings",
                  "Farm Equipment"
              )

              private var selectedPhotoUri: Uri? = null
              private var selectedPhotoView: ImageView? = null

              private val photoPicker =
                  registerForActivityResult(
                      ActivityResultContracts.OpenDocument()
                  ) { uri: Uri? ->

                      if (uri != null) {

                          try {
                              contentResolver.takePersistableUriPermission(
                                  uri,
                                  Intent.FLAG_GRANT_READ_URI_PERMISSION
                              )
                          } catch (_: Exception) {
                          }

                          selectedPhotoUri = uri

                          selectedPhotoView?.apply {
                              setImageURI(uri)
                              visibility = ImageView.VISIBLE
                          }
                      }
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  seedListings()
                  showHome()
              }

              private fun baseLayout(): LinearLayout =
                  LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(backgroundColor)
                      setPadding(20, 20, 20, 20)
                  }

              private fun heading(value: String): TextView =
                  TextView(this).apply {
                      text = value
                      textSize = 28f
                      setTextColor(green)
                      setTypeface(
                          null,
                          android.graphics.Typeface.BOLD
                      )
                      setPadding(0, 10, 0, 18)
                  }

              private fun makeButton(
                  value: String,
                  yellowButton: Boolean = false
              ): Button =
                  Button(this).apply {

                      text = value
                      textSize = 15f

                      setTypeface(
                          null,
                          android.graphics.Typeface.BOLD
                      )

                      setTextColor(
                          if (yellowButton)
                              textColor
                          else
                              Color.WHITE
                      )

                      setBackgroundColor(
                          if (yellowButton)
                              yellow
                          else
                              green
                      )

                      layoutParams =
                          LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT,
                              LinearLayout.LayoutParams.WRAP_CONTENT
                          ).apply {
                              setMargins(0, 6, 0, 6)
                          }
                  }

              private fun showHome() {

                  val root = baseLayout()

                  root.gravity = Gravity.CENTER

                  val logo = heading("FarmersMeet")

                  logo.textSize = 40f
                  logo.gravity = Gravity.CENTER

                  val subtitle =
                      TextView(this).apply {

                          text =
                              "Connecting farmers, buyers and agricultural businesses"

                          textSize = 16f

                          setTextColor(textColor)

                          gravity = Gravity.CENTER

                          setPadding(
                              10,
                              0,
                              10,
                              25
                          )
                      }

                  val enter =
                      makeButton(
                          "ENTER MARKETPLACE",
                          true
                      )

                  enter.setOnClickListener {
                      showMarketplace()
                  }

                  root.addView(logo)
                  root.addView(subtitle)
                  root.addView(enter)

                  setContentView(root)
              }

              private fun showMarketplace() {

                  val scroll = ScrollView(this)
                  val root = baseLayout()

                  root.addView(
                      heading("FarmersMeet Marketplace")
                  )

                  root.addView(
                      TextView(this).apply {
                          text =
                              "Buy and sell agricultural products"
                          textSize = 16f
                          setTextColor(textColor)
                          setPadding(0, 0, 0, 12)
                      }
                  )

                  val search =
                      EditText(this).apply {

                          hint =
                              "Search pigs, fish, crops..."

                          textSize = 16f

                          setSingleLine(true)

                          setTextColor(textColor)
                      }

                  root.addView(search)

                  val searchButton =
                      makeButton(
                          "SEARCH",
                          true
                      )

                  searchButton.setOnClickListener {

                      showSearchResults(
                          search.text.toString().trim()
                      )
                  }

                  root.addView(searchButton)

                  val favorites =
                      makeButton(
                          "❤️ MY FAVORITES"
                      )

                  favorites.setOnClickListener {
                      showFavorites()
                  }

                  root.addView(favorites)

                  val myListings =
                      makeButton(
                          "MY LISTINGS"
                      )

                  myListings.setOnClickListener {
                      showMyListings()
                  }

                  root.addView(myListings)

                  root.addView(
                      TextView(this).apply {
                          text = "Browse Categories"
                          textSize = 21f
                          setTextColor(green)
                          setTypeface(
                              null,
                              android.graphics.Typeface.BOLD
                          )
                          setPadding(
                              0,
                              15,
                              0,
                              8
                          )
                      }
                  )

                  categories.forEach { category ->

                      val button =
                          makeButton(category)

                      button.setOnClickListener {
                          showListings(category)
                      }

                      root.addView(button)
                  }

                  val sell =
                      makeButton(
                          "SELL AN ITEM",
                          true
                      )

                  sell.setOnClickListener {
                      showSell()
                  }

                  root.addView(sell)

                  scroll.addView(root)

                  setContentView(scroll)
              }

              private fun showListings(
                  category: String
              ) {

                  val results =
                      getListings()
                          .filter {
                              it.category == category
                          }
                          .reversed()

                  showListingPage(
                      category,
                      results
                  )
              }

              private fun showSearchResults(
                  query: String
              ) {

                  val lower = query.lowercase()

                  val results =
                      if (lower.isEmpty()) {

                          getListings()

                      } else {

                          getListings().filter {

                              it.name.lowercase()
                                  .contains(lower) ||

                              it.category.lowercase()
                                  .contains(lower) ||

                              it.location.lowercase()
                                  .contains(lower) ||

                              it.seller.lowercase()
                                  .contains(lower)
                          }
                      }

                  showListingPage(
                      if (query.isEmpty())
                          "All Listings"
                      else
                          "Search: $query",
                      results.reversed()
                  )
              }

              private fun showFavorites() {

                  val favorites =
                      getListings()
                          .filter {
                              isFavorite(it.id)
                          }
                          .reversed()

                  showListingPage(
                      "My Favorites",
                      favorites
                  )
              }

              private fun showMyListings() {

                  val mine =
                      getListings()
                          .filter {
                              it.isMine
                          }
                          .reversed()

                  showListingPage(
                      "My Listings",
                      mine,
                      true
                  )
              }

              private fun showListingPage(
                  pageTitle: String,
                  results: List<Listing>,
                  mineOnly: Boolean = false
              ) {

                  val scroll = ScrollView(this)
                  val root = baseLayout()

                  root.addView(
                      heading(pageTitle)
                  )

                  if (results.isEmpty()) {

  
