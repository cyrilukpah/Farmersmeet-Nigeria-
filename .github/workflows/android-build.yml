name: FarmersMeet Stage 10 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build FarmersMeet Stage 10
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Verify existing FarmersMeet project
        shell: bash
        run: |
          set -e

          test -f FarmersMeet/settings.gradle
          test -f FarmersMeet/build.gradle
          test -f FarmersMeet/app/build.gradle
          test -f FarmersMeet/app/src/main/AndroidManifest.xml
          test -f FarmersMeet/app/src/main/java/ng/farmersmeet/nigeria/MainActivity.kt

          echo "Existing FarmersMeet project verified."

      - name: Enable AndroidX
        shell: bash
        run: |
          set -e

          cat > FarmersMeet/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          echo "AndroidX enabled."

      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -e

          if [ -f "FarmersMeet/app/google-services.json" ]; then
            echo "Firebase configuration found in FarmersMeet/app."
          elif [ -f "Settings/google-services.json" ]; then
            echo "Firebase configuration found in Settings."
            cp Settings/google-services.json FarmersMeet/app/google-services.json
          elif [ -f "google-services.json" ]; then
            echo "Firebase configuration found at repository root."
            cp google-services.json FarmersMeet/app/google-services.json
          else
            echo "No google-services.json found."
            echo "Continuing because the existing Stage 10 Gradle project may already contain its Firebase configuration."
          fi

      - name: Verify AndroidX setting
        shell: bash
        run: |
          set -e

          grep -q '^android.useAndroidX=true$' FarmersMeet/gradle.properties

          echo "AndroidX verification PASSED."

      - name: Build Stage 10 APK
        working-directory: FarmersMeet
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          test -s FarmersMeet/app/build/outputs/apk/debug/app-debug.apk

          echo "FarmersMeet Stage 10 APK created successfully."

          ls -lh FarmersMeet/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FarmersMeet-Stage10-APK
          path: FarmersMeet/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
