      - name: Locate FarmersMeet Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository root:"
          pwd

          echo
          echo "Top-level files:"
          find . -maxdepth 2 -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "AndroidManifest.xml" \
            -o -name "MainActivity.kt" \) \
            -print | sort

          echo
          echo "Directories containing Gradle settings:"
          find . -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print | sort

          echo
          echo "Repository structure:"
          find . -maxdepth 3 -type d -print | sort
