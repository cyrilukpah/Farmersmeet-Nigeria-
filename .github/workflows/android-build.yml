name: FarmersMeet Stage 9 Publish

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build FarmersMeet Stage 9
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout Stage 9
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Prepare Stage 9 Gradle project
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " FARMERSMEET STAGE 9"
          echo " PUBLISH BUILD"
          echo "=========================================="

          echo
          echo "Repository:"
          pwd

          echo
          echo "Checking Stage 9 files..."

          test -f "settings.gradle"
          test -f "app/build.gradle"
          test -d "app/src/main"

          echo "settings.gradle found."
          echo "app/build.gradle found."
          echo "app/src/main found."

          echo
          echo "Restoring root Gradle configuration..."

          if [ -f "Settings/build.gradle" ]; then
            cp "Settings/build.gradle" "build.gradle"
            echo "Root build.gradle restored."
          else
            echo "ERROR: Settings/build.gradle not found."
            exit 1
          fi

          echo
          echo "Checking Firebase configuration..."

          if [ -s "app/google-services.json" ]; then
            echo "app/google-services.json already exists."
          elif [ -s "Settings/google-services.json" ]; then
            cp "Settings/google-services.json" \
              "app/google-services.json"

            echo "Firebase configuration restored from Settings/."
          elif [ -s "google-services.json" ]; then
            cp "google-services.json" \
              "app/google-services.json"

            echo "Firebase configuration found at repository root."
          else
            echo "WARNING: google-services.json not found."
            echo "Continuing with existing Stage 9 configuration."
          fi

          echo
          echo "Stage 9 project verification passed."

      - name: Enable AndroidX
        shell: bash
        run: |
          set -euo pipefail

          PROPERTIES_FILE="gradle.properties"

          touch "$PROPERTIES_FILE"

          if grep -q '^android.useAndroidX=' "$PROPERTIES_FILE"; then
            sed -i \
              's/^android.useAndroidX=.*/android.useAndroidX=true/' \
              "$PROPERTIES_FILE"
          else
            printf '\nandroid.useAndroidX=true\n' >> "$PROPERTIES_FILE"
          fi

          if grep -q '^android.nonTransitiveRClass=' "$PROPERTIES_FILE"; then
            sed -i \
              's/^android.nonTransitiveRClass=.*/android.nonTransitiveRClass=true/' \
              "$PROPERTIES_FILE"
          else
            printf 'android.nonTransitiveRClass=true\n' >> "$PROPERTIES_FILE"
          fi

          echo
          echo "AndroidX configuration ready."

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "./gradlew" ]; then
            chmod +x "./gradlew"
            echo "Existing Gradle wrapper found."
          else
            echo "No Gradle wrapper found."
            echo "Creating Gradle 8.10 wrapper."

            gradle wrapper \
              --gradle-version 8.10 \
              --distribution-type bin

            chmod +x "./gradlew"
          fi

          test -x "./gradlew"

          echo "Gradle wrapper ready."

      - name: Verify Stage 9 Gradle project
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Stage 9 Gradle tasks..."

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:tasks

          echo
          echo "Stage 9 Gradle verification PASSED."

      - name: Build Stage 9 release APK
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " BUILDING STAGE 9 RELEASE APK"
          echo "=========================================="

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleRelease

          echo
          echo "Stage 9 release APK build completed."

      - name: Build Stage 9 Android App Bundle
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " BUILDING STAGE 9 ANDROID APP BUNDLE"
          echo "=========================================="

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:bundleRelease

          echo
          echo "Stage 9 App Bundle build completed."

      - name: Locate Stage 9 release files
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " LOCATING STAGE 9 RELEASE FILES"
          echo "=========================================="

          APK="$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print \
            | sort \
            | head -n 1 || true)"

          AAB="$(find app/build/outputs/bundle \
            -type f \
            -name "*.aab" \
            -print \
            | sort \
            | head -n 1 || true)"

          if [ -z "$APK" ]; then
            echo "ERROR: Stage 9 release APK was not generated."

            find app/build \
              -type f \
              -name "*.apk" \
              -print 2>/dev/null || true

            exit 1
          fi

          if [ -z "$AAB" ]; then
            echo "ERROR: Stage 9 App Bundle was not generated."

            find app/build \
              -type f \
              -name "*.aab" \
              -print 2>/dev/null || true

            exit 1
          fi

          echo
          echo "STAGE 9 RELEASE APK:"
          echo "$APK"
          ls -lh "$APK"

          echo
          echo "STAGE 9 APP BUNDLE:"
          echo "$AAB"
          ls -lh "$AAB"

          echo
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "AAB_PATH=$AAB" >> "$GITHUB_ENV"

      - name: Upload Stage 9 release APK
        uses: actions/upload-artifact@v4
        with:
          name: FarmersMeet-Stage-9-Release-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload Stage 9 Google Play App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: FarmersMeet-Stage-9-Release-AAB
          path: ${{ env.AAB_PATH }}
          if-no-files-found: error
          retention-days: 30
