name: FarmersMeet Stage 10 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build FarmersMeet Stage 10
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare FarmersMeet source
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository contents:"
          find . -maxdepth 3 -type f | sort | head -200

          rm -rf FarmersMeet_V2

          unzip -q FarmersMeet_Nigeria_V2_Full_Source.zip

          test -d FarmersMeet_V2/android
          test -f FarmersMeet_V2/android/settings.gradle
          test -f FarmersMeet_V2/android/build.gradle
          test -f FarmersMeet_V2/android/app/build.gradle
          test -f FarmersMeet_V2/android/app/src/main/java/ng/farmersmeet/nigeria/MainActivity.kt

          echo
          echo "FarmersMeet source prepared:"
          find FarmersMeet_V2/android -maxdepth 5 -type f | sort

      - name: Configure Firebase
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p FarmersMeet_V2/android/app

          if [ -f "Settings/google-services.json" ]; then
            cp "Settings/google-services.json" \
              "FarmersMeet_V2/android/app/google-services.json"

          elif [ -f "google-services.json" ]; then
            cp "google-services.json" \
              "FarmersMeet_V2/android/app/google-services.json"

          else
            echo "ERROR: google-services.json was not found."
            echo
            echo "Expected one of:"
            echo "  Settings/google-services.json"
            echo "  google-services.json"
            exit 1
          fi

          test -s FarmersMeet_V2/android/app/google-services.json

          echo "Firebase configuration installed:"
          ls -lh FarmersMeet_V2/android/app/google-services.json

      - name: Configure Android Gradle project
        shell: bash
        run: |
          set -euo pipefail

          cd FarmersMeet_V2/android

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "FarmersMeetNigeria"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
              id 'com.google.gms.google-services' version '4.4.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
              id 'com.google.gms.google-services'
          }

          android {
              namespace 'ng.farmersmeet.nigeria'
              compileSdk 35

              defaultConfig {
                  applicationId 'ng.farmersmeet.nigeria'
                  minSdk 24
                  targetSdk 35
                  versionCode 10
                  versionName '10.0'
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }

                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.15.0'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
              implementation 'androidx.activity:activity-ktx:1.10.0'

              implementation platform('com.google.firebase:firebase-bom:34.19.0')
              implementation 'com.google.firebase:firebase-auth'
              implementation 'com.google.firebase:firebase-firestore'
              implementation 'com.google.firebase:firebase-storage'

              implementation 'com.paystack.android:paystack-ui:0.0.9'
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          echo
          echo "Final Android build files:"
          echo "----- settings.gradle -----"
          cat settings.gradle
          echo
          echo "----- build.gradle -----"
          cat build.gradle
          echo
          echo "----- app/build.gradle -----"
          cat app/build.gradle

      - name: Check Android SDK already available on runner
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=${ANDROID_HOME:-not-set}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-not-set}"

          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then
            echo
            echo "Android SDK found."

            echo
            echo "Available Android platforms:"
            ls -1 "$ANDROID_HOME/platforms" 2>/dev/null || true

            echo
            echo "Available build tools:"
            ls -1 "$ANDROID_HOME/build-tools" 2>/dev/null || true
          else
            echo "ERROR: Android SDK is not available on this GitHub runner."
            exit 1
          fi

      - name: Create Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd FarmersMeet_V2/android

          gradle wrapper \
            --gradle-version 8.7 \
            --distribution-type bin

          test -f gradlew
          chmod +x gradlew

          ./gradlew --version

      - name: Build Stage 10 debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd FarmersMeet_V2/android

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

      - name: Verify Stage 10 APK
        shell: bash
        run: |
          set -euo pipefail

          APK="FarmersMeet_V2/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Stage 10 APK was not produced."
            echo
            echo "APK directory contents:"
            find FarmersMeet_V2/android/app/build/outputs \
              -type f 2>/dev/null || true
            exit 1
          fi

          echo "Stage 10 APK successfully created:"
          ls -lh "$APK"

      - name: Upload FarmersMeet Stage 10 APK
        uses: actions/upload-artifact@v4
        with:
          name: FarmersMeet-Stage-10-APK
          path: FarmersMeet_V2/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
