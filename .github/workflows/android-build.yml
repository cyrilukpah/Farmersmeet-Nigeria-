name: FarmersMeet Stage 10 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build FarmersMeet Stage 10
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check Android SDK supplied by GitHub runner
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"

          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ERROR: ANDROID_HOME is not set."
            exit 1
          fi

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "ERROR: Android SDK directory does not exist:"
            echo "$ANDROID_HOME"
            exit 1
          fi

          echo
          echo "Android SDK:"
          ls -la "$ANDROID_HOME"

          echo
          echo "Android platforms:"
          ls -la "$ANDROID_HOME/platforms"

          echo
          echo "Android build tools:"
          ls -la "$ANDROID_HOME/build-tools"

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

          echo
          echo "Android SDK check PASSED."

      - name: Extract actual FarmersMeet source
        shell: bash
        run: |
          set -euo pipefail

          test -f FarmersMeet_Nigeria_V2_Full_Source.zip

          rm -rf FarmersMeet_V2

          unzip -q FarmersMeet_Nigeria_V2_Full_Source.zip

          echo "Checking actual project structure..."

          test -d FarmersMeet_V2/android
          test -f FarmersMeet_V2/android/settings.gradle
          test -f FarmersMeet_V2/android/build.gradle
          test -f FarmersMeet_V2/android/app/build.gradle
          test -f FarmersMeet_V2/android/app/src/main/AndroidManifest.xml
          test -f FarmersMeet_V2/android/app/src/main/java/ng/farmersmeet/nigeria/MainActivity.kt

          echo
          echo "Actual Android project:"
          find FarmersMeet_V2/android -maxdepth 6 -type f | sort

      - name: Install Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p FarmersMeet_V2/android/app

          if [ -f "Settings/google-services.json" ]; then
            cp "Settings/google-services.json" \
              "FarmersMeet_V2/android/app/google-services.json"
          elif [ -f "google-services.json" ]; then
            cp "google-services.json" \
              "FarmersMeet_V2/android/app/google-services.json"
          else
            echo "ERROR: google-services.json was not found."
            exit 1
          fi

          test -s FarmersMeet_V2/android/app/google-services.json

          echo
          echo "Firebase file installed:"
          ls -lh FarmersMeet_V2/android/app/google-services.json

      - name: Verify Firebase package name
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "FarmersMeet_V2/android/app/google-services.json"
          )

          data = json.loads(path.read_text())

          expected = "ng.farmersmeet.nigeria"

          clients = data.get("client", [])

          if not clients:
              raise SystemExit(
                  "ERROR: google-services.json has no client entries."
              )

          packages = []

          for client in clients:
              package_name = (
                  client
                  .get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name")
              )

              if package_name:
                  packages.append(package_name)

          print("Firebase Android package names:")
          for package_name in packages:
              print("  " + package_name)

          if expected not in packages:
              raise SystemExit(
                  "ERROR: Firebase package mismatch.\n"
                  f"Expected: {expected}\n"
                  f"Found: {packages}"
              )

          print("Firebase package check PASSED.")
          PY

      - name: Write clean Android Gradle configuration
        shell: bash
        run: |
          set -euo pipefail

          cd FarmersMeet_V2/android

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "FarmersMeetNigeria"

          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
              id 'com.google.gms.google-services' version '4.4.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
              id 'com.google.gms.google-services'
          }

          android {
              namespace 'ng.farmersmeet.nigeria'

              compileSdk 35

              defaultConfig {
                  applicationId 'ng.farmersmeet.nigeria'
                  minSdk 24
                  targetSdk 35
                  versionCode 10
                  versionName '10.0'
              }

              buildTypes {
                  debug {
                      debuggable true
                      minifyEnabled false
                  }

                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.15.0'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
              implementation 'androidx.activity:activity-ktx:1.10.0'

              implementation platform(
                  'com.google.firebase:firebase-bom:34.19.0'
              )

              implementation 'com.google.firebase:firebase-auth'
              implementation 'com.google.firebase:firebase-firestore'
              implementation 'com.google.firebase:firebase-storage'

              implementation 'com.paystack.android:paystack-ui:0.0.9'
          }
          EOF

          echo
          echo "Root Gradle file:"
          cat build.gradle

          echo
          echo "App Gradle file:"
          cat app/build.gradle

      - name: Create Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd FarmersMeet_V2/android

          gradle wrapper \
            --gradle-version 8.7 \
            --distribution-type bin

          test -f gradlew

          chmod +x gradlew

          echo
          echo "Gradle wrapper created."

          ./gradlew --version

      - name: Validate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          cd FarmersMeet_V2/android

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:tasks \
            --all

      - name: Build Stage 10 APK
        shell: bash
        run: |
          set -euo pipefail

          cd FarmersMeet_V2/android

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="FarmersMeet_V2/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
              echo "ERROR: APK was not generated."

              echo
              echo "Build output:"
              find FarmersMeet_V2/android/app/build \
                -type f 2>/dev/null | sort || true

              exit 1
          fi

          echo
          echo "=========================================="
          echo " FARMERSMEET STAGE 10 APK READY"
          echo "=========================================="
          ls -lh "$APK"

      - name: Upload Stage 10 APK
        uses: actions/upload-artifact@v4
        with:
          name: FarmersMeet-Stage-10-APK
          path: FarmersMeet_V2/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
