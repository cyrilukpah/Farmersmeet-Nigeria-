name: Build FarmersMeet APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Diagnose Gradle project
  run: |
    echo "=== PROJECT FILES ==="
    find . -maxdepth 3 -type f | sort
    echo "=== GRADLE PROJECTS ==="
    gradle projects
    echo "=== GRADLE TASKS ==="
    gradle tasks --all

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FarmersMeet-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
