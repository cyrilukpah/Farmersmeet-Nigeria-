name: FarmersMeet Stage 2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Create FarmersMeet app
        shell: bash
        run: |
          rm -rf FarmersMeet

          mkdir -p FarmersMeet/app/src/main/java/ng/farmersmeet/nigeria
          mkdir -p FarmersMeet/app/src/main/res/values

          cat > FarmersMeet/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "FarmersMeetNigeria"
          include(":app")
          EOF

          cat > FarmersMeet/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat > FarmersMeet/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > FarmersMeet/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'ng.farmersmeet.nigeria'
              compileSdk 35

              defaultConfig {
                  applicationId 'ng.farmersmeet.nigeria'
                  minSdk 24
                  targetSdk 35
                  versionCode 3
                  versionName "3.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.15.0'
              implementation 'androidx.appcompat:appcompat:1.7.0'
          }
          EOF

          cat > FarmersMeet/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/AppTheme"
                  android:label="FarmersMeet"
                  android:allowBackup="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > FarmersMeet/app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#176B35</item>
                  <item name="android:statusBarColor">#0D4D25</item>
                  <item name="android:navigationBarColor">#0D4D25</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > FarmersMeet/app/src/main/java/ng/farmersmeet/nigeria/MainActivity.kt <<'EOF'
          package ng.farmersmeet.nigeria

          import android.app.Activity
          import android.graphics.Color
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.*

          class MainActivity : Activity() {

              private val green = Color.rgb(23, 107, 53)
              private val darkGreen = Color.rgb(13, 77, 37)
              private val yellow = Color.rgb(244, 196, 48)
              private val backgroundColorValue = Color.rgb(247, 250, 245)
              private val textColor = Color.rgb(24, 53, 31)

              private val categories = arrayOf(
                  "Crops and Farm Produce",
                  "Pigs and Piglets",
                  "Fish and Aquaculture",
                  "Other Livestock",
                  "Poultry",
                  "Seeds and Seedlings",
                  "Farm Equipment"
              )

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  showHome()
              }

              private fun layout(): LinearLayout {
                  return LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(backgroundColorValue)
                      setPadding(24, 24, 24, 24)
                  }
              }

              private fun heading(value: String): TextView {
                  return TextView(this).apply {
                      text = value
                      textSize = 28f
                      setTextColor(green)
                      setTypeface(null, android.graphics.Typeface.BOLD)
                      setPadding(0, 12, 0, 18)
                  }
              }

              private fun button(
                  value: String,
                  yellowButton: Boolean = false
              ): Button {
                  return Button(this).apply {
                      text = value
                      textSize = 15f
                      setTypeface(null, android.graphics.Typeface.BOLD)
                      setTextColor(
                          if (yellowButton) textColor else Color.WHITE
                      )
                      setBackgroundColor(
                          if (yellowButton) yellow else green
                      )

                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply {
                          setMargins(0, 7, 0, 7)
                      }
                  }
              }

              private fun showHome() {
                  val root = layout()
                  root.gravity = Gravity.CENTER

                  val logo = heading("FarmersMeet")
                  logo.textSize = 40f
                  logo.gravity = Gravity.CENTER

                  val description = TextView(this).apply {
                      text = "Connecting farmers, buyers and agricultural businesses"
                      textSize = 16f
                      setTextColor(textColor)
                      gravity = Gravity.CENTER
                      setPadding(10, 0, 10, 25)
                  }

                  val enter = button("ENTER MARKETPLACE", true)

                  enter.setOnClickListener {
                      showMarketplace()
                  }

                  root.addView(logo)
                  root.addView(description)
                  root.addView(enter)

                  setContentView(root)
              }

              private fun showMarketplace() {
                  val scroll = ScrollView(this)
                  val root = layout()

                  root.addView(heading("FarmersMeet Marketplace"))

                  val description = TextView(this).apply {
                      text = "Buy and sell agricultural products"
                      textSize = 16f
                      setTextColor(textColor)
                      setPadding(0, 0, 0, 18)
                  }

                  root.addView(description)

                  categories.forEach { category ->
                      val categoryButton = button(category)

                      categoryButton.setOnClickListener {
                          showListings(category)
                      }

                      root.addView(categoryButton)
                  }

                  val sell = button("SELL AN ITEM", true)

                  sell.setOnClickListener {
                      showSell()
                  }

                  root.addView(sell)

                  scroll.addView(root)
                  setContentView(scroll)
              }

              private fun showListings(category: String) {
                  val scroll = ScrollView(this)
                  val root = layout()

                  root.addView(heading(category))

                  val message = TextView(this).apply {
                      text = "Listings for $category will appear here."
                      textSize = 18f
                      setTextColor(textColor)
                      setPadding(0, 20, 0, 30)
                  }

                  root.addView(message)

                  val sell = button("SELL IN THIS CATEGORY", true)

                  sell.setOnClickListener {
                      showSell()
                  }

                  root.addView(sell)

                  val back = button("BACK TO MARKETPLACE")

                  back.setOnClickListener {
                      showMarketplace()
                  }

                  root.addView(back)

                  scroll.addView(root)
                  setContentView(scroll)
              }

              private fun showSell() {
                  val scroll = ScrollView(this)
                  val root = layout()

                  root.addView(heading("Sell an Item"))

                  val category = Spinner(this)

                  category.adapter = ArrayAdapter(
                      this,
                      android.R.layout.simple_spinner_dropdown_item,
                      categories
                  )

                  root.addView(category)

                  val name = field("Product name")
                  val price = field("Price in Naira")
                  val quantity = field("Quantity")
                  val location = field("Location")
                  val seller = field("Seller name")
                  val description = field("Description")

                  root.addView(name)
                  root.addView(price)
                  root.addView(quantity)
                  root.addView(location)
                  root.addView(seller)
                  root.addView(description)

                  val post = button("POST LISTING", true)

                  post.setOnClickListener {
                      Toast.makeText(
                          this,
                          "Listing posted successfully!",
                          Toast.LENGTH_LONG
                      ).show()
                  }

                  root.addView(post)

                  val back = button("BACK TO MARKETPLACE")

                  back.setOnClickListener {
                      showMarketplace()
                  }

                  root.addView(back)

                  scroll.addView(root)
                  setContentView(scroll)
              }

              private fun field(hint: String): EditText {
                  return EditText(this).apply {
                      this.hint = hint
                      textSize = 16f
                      setTextColor(textColor)

                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply {
                          setMargins(0, 5, 0, 5)
                      }
                  }
              }
          }
          EOF

      - name: Build APK
        working-directory: FarmersMeet
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FarmersMeet-Stage2-APK
          path: FarmersMeet/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
