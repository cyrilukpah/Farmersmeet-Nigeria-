name: FarmersMeet Stage 3 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Create FarmersMeet Stage 3
        shell: bash
        run: |
          rm -rf FarmersMeet

          mkdir -p FarmersMeet/app/src/main/java/ng/farmersmeet/nigeria
          mkdir -p FarmersMeet/app/src/main/res/values

          cat > FarmersMeet/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "FarmersMeetNigeria"
          include(":app")
          EOF

          cat > FarmersMeet/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat > FarmersMeet/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > FarmersMeet/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'ng.farmersmeet.nigeria'
              compileSdk 35

              defaultConfig {
                  applicationId 'ng.farmersmeet.nigeria'
                  minSdk 24
                  targetSdk 35
                  versionCode 4
                  versionName "4.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.15.0'
              implementation 'androidx.appcompat:appcompat:1.7.0'
          }
          EOF

          cat > FarmersMeet/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/AppTheme"
                  android:label="FarmersMeet"
                  android:allowBackup="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > FarmersMeet/app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#176B35</item>
                  <item name="android:statusBarColor">#0D4D25</item>
                  <item name="android:navigationBarColor">#0D4D25</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > FarmersMeet
              }

              private fun showSell() {
                  val scroll = ScrollView(this)
                  val root = layout()

                  root.addView(heading("Sell an Item"))

                  val category = Spinner(this)

                  category.adapter = ArrayAdapter(
                      this,
                      android.R.layout.simple_spinner_dropdown_item,
                      categories
                  )

                  root.addView(category)

                  val name = field("Product name")
                  val price = field("Price in Naira")
                  val quantity = field("Quantity")
                  val location = field("Location")
                  val seller = field("Seller name")
                  val description = field("Description")

                  root.addView(name)
                  root.addView(price)
                  root.addView(quantity)
                  root.addView(location)
                  root.addView(seller)
                  root.addView(description)

                  val post = button("POST LISTING", true)

                  post.setOnClickListener {
                      Toast.makeText(
                          this,
                          "Listing posted successfully!",
                          Toast.LENGTH_LONG
                      ).show()
                  }

                  root.addView(post)

                  val back = button("BACK TO MARKETPLACE")

                  back.setOnClickListener {
                      showMarketplace()
                  }

                  root.addView(back)

                  scroll.addView(root)
                  setContentView(scroll)
              }

              private fun field(hint: String): EditText {
                  return EditText(this).apply {
                      this.hint = hint
                      textSize = 16f
                      setTextColor(textColor)

                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply {
                          setMargins(0, 5, 0, 5)
                      }
                  }
              }
          }
          EOF

      - name: Build APK
        working-directory: FarmersMeet
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FarmersMeet-Stage2-APK
          path: FarmersMeet/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
