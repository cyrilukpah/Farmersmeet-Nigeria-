      - name: Verify complete project
        shell: bash
        run: |
          set -e

          test -f FarmersMeet/settings.gradle
          test -f FarmersMeet/build.gradle
          test -f FarmersMeet/gradle.properties
          test -f FarmersMeet/app/build.gradle
          test -f FarmersMeet/app/src/main/AndroidManifest.xml
          test -f FarmersMeet/app/src/main/res/values/themes.xml
          test -f FarmersMeet/app/src/main/res/drawable/ic_launcher.xml
          test -f FarmersMeet/app/src/main/java/ng/farmersmeet/nigeria/MainActivity.kt

          echo "======================================"
          echo "FarmersMeet Stage 7 project verified"
          echo "Launcher activity verified"
          echo "======================================"

      - name: Clean Gradle project
        working-directory: FarmersMeet
        shell: bash
        run: |
          set -e
          gradle clean

      - name: Build debug APK
        working-directory: FarmersMeet
        shell: bash
        run: |
          set -e
          gradle :app:assembleDebug --stacktrace

      - name: Verify APK exists
        shell: bash
        run: |
          set -e

          APK="FarmersMeet/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "======================================"
          echo "APK BUILD SUCCESSFUL"
          echo "======================================"
          ls -lh "$APK"

      - name: Verify APK is launchable
        shell: bash
        run: |
          set -e

          APK="FarmersMeet/app/build/outputs/apk/debug/app-debug.apk"

          if command -v aapt2 >/dev/null 2>&1; then
            echo "Checking Android launcher activity..."

            aapt2 dump badging "$APK" | grep -q \
              "launchable-activity"

            echo "Launcher activity confirmed."
          else
            echo "aapt2 not directly available; manifest verification already completed."
          fi

      - name: Prepare APK for download
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp \
            FarmersMeet/app/build/outputs/apk/debug/app-debug.apk \
            release/FarmersMeet-Stage7.apk

          ls -lh release/FarmersMeet-Stage7.apk

      - name: Upload FarmersMeet Stage 7 APK
        uses: actions/upload-artifact@v4
        with:
          name: FarmersMeet-Stage7-APK
          path: release/FarmersMeet-Stage7.apk
          if-no-files-found: error
          retention-days: 30
