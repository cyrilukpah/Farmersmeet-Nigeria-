name: FarmersMeet Stage 7 Final APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build clean Stage 7 project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf FarmersMeet
          mkdir -p FarmersMeet/app/src/main/java/ng/farmersmeet/nigeria
          mkdir -p FarmersMeet/app/src/main/res/values
          mkdir -p FarmersMeet/app/src/main/res/drawable

          cat > FarmersMeet/settings.gradle <<'GRADLE'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'FarmersMeet'
          include ':app'
          GRADLE

          cat > FarmersMeet/build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          GRADLE

          cat > FarmersMeet/gradle.properties <<'PROPS'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m
          PROPS

          cat > FarmersMeet/app/build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'ng.farmersmeet.nigeria'
              compileSdk 35
              defaultConfig {
                  applicationId 'ng.farmersmeet.nigeria'
                  minSdk 24
                  targetSdk 35
                  versionCode 8
                  versionName '8.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.15.0'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.activity:activity-ktx:1.10.1'
          }
          GRADLE

          cat > FarmersMeet/app/src/main/res/values/themes.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#176B35</item>
                  <item name="android:statusBarColor">#0D4D25</item>
                  <item name="android:navigationBarColor">#0D4D25</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          XML

          cat > FarmersMeet/app/src/main/AndroidManifest.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:theme="@style/AppTheme" android:label="FarmersMeet" android:allowBackup="true" android:supportsRtl="true">
                  <activity android:name=".MainActivity" android:screenOrientation="portrait" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML

          cat > FarmersMeet/app/src/main/res/drawable/card_bg.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#FFFFFF" />
              <corners android:radius="16dp" />
              <stroke android:width="1dp" android:color="#DDE8DF" />
              <padding android:left="16dp" android:top="14dp" android:right="16dp" android:bottom="14dp" />
          </shape>
          XML

          cat > FarmersMeet/app/src/main/java/ng/farmersmeet/nigeria/MainActivity.kt <<'KOTLIN'
          package ng.farmersmeet.nigeria

          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.ArrayAdapter
          import android.widget.Button
          import android.widget.EditText
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.Spinner
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import org.json.JSONArray
          import org.json.JSONObject

          data class Listing(
              val id: Long, val name: String, val category: String, val price: String,
              val quantity: String, val location: String, val seller: String, val phone: String,
              val description: String, val photoUri: String, val isMine: Boolean
          )

          class MainActivity : AppCompatActivity() {
              private val green = Color.rgb(23,107,53)
              private val darkGreen = Color.rgb(13,77,37)
              private val gold = Color.rgb(244,196,48)
              private val bg = Color.rgb(247,250,245)
              private val textColor = Color.rgb(29,51,35)
              private val categories = arrayOf("Crops and Farm Produce","Pigs and Piglets","Fish and Aquaculture","Other Livestock","Poultry","Seeds and Seedlings","Farm Equipment")
              private var selectedPhotoUri: Uri? = null
              private var photoPreview: ImageView? = null

              private val picker = registerForActivityResult(ActivityResultContracts.OpenDocument()) { uri ->
                  if (uri != null) {
                      try { contentResolver.takePersistableUriPermission(uri, Intent.FLAG_GRANT_READ_URI_PERMISSION) } catch (_: Exception) {}
                      selectedPhotoUri = uri
                      photoPreview?.apply { setImageURI(uri); visibility = View.VISIBLE }
                  }
              }

              override fun onCreate(state: Bundle?) { super.onCreate(state); seedListings(); showHome() }

              private fun root(): LinearLayout = LinearLayout(this).apply {
                  orientation = LinearLayout.VERTICAL; setBackgroundColor(bg); setPadding(20,18,20,24)
              }

              private fun title(s: String, size: Float = 28f) = TextView(this).apply {
                  text=s; textSize=size; setTextColor(green); setTypeface(null,1); setPadding(0,10,0,14)
              }

              private fun button(s: String, primary: Boolean=false) = Button(this).apply {
                  text=s; textSize=15f; isAllCaps=false; isClickable=true; isFocusable=true
                  setTypeface(null,1); setTextColor(if(primary) text else Color.WHITE)
                  setBackgroundColor(if(primary) gold else green)
                  layoutParams=LinearLayout.LayoutParams(-1,-2).apply { setMargins(0,6,0,6) }
              }

              private fun body(s: String, size: Float=16f) = TextView(this).apply {
                  text=s; textSize=size; setTextColor(textColor); setPadding(0,3,0,10)
              }

              private fun showHome() {
                  val r=root().apply { gravity=Gravity.CENTER }
                  r.addView(title("FarmersMeet",40f).apply { gravity=Gravity.CENTER })
                  r.addView(body("Nigeria's agricultural marketplace",17f).apply { gravity=Gravity.CENTER })
                  r.addView(body("Buy • Sell • Connect with farmers",15f).apply { gravity=Gravity.CENTER; setPadding(0,0,0,25) })
                  r.addView(button("ENTER MARKETPLACE",true).apply { setOnClickListener { showMarketplace() } })
                  setContentView(r)
              }

              private fun showMarketplace() {
                  val scroll=ScrollView(this); val r=root()
                  r.addView(title("FarmersMeet Marketplace"))
                  r.addView(body("Buy and sell agricultural products across Nigeria."))
                  val search=EditText(this).apply { hint="Search pigs, fish, crops..."; setSingleLine(true); textSize=16f }
                  r.addView(search)
                  r.addView(button("SEARCH",true).apply { setOnClickListener { showSearchResults(search.text.toString().trim()) } })
                  r.addView(button("❤️ MY FAVORITES").apply { setOnClickListener { showFavorites() } })
                  r.addView(button("MY LISTINGS").apply { setOnClickListener { showMyListings() } })
                  r.addView(title("Browse Categories",21f))
                  categories.forEach { c -> r.addView(button(c).apply { setOnClickListener { showListings(c) } }) }
                  r.addView(button("SELL AN ITEM",true).apply { setOnClickListener { showSell() } })
                  scroll.addView(r); setContentView(scroll)
              }

              private fun showListings(category:String) = showListingPage(category,getListings().filter{it.category==category}.reversed())

              private fun showSearchResults(q:String) {
                  val x=q.lowercase(); val list=if(x.isEmpty()) getListings() else getListings().filter{ it.name.lowercase().contains(x)||it.category.lowercase().contains(x)||it.location.lowercase().contains(x)||it.seller.lowercase().contains(x) }
                  showListingPage(if(q.isEmpty()) "All Listings" else "Search: $q",list.reversed())
              }

              private fun showFavorites() = showListingPage("My Favorites",getListings().filter{isFavorite(it.id)}.reversed())
              private fun showMyListings() = showListingPage("My Listings",getListings().filter{it.isMine}.reversed(),true)

              private fun showListingPage(page:String, results:List<Listing>, mine:Boolean=false) {
                  val scroll=ScrollView(this); val r=root(); r.addView(title(page))
                  if(results.isEmpty()) r.addView(body(if(mine) "You have not posted any listings yet." else "No listings found.",18f))
                  else results.forEach{ addCard(r,it,mine) }
                  r.addView(button("SELL AN ITEM",true).apply{setOnClickListener{showSell()}})
                  r.addView(button("BACK TO MARKETPLACE").apply{setOnClickListener{showMarketplace()}})
                  scroll.addView(r); setContentView(scroll)
              }

              private fun addCard(r:LinearLayout,l:Listing,mine:Boolean) {
                  val card=LinearLayout(this).apply{orientation=LinearLayout.VERTICAL;setBackgroundResource(ng.farmersmeet.nigeria.R.drawable.card_bg);layoutParams=LinearLayout.LayoutParams(-1,-2).apply{setMargins(0,0,0,14)}}
                  if(l.photoUri.isNotEmpty()) try{ val im=ImageView(this).apply{layoutParams=LinearLayout.LayoutParams(-1,220);scaleType=ImageView.ScaleType.CENTER_CROP;setImageURI(Uri.parse(l.photoUri))};card.addView(im)}catch(_:Exception){}
                  card.addView(TextView(this).apply{text=l.name;textSize=20f;setTextColor(green);setTypeface(null,1)})
                  card.addView(TextView(this).apply{text=l.price;textSize=19f;setTextColor(darkGreen);setTypeface(null,1);setPadding(0,4,0,4)})
                  card.addView(body("Quantity: ${l.quantity}\nLocation: ${l.location}\nSeller: ${l.seller}",15f))
                  card.addView(button(if(isFavorite(l.id)) "❤️ REMOVE FAVORITE" else "♡ SAVE FAVORITE").apply{setOnClickListener{toggleFavorite(l.id);text=if(isFavorite(l.id))"❤️ REMOVE FAVORITE" else "♡ SAVE FAVORITE"}})
                  card.addView(button("VIEW DETAILS").apply{setOnClickListener{showDetails(l)}})
                  if(mine&&l.isMine) card.addView(button("DELETE LISTING").apply{setOnClickListener{deleteListing(l.id);showMyListings()}})
                  r.addView(card)
              }

              private fun showDetails(l:Listing) {
                  val scroll=ScrollView(this); val r=root(); r.addView(title(l.name))
                  if(l.photoUri.isNotEmpty()) try{r.addView(ImageView(this).apply{layoutParams=LinearLayout.LayoutParams(-1,280);scaleType=ImageView.ScaleType.CENTER_CROP;setImageURI(Uri.parse(l.photoUri))})}catch(_:Exception){}
                  r.addView(body("PRICE\n${l.price}\n\nCATEGORY\n${l.category}\n\nQUANTITY\n${l.quantity}\n\nLOCATION\n${l.location}\n\nSELLER\n${l.seller}\n\nPHONE\n${l.phone}\n\nDESCRIPTION\n${if(l.description.isEmpty())"No description provided." else l.description}",17f))
                  r.addView(button(if(isFavorite(l.id))"❤️ REMOVE FAVORITE" else "♡ SAVE FAVORITE").apply{setOnClickListener{toggleFavorite(l.id);text=if(isFavorite(l.id))"❤️ REMOVE FAVORITE" else "♡ SAVE FAVORITE"}})
                  r.addView(button("CALL SELLER",true).apply{setOnClickListener{if(l.phone.isEmpty())toast("No phone number provided.") else startActivity(Intent(Intent.ACTION_DIAL,Uri.parse("tel:${l.phone}")))}})
                  r.addView(button("WHATSAPP SELLER").apply{setOnClickListener{if(l.phone.isEmpty())toast("No phone number provided.") else {val p=l.phone.replace("+","").replace(" ","");startActivity(Intent(Intent.ACTION_VIEW,Uri.parse("https://wa.me/$p?text=${Uri.encode("Hello, I saw your ${l.name} listing on FarmersMeet.")}")))}}})
                  if(l.isMine) r.addView(button("DELETE LISTING").apply{setOnClickListener{deleteListing(l.id);showMyListings()}})
                  r.addView(button("BACK TO LISTINGS").apply{setOnClickListener{showListings(l.category)}})
                  r.addView(button("MARKETPLACE",true).apply{setOnClickListener{showMarketplace()}})
                  scroll.addView(r);setContentView(scroll)
              }

              private fun showSell() {
                  selectedPhotoUri=null;photoPreview=null;val scroll=ScrollView(this);val r=root();r.addView(title("Sell an Item"))
                  val spinner=Spinner(this);spinner.adapter=ArrayAdapter(this,android.R.layout.simple_spinner_dropdown_item,categories);r.addView(spinner)
                  r.addView(title("Product Photo",19f)); val im=ImageView(this).apply{layoutParams=LinearLayout.LayoutParams(-1,220);setBackgroundColor(Color.LTGRAY);visibility=View.GONE;scaleType=ImageView.ScaleType.CENTER_CROP};photoPreview=im;r.addView(im)
                  r.addView(button("CHOOSE PHOTO",true).apply{setOnClickListener{picker.launch(arrayOf("image/*"))}})
                  val name=field("Product name");val price=field("Price in Naira");val qty=field("Quantity");val loc=field("Location");val seller=field("Seller name");val phone=field("Phone number");val desc=field("Description").apply{minLines=4;gravity=Gravity.TOP}
                  listOf(name,price,qty,loc,seller,phone,desc).forEach{r.addView(it)}
                  r.addView(button("POST LISTING",true).apply{setOnClickListener{if(listOf(name,price,qty,loc,seller,phone).any{it.text.toString().trim().isEmpty()}){toast("Please complete the required fields.");return@setOnClickListener};val l=Listing(System.currentTimeMillis(),name.text.toString().trim(),spinner.selectedItem.toString(),"₦${price.text.toString().trim()}",qty.text.toString().trim(),loc.text.toString().trim(),seller.text.toString().trim(),phone.text.toString().trim(),desc.text.toString().trim(),selectedPhotoUri?.toString()? :"",true);saveListing(l);toast("Listing posted successfully!");showListings(l.category)}})
                  r.addView(button("BACK TO MARKETPLACE").apply{setOnClickListener{showMarketplace()}});scroll.addView(r);setContentView(scroll)
              }

              private fun field(h:String)=EditText(this).apply{hint=h;textSize=16f;setTextColor(textColor);layoutParams=LinearLayout.LayoutParams(-1,-2).apply{setMargins(0,4,0,4)}}
              private fun toast(s:String)=Toast.makeText(this,s,Toast.LENGTH_SHORT).show()

              private fun prefs()=getSharedPreferences("farmersmeet",Context.MODE_PRIVATE)
              private fun saveListing(l:Listing){val a=JSONArray(prefs().getString("listings","[]")!!);a.put(JSONObject().apply{put("id",l.id);put("name",l.name);put("category",l.category);put("price",l.price);put("quantity",l.quantity);put("location",l.location);put("seller",l.seller);put("phone",l.phone);put("description",l.description);put("photoUri",l.photoUri);put("isMine",l.isMine)});prefs().edit().putString("listings",a.toString()).apply()}
              private fun getListings():List<Listing>{val a=JSONArray(prefs().getString("listings","[]")!!);return List(a.length()){i->val x=a.getJSONObject(i);Listing(x.optLong("id",i.toLong()),x.optString("name"),x.optString("category"),x.optString("price"),x.optString("quantity"),x.optString("location"),x.optString("seller"),x.optString("phone"),x.optString("description"),x.optString("photoUri"),x.optBoolean("isMine",false))}}
              private fun isFavorite(id:Long)=prefs().getStringSet("favorites",emptySet())!!.contains(id.toString())
              private fun toggleFavorite(id:Long){val s=prefs().getStringSet("favorites",emptySet())!!.toMutableSet();if(!s.add(id.toString()))s.remove(id.toString());prefs().edit().putStringSet("favorites",s).apply()}
              private fun deleteListing(id:Long){val old=getListings().filter{it.id!=id};val a=JSONArray();old.forEach{saveJson(a,it)};prefs().edit().putString("listings",a.toString()).apply()}
              private fun saveJson(a:JSONArray,l:Listing){a.put(JSONObject().apply{put("id",l.id);put("name",l.name);put("category",l.category);put("price",l.price);put("quantity",l.quantity);put("location",l.location);put("seller",l.seller);put("phone",l.phone);put("description",l.description);put("photoUri",l.photoUri);put("isMine",l.isMine)})}

              private fun seedListings(){if(prefs().getBoolean("seeded",false))return;listOf(
                  Listing(1001,"Healthy Large Pig","Pigs and Piglets","₦250,000","1 pig","Aba, Abia State","John's Pig Farm","08000000000","Healthy mature pig suitable for breeding.","",false),
                  Listing(1002,"Weaner Piglets","Pigs and Piglets","₦85,000","2 piglets","Umuahia, Abia State","Green Valley Farm","08000000001","Healthy weaner piglets.","",false),
                  Listing(1003,"Fresh Catfish","Fish and Aquaculture","₦2,500","10 kg","Abakaliki, Ebonyi State","Ebonyi Fish Farm","08000000002","Fresh farm-raised catfish.","",false),
                  Listing(1004,"Catfish Fingerlings","Fish and Aquaculture","₦25,000","1,000 fingerlings","Umuahia, Abia State","AquaGrow Nigeria","08000000003","Healthy catfish fingerlings.","",false),
                  Listing(1005,"Dried Maize","Crops and Farm Produce","₦65,000","100 kg","Abakaliki, Ebonyi State","Agro Best Farm","08000000004","Clean dried maize.","",false),
                  Listing(1006,"Broiler Chickens","Poultry","₦12,000","10 birds","Umuahia, Abia State","Sunrise Poultry","08000000005","Healthy broiler chickens.","",false),
                  Listing(1007,"Healthy Goats","Other Livestock","₦120,000","2 goats","Abakaliki, Ebonyi State","Ebony Livestock Farm","08000000006","Healthy goats for sale.","",false),
                  Listing(1008,"Hybrid Maize Seeds","Seeds and Seedlings","₦18,000","5 kg","Aba, Abia State","Farm Input Centre","08000000007","Quality hybrid maize seeds.","",false),
                  Listing(1009,"Knapsack Sprayer","Farm Equipment","₦45,000","1 unit","Aba, Abia State","Agro Tools Nigeria","08000000008","Farm spraying equipment.","",false)
              ).forEach{saveListing(it)};prefs().edit().putBoolean("seeded",true).apply()}
          }
          KOTLIN

          # Correct the nullable-expression typo safely before building.
          sed -i 's/selectedPhotoUri?.toString()? :""/selectedPhotoUri?.toString() ?: ""/' FarmersMeet/app/src/main/java/ng/farmersmeet/nigeria/MainActivity.kt

      - name: Build APK
        working-directory: FarmersMeet
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -s FarmersMeet/app/build/outputs/apk/debug/app-debug.apk
          ls -lh FarmersMeet/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FarmersMeet-Stage7-Final-APK
          path: FarmersMeet/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
