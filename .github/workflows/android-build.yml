name: FarmersMeet Stage 10 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build FarmersMeet Stage 10
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Prepare FarmersMeet Stage 9 project
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " FARMERSMEET STAGE 10"
          echo " PRESERVING STAGE 9 PROJECT"
          echo "=========================================="

          echo
          echo "Repository:"
          pwd

          echo
          echo "Checking Stage 9 project files..."

          test -f "settings.gradle"
          test -f "app/build.gradle"
          test -d "app/src/main"

          echo "settings.gradle found."
          echo "app/build.gradle found."
          echo "app/src/main found."

          echo
          echo "Restoring root Gradle plugin configuration..."

          if [ -f "Settings/build.gradle" ]; then
            cp "Settings/build.gradle" "build.gradle"
            echo "Root build.gradle restored from Settings/build.gradle."
          else
            echo "ERROR: Settings/build.gradle is missing."
            exit 1
          fi

          echo
          echo "Checking Firebase configuration..."

          if [ -s "app/google-services.json" ]; then
            echo "app/google-services.json already exists."
          elif [ -s "Settings/google-services.json" ]; then
            cp "Settings/google-services.json" "app/google-services.json"
            echo "Firebase configuration restored from Settings/."
          elif [ -s "google-services.json" ]; then
            cp "google-services.json" "app/google-services.json"
            echo "Firebase configuration found at repository root."
          else
            echo "WARNING: google-services.json was not found."
            echo "Continuing with the existing project."
          fi

          echo
          echo "=========================================="
          echo " PROJECT VERIFICATION"
          echo "=========================================="

          test -f "settings.gradle"
          test -f "build.gradle"
          test -f "app/build.gradle"
          test -d "app/src/main"

          echo
          echo "Stage 9 project structure is ready."

      - name: Enable AndroidX
        shell: bash
        run: |
          set -euo pipefail

          PROPERTIES_FILE="gradle.properties"

          touch "$PROPERTIES_FILE"

          if grep -q '^android.useAndroidX=' "$PROPERTIES_FILE"; then
            sed -i \
              's/^android.useAndroidX=.*/android.useAndroidX=true/' \
              "$PROPERTIES_FILE"
          else
            printf '\nandroid.useAndroidX=true\n' >> "$PROPERTIES_FILE"
          fi

          if grep -q '^android.nonTransitiveRClass=' "$PROPERTIES_FILE"; then
            sed -i \
              's/^android.nonTransitiveRClass=.*/android.nonTransitiveRClass=true/' \
              "$PROPERTIES_FILE"
          else
            printf 'android.nonTransitiveRClass=true\n' >> "$PROPERTIES_FILE"
          fi

          echo
          echo "Gradle properties:"
          cat "$PROPERTIES_FILE"

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "./gradlew" ]; then
            chmod +x "./gradlew"
            echo "Existing Gradle wrapper found."
          else
            echo "No Gradle wrapper found."
            echo "Creating Gradle 8.10 wrapper..."

            gradle wrapper \
              --gradle-version 8.10 \
              --distribution-type bin

            chmod +x "./gradlew"
          fi

          test -x "./gradlew"

          echo
          echo "Gradle wrapper ready."

      - name: Verify Gradle project
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking FarmersMeet Gradle project..."

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:tasks

          echo
          echo "Gradle project verification PASSED."

      - name: Build FarmersMeet Stage 10 APK
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " BUILDING FARMERSMEET STAGE 10 APK"
          echo "=========================================="

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

          echo
          echo "Gradle APK build completed."

      - name: Locate generated APK
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for generated APK..."

          APK="$(find "app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print \
            | sort \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo
            echo "ERROR: No APK was generated."

            echo
            echo "APK output directory:"
            find "app/build" \
              -maxdepth 8 \
              -type f \
              -name "*.apk" \
              -print 2>/dev/null || true

            exit 1
          fi

          echo
          echo "=========================================="
          echo " FARMERSMEET STAGE 10 APK READY"
          echo "=========================================="
          echo
          echo "APK:"
          echo "$APK"
          echo

          ls -lh "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload FarmersMeet Stage 10 APK
        uses: actions/upload-artifact@v4
        with:
          name: FarmersMeet-Stage-10-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30
