name: FarmersMeet Stage 10 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build FarmersMeet Stage 10
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Show repository structure
        shell: bash
        run: |
          set -e

          echo "===== REPOSITORY ROOT ====="
          find . -maxdepth 2 -type f | sort

          echo
          echo "===== ANDROID SDK ====="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo
          echo "===== INSTALLED PLATFORM ====="
          test -d "$ANDROID_HOME/platforms/android-35"

          echo
          echo "===== INSTALLED BUILD TOOLS ====="
          test -d "$ANDROID_HOME/build-tools/35.0.0"

          echo
          echo "Android SDK 35 is ready."

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo "Checking Android project at repository root..."

          test -f settings.gradle
          test -d app
          test -f app/build.gradle

          echo "settings.gradle found."
          echo "app/ directory found."
          echo "app/build.gradle found."

      - name: Prepare Firebase configuration
        shell: bash
        run: |
          set -e

          echo "Checking Firebase configuration..."

          if [ -f "google-services.json" ]; then
            echo "Root google-services.json found."

          elif [ -f "Settings/google-services.json" ]; then
            echo "Found Settings/google-services.json."
            cp "Settings/google-services.json" "google-services.json"

          else
            echo "ERROR: google-services.json was not found."
            echo
            echo "Expected one of:"
            echo "  ./google-services.json"
            echo "  ./Settings/google-services.json"
            exit 1
          fi

          cp "google-services.json" "app/google-services.json"

          echo
          echo "Firebase configuration copied to:"
          echo "  ./google-services.json"
          echo "  ./app/google-services.json"

      - name: Prepare root Gradle build file
        shell: bash
        run: |
          set -e

          if [ -f "build.gradle" ]; then
            echo "Root build.gradle already exists."

          elif [ -f "app-build.gradle" ]; then
            echo "Root build.gradle is missing."
            echo "Using existing app-build.gradle as root build.gradle."
            cp "app-build.gradle" "build.gradle"

          else
            echo "ERROR: No root build.gradle or app-build.gradle found."
            exit 1
          fi

          echo
          echo "===== ROOT BUILD.GRADLE ====="
          cat build.gradle

      - name: Check Gradle project files
        shell: bash
        run: |
          set -e

          echo "===== settings.gradle ====="
          cat settings.gradle

          echo
          echo "===== app/build.gradle ====="
          cat app/build.gradle

          echo
          echo "===== Firebase file ====="
          test -s app/google-services.json
          echo "Firebase configuration exists."

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify Gradle
        shell: bash
        run: |
          set -e

          gradle --version

      - name: Create Gradle wrapper
        shell: bash
        run: |
          set -e

          if [ -f "gradlew" ]; then
            echo "Gradle wrapper already exists."

          else
            echo "Creating Gradle 8.9 wrapper..."
            gradle wrapper \
              --gradle-version 8.9 \
              --distribution-type bin
          fi

          chmod +x gradlew

          echo
          echo "Gradle wrapper ready."

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -e

          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.properties

          ./gradlew --version

      - name: Clean previous build
        shell: bash
        run: |
          set -e

          ./gradlew --no-daemon clean

      - name: Build Stage 10 debug APK
        shell: bash
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Verify Stage 10 APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          echo "Checking APK:"
          echo "$APK"

          test -f "$APK"

          echo
          echo "===== APK CREATED SUCCESSFULLY ====="
          ls -lh "$APK"

      - name: Upload Stage 10 APK
        uses: actions/upload-artifact@v4
        with:
          name: FarmersMeet-Stage-10-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
