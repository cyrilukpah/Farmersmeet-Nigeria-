name: FarmersMeet Stage 10 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build FarmersMeet Stage 10
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Prepare FarmersMeet project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf FarmersMeet

          mkdir -p FarmersMeet

          if [ -f "FarmersMeet_Nigeria_V2_Full_Source.zip" ]; then

            unzip -q "FarmersMeet_Nigeria_V2_Full_Source.zip" \
              -d FarmersMeet/extracted

            if [ -d "FarmersMeet/extracted/FarmersMeet_V2/android" ]; then
              cp -a FarmersMeet/extracted/FarmersMeet_V2/android/. \
                FarmersMeet/

            elif [ -d "FarmersMeet/extracted/android" ]; then
              cp -a FarmersMeet/extracted/android/. \
                FarmersMeet/

            else
              echo "ERROR: Android project was not found in source archive."
              echo
              echo "Archive contents:"
              find FarmersMeet/extracted -maxdepth 4 -type f | sort
              exit 1
            fi

          elif [ -f "FarmersMeet/settings.gradle" ]; then

            echo "Existing FarmersMeet project found."

          else

            echo "ERROR: FarmersMeet source was not found."
            exit 1

          fi

          test -f FarmersMeet/settings.gradle
          test -f FarmersMeet/build.gradle
          test -f FarmersMeet/app/build.gradle
          test -f FarmersMeet/app/src/main/AndroidManifest.xml
          test -f FarmersMeet/app/src/main/java/ng/farmersmeet/nigeria/MainActivity.kt

          echo "FarmersMeet project verified."

      - name: Install Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "Settings/google-services.json" ]; then

            cp "Settings/google-services.json" \
              FarmersMeet/app/google-services.json

          elif [ -f "google-services.json" ]; then

            cp "google-services.json" \
              FarmersMeet/app/google-services.json

          elif [ -f "FarmersMeet/app/google-services.json" ]; then

            echo "Firebase configuration already exists."

          else

            echo "ERROR: google-services.json was not found."
            exit 1

          fi

          test -s FarmersMeet/app/google-services.json

          echo "Firebase configuration installed."

      - name: Configure Firebase Gradle plugin
        shell: bash
        run: |
          set -euo pipefail

          cat > FarmersMeet/settings.gradle <<'GRADLE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'FarmersMeet'

          include ':app'
          GRADLE

          cat > FarmersMeet/build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
              id 'com.google.gms.google-services' version '4.4.2' apply false
          }
          GRADLE

          python3 - <<'PY'
          from pathlib import Path

          path = Path("FarmersMeet/app/build.gradle")
          text = path.read_text()

          if "com.google.gms.google-services" not in text:

              marker = "id 'org.jetbrains.kotlin.android'"

              if marker in text:
                  text = text.replace(
                      marker,
                      marker + "\n    id 'com.google.gms.google-services'",
                      1
                  )
              else:
                  text = (
                      "plugins {\n"
                      "    id 'com.android.application'\n"
                      "    id 'org.jetbrains.kotlin.android'\n"
                      "    id 'com.google.gms.google-services'\n"
                      "}\n\n"
                      + text
                  )

          path.write_text(text)
          PY

          echo "Firebase Gradle plugin configured."

      - name: Configure Firebase dependencies
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("FarmersMeet/app/build.gradle")
          text = path.read_text()

          if "com.google.firebase:firebase-bom" not in text:

              text += """

          dependencies {
              implementation platform('com.google.firebase:firebase-bom:34.3.0')
              implementation 'com.google.firebase:firebase-auth'
              implementation 'com.google.firebase:firebase-firestore'
              implementation 'com.google.firebase:firebase-storage'
          }
          """

          path.write_text(text)
          PY

          echo "Firebase dependencies configured."

      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          grep -q "com.google.gms.google-services" \
            FarmersMeet/build.gradle

          grep -q "com.google.gms.google-services" \
            FarmersMeet/app/build.gradle

          grep -q "firebase-auth" \
            FarmersMeet/app/build.gradle

          grep -q "firebase-firestore" \
            FarmersMeet/app/build.gradle

          grep -q "firebase-storage" \
            FarmersMeet/app/build.gradle

          python3 - <<'PY'
          import json

          path = "FarmersMeet/app/google-services.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          expected = "ng.farmersmeet.nigeria"

          found = []

          for client in data.get("client", []):
              package_name = (
                  client
                  .get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name")
              )

              if package_name:
                  found.append(package_name)

          print("Firebase packages:", found)

          if expected not in found:
              raise SystemExit(
                  f"ERROR: Firebase package mismatch. "
                  f"Expected {expected}, found {found}"
              )

          print("Firebase configuration verified.")
          PY

      - name: Build Stage 10 APK
        working-directory: FarmersMeet
        shell: bash
        run: |
          set -euo pipefail

          gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="FarmersMeet/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo
          echo "=========================================="
          echo " FARMERSMEET STAGE 10 APK CREATED"
          echo "=========================================="
          echo

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FarmersMeet-Stage10-APK
          path: FarmersMeet/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
