name: FarmersMeet Stage 10 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build FarmersMeet Stage 10
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Find Android Gradle project
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " FARMERSMEET STAGE 10"
          echo " LOCATING ANDROID PROJECT"
          echo "=========================================="
          echo

          echo "Repository root:"
          pwd
          echo

          echo "Top-level contents:"
          find . -maxdepth 2 -type f | sort | head -200
          echo

          PROJECT_ROOT=""

          while IFS= read -r SETTINGS; do
            ROOT="$(dirname "$SETTINGS")"

            echo "Checking Gradle settings:"
            echo "  $SETTINGS"

            if [ -f "$ROOT/app/build.gradle" ] || \
               [ -f "$ROOT/app/build.gradle.kts" ]; then

              if [ -d "$ROOT/app/src/main" ]; then
                PROJECT_ROOT="$ROOT"
                echo "Android project candidate accepted:"
                echo "  $PROJECT_ROOT"
                break
              fi
            fi
          done < <(
            find . \
              -type f \
              \( \
                -name "settings.gradle" \
                -o -name "settings.gradle.kts" \
              \) \
              -not -path "*/.gradle/*" \
              -not -path "*/build/*" \
              -print | sort
          )

          if [ -z "$PROJECT_ROOT" ]; then
            echo
            echo "ERROR: No Android Gradle project was found."
            echo
            echo "All Gradle settings files:"
            find . \
              -type f \
              \( \
                -name "settings.gradle" \
                -o -name "settings.gradle.kts" \
              \) \
              -not -path "*/.gradle/*" \
              -not -path "*/build/*" \
              -print | sort || true

            echo
            echo "All Android app Gradle files:"
            find . \
              -type f \
              \( \
                -path "*/app/build.gradle" \
                -o -path "*/app/build.gradle.kts" \
              \) \
              -not -path "*/.gradle/*" \
              -not -path "*/build/*" \
              -print | sort || true

            exit 1
          fi

          PROJECT_ROOT="${PROJECT_ROOT#./}"

          echo
          echo "=========================================="
          echo " ANDROID PROJECT FOUND"
          echo "=========================================="
          echo "$PROJECT_ROOT"

          printf '%s\n' "$PROJECT_ROOT" \
            > "$GITHUB_WORKSPACE/.farmersmeet_project_root"

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT="$(cat "$GITHUB_WORKSPACE/.farmersmeet_project_root")"

          echo "Using Android project:"
          echo "$PROJECT_ROOT"
          echo

          if [ -f "$PROJECT_ROOT/settings.gradle" ]; then
            echo "Found settings.gradle"
          elif [ -f "$PROJECT_ROOT/settings.gradle.kts" ]; then
            echo "Found settings.gradle.kts"
          else
            echo "ERROR: Gradle settings file missing."
            exit 1
          fi

          if [ -f "$PROJECT_ROOT/build.gradle" ]; then
            echo "Found build.gradle"
          elif [ -f "$PROJECT_ROOT/build.gradle.kts" ]; then
            echo "Found build.gradle.kts"
          else
            echo "ERROR: Root Gradle build file missing."
            exit 1
          fi

          if [ -f "$PROJECT_ROOT/app/build.gradle" ]; then
            echo "Found app/build.gradle"
          elif [ -f "$PROJECT_ROOT/app/build.gradle.kts" ]; then
            echo "Found app/build.gradle.kts"
          else
            echo "ERROR: app Gradle build file missing."
            exit 1
          fi

          if [ ! -d "$PROJECT_ROOT/app/src/main" ]; then
            echo "ERROR: app/src/main is missing."
            exit 1
          fi

          echo
          echo "PROJECT VERIFICATION PASSED."

      - name: Enable AndroidX
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT="$(cat "$GITHUB_WORKSPACE/.farmersmeet_project_root")"

          PROPERTIES="$PROJECT_ROOT/gradle.properties"

          touch "$PROPERTIES"

          if grep -q '^android.useAndroidX=' "$PROPERTIES"; then
            sed -i \
              's/^android.useAndroidX=.*/android.useAndroidX=true/' \
              "$PROPERTIES"
          else
            printf '%s\n' \
              'android.useAndroidX=true' \
              >> "$PROPERTIES"
          fi

          if grep -q '^android.nonTransitiveRClass=' "$PROPERTIES"; then
            sed -i \
              's/^android.nonTransitiveRClass=.*/android.nonTransitiveRClass=true/' \
              "$PROPERTIES"
          else
            printf '%s\n' \
              'android.nonTransitiveRClass=true' \
              >> "$PROPERTIES"
          fi

          echo
          echo "Gradle properties:"
          cat "$PROPERTIES"

      - name: Prepare Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT="$(cat "$GITHUB_WORKSPACE/.farmersmeet_project_root")"

          TARGET="$PROJECT_ROOT/app/google-services.json"

          if [ -s "$TARGET" ]; then
            echo "Firebase configuration already exists."
            exit 0
          fi

          if [ -s "$GITHUB_WORKSPACE/Settings/google-services.json" ]; then
            cp \
              "$GITHUB_WORKSPACE/Settings/google-services.json" \
              "$TARGET"

            echo "Firebase configuration copied from Settings/."
            exit 0
          fi

          if [ -s "$GITHUB_WORKSPACE/google-services.json" ]; then
            cp \
              "$GITHUB_WORKSPACE/google-services.json" \
              "$TARGET"

            echo "Firebase configuration copied from repository root."
            exit 0
          fi

          echo "No additional Firebase configuration found."
          echo "Using the configuration already present in the project, if any."

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT="$(cat "$GITHUB_WORKSPACE/.farmersmeet_project_root")"

          cd "$PROJECT_ROOT"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Existing Gradle wrapper found."
          else
            echo "No Gradle wrapper found."
            echo "Creating Gradle 8.10 wrapper."

            gradle wrapper \
              --gradle-version 8.10 \
              --distribution-type bin

            chmod +x ./gradlew
          fi

          test -x ./gradlew

          echo "Gradle wrapper ready."

      - name: Inspect Gradle project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT="$(cat "$GITHUB_WORKSPACE/.farmersmeet_project_root")"

          cd "$PROJECT_ROOT"

          echo "Gradle version:"
          ./gradlew --version

          echo
          echo "Available app tasks:"
          ./gradlew \
            --no-daemon \
            :app:tasks \
            --all

      - name: Build Stage 10 debug APK
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT="$(cat "$GITHUB_WORKSPACE/.farmersmeet_project_root")"

          cd "$PROJECT_ROOT"

          echo "Building FarmersMeet Stage 10..."

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            :app:assembleDebug

      - name: Find generated APK
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT="$(cat "$GITHUB_WORKSPACE/.farmersmeet_project_root")"

          echo "Searching for generated APK..."

          APK="$(find "$PROJECT_ROOT/app/build" \
            -type f \
            -name "*.apk" \
            -print \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo
            echo "ERROR: No APK was generated."

            echo
            echo "Build directory:"
            find "$PROJECT_ROOT/app/build" \
              -maxdepth 6 \
              -type f \
              -print 2>/dev/null || true

            exit 1
          fi

          echo
          echo "=========================================="
          echo " FARMERSMEET STAGE 10 APK SUCCESS"
          echo "=========================================="
          echo
          echo "APK:"
          echo "$APK"
          echo

          ls -lh "$APK"

          printf 'APK_PATH=%s\n' "$APK" >> "$GITHUB_ENV"

      - name: Upload Stage 10 APK
        uses: actions/upload-artifact@v4
        with:
          name: FarmersMeet-Stage-10-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30
