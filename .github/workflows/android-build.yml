name: Build FarmersMeet APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create clean FarmersMeet project
        run: |
          rm -rf FarmersMeet
          mkdir -p FarmersMeet/app/src/main/java/ng/farmersmeet/nigeria
          mkdir -p FarmersMeet/app/src/main/res/layout
          mkdir -p FarmersMeet/app/src/main/res/values
          mkdir -p FarmersMeet/app/src/main/res/drawable

          cat > FarmersMeet/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "FarmersMeetNigeria"
          include(":app")
          EOF

          cat > FarmersMeet/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat > FarmersMeet/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > FarmersMeet/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'ng.farmersmeet.nigeria'
              compileSdk 35

              defaultConfig {
                  applicationId 'ng.farmersmeet.nigeria'
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName '2.1'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.15.0'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.activity:activity-ktx:1.10.0'
              implementation 'com.google.android.material:material:1.12.0'
          }
          EOF

          cat > FarmersMeet/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/AppTheme"
                  android:label="FarmersMeet">

                  <activity
                      android:name=".ProductActivity"
                      android:exported="false" />

                  <activity
                      android:name=".ListingsActivity"
                      android:exported="false" />

                  <activity
                      android:name=".SellActivity"
                      android:exported="false" />

                  <activity
                      android:name=".MarketplaceActivity"
                      android:exported="false" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > FarmersMeet/app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="farm_green">#176B35</color>
              <color name="farm_dark_green">#0D4D25</color>
              <color name="farm_yellow">#F4C430</color>
              <color name="farm_background">#F7FAF5</color>
              <color name="farm_white">#FFFFFF</color>
              <color name="farm_text">#18351F</color>
          </resources>
          EOF

          cat > FarmersMeet/app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">@color/farm_green</item>
                  <item name="android:navigationBarColor">@color/farm_dark_green</item>
                  <item name="android:statusBarColor">@color/farm_dark_green</item>
              </style>
          </resources>
          EOF

          cat > FarmersMeet/app/src/main/res/drawable/button_green.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="@color/farm_green" />
              <corners android:radius="10dp" />
              <padding
                  android:left="10dp"
                  android:right="10dp"
                  android:top="8dp"
                  android:bottom="8dp" />
          </shape>
          EOF

          cat > FarmersMeet/app/src/main/res/drawable/button_yellow.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="@color/farm_yellow" />
              <corners android:radius="10dp" />
              <padding
                  android:left="10dp"
                  android:right="10dp"
                  android:top="8dp"
                  android:bottom="8dp" />
          </shape>
          EOF

          cat > FarmersMeet/app/src/main/res/drawable/card_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="@color/farm_white" />
              <corners android:radius="12dp" />
              <stroke
                  android:width="1dp"
                  android:color="#D5E4D7" />
              <padding
                  android:left="4dp"
                  android:right="4dp"
                  android:top="4dp"
                  android:bottom="4dp" />
          </shape>
          EOF

          cat > FarmersMeet/app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="28dp"
              android:background="@color/farm_background">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="FarmersMeet"
                  android:textColor="@color/farm_green"
                  android:textSize="38sp"
                  android:textStyle="bold" />

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Connecting farmers, buyers and agricultural businesses"
                  android:textColor="@color/farm_text"
                  android:textSize="16sp"
                  android:gravity="center"
                  android:layout_marginTop="10dp" />

              <Button
                  android:id="@+id/marketplaceButton"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="ENTER MARKETPLACE"
                  android:textColor="@color/farm_text"
                  android:textStyle="bold"
                  android:background="@drawable/button_yellow"
                  android:layout_marginTop="35dp" />

          </LinearLayout>
          EOF

          cat > FarmersMeet/app/src/main/res/layout/activity_marketplace.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@color/farm_background">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical">

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="120dp"
                      android:orientation="vertical"
                      android:gravity="center_vertical"
                      android:padding="24dp"
                      android:background="@color/farm_green">

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="FarmersMeet Marketplace"
                          android:textColor="@color/farm_yellow"
                          android:textSize="27sp"
                          android:textStyle="bold" />

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Buy and sell agricultural products"
                          android:textColor="@color/farm_white"
                          android:textSize="15sp" />

                  </LinearLayout>

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:padding="20dp">

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Browse Categories"
                          android:textColor="@color/farm_text"
                          android:textSize="21sp"
                          android:textStyle="bold"
                          android:layout_marginBottom="14dp" />

                      <Button
                          android:id="@+id/cropsButton"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="Crops and Farm Produce"
                          android:textColor="@color/farm_white"
                          android:background="@drawable/button_green" />

                      <Button
                          android:id="@+id/pigsButton"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="Pigs and Piglets"
                          android:textColor="@color/farm_white"
                          android:background="@drawable/button_green"
                          android:layout_marginTop="10dp" />

                      <Button
                          android:id="@+id/fishButton"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="Fish and Aquaculture"
                          android:textColor="@color/farm_white"
                          android:background="@drawable/button_green"
                          android:layout_marginTop="10dp" />

                      <Button
                          android:id="@+id/livestockButton"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="Other Livestock"
                          android:textColor="@color/farm_white"
                          android:background="@drawable/button_green"
                          android:layout_marginTop="10dp" />

                      <Button
                          android:id="@+id/poultryButton"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="Poultry"
                          android:textColor="@color/farm_white"
                          android:background="@drawable/button_green"
                          android:layout_marginTop="10dp" />

                      <Button
                          android:id="@+id/seedsButton"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="Seeds and Seedlings"
                          android:textColor="@color/farm_white"
                          android:background="@drawable/button_green"
                          android:layout_marginTop="10dp" />

                      <Button
                          android:id="@+id/equipmentButton"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="Farm Equipment"
                          android:textColor="@color/farm_white"
                          android:background="@drawable/button_green"
                          android:layout_marginTop="10dp" />

                      <Button
                          android:id="@+id/sellButton"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="SELL AN ITEM"
                          android:textColor="@color/farm_text"
                          android:textStyle="bold"
                          android:background="@drawable/button_yellow"
                          android:layout_marginTop="22dp" />

                  </LinearLayout>
              </LinearLayout>
          </ScrollView>
          EOF

          cat > FarmersMeet/app/src/main/res/layout/activity_listings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@color/farm_background">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:padding="20dp">

                  <TextView
                      android:id="@+id/categoryTitle"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:textColor="@color/farm_green"
                      android:textSize="28sp"
                      android:textStyle="bold"
                      android:layout_marginBottom="18dp" />

                  <LinearLayout
                      android:id="@+id/listingsContainer"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical" />

              </LinearLayout>
          </ScrollView>
          EOF

          cat > FarmersMeet/app/src/main/res/layout/activity_sell.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@color/farm_background">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:padding="22dp">

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Sell an Item"
                      android:textColor="@color/farm_green"
                      android:textSize="29sp"
                      android:textStyle="bold" />

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Create a marketplace listing"
                      android:textColor="@color/farm_text"
                      android:textSize="15sp"
                      android:layout_marginTop="6dp"
                      android:layout_marginBottom="20dp" />

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Category"
                      android:textStyle="bold"
                      android:textColor="@color/farm_text" />

                  <Spinner
                      android:id="@+id/categorySpinner"
                      android:layout_width="match_parent"
                      android:layout_height="50dp"
                      android:layout_marginTop="6dp" />

                  <EditText
                      android:id="@+id/itemName"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:hint="Product name"
                      android:layout_marginTop="16dp" />

                  <EditText
                      android:id="@+id/itemPrice"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:hint="Price in Naira"
                      android:inputType="number"
                      android:layout_marginTop="10dp" />

                  <EditText
                      android:id="@+id/itemQuantity"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:hint="Quantity"
                      android:layout_marginTop="10dp" />

                  <EditText
                      android:id="@+id/itemLocation"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:hint="Location"
                      android:layout_marginTop="10dp" />

                  <EditText
                      android:id="@+id/itemDescription"
                      android:layout_width="match_parent"
                      android:layout_height="120dp"
                      android:gravity="top"
                      android:hint="Description"
                      android:layout_marginTop="1
