          <resources>
              <style name="AppTheme" parent="Theme.Material3.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">@color/farm_yellow</item>
                  <item name="android:statusBarColor">@color/farm_green_dark</item>
