              private static class Listing {
                  long id;
                  String name;
                  String category;
                  String price;
                  String quantity;
                  String location;
                  String seller;
                  String phone;
                  String description;
                  String photoUri;
                  boolean isMine;

                  Listing(
                          long id,
                          String name,
                          String category,
                          String price,
                          String quantity,
                          String location,
                          String seller,
                          String phone,
                          String description,
                          String photoUri,
                          boolean isMine
                  ) {
                      this.id = id;
                      this.name = name;
                      this.category = category;
                      this.price = price;
                      this.quantity = quantity;
                      this.location = location;
                      this.seller = seller;
                      this.phone = phone;
                      this.description = description;
                      this.photoUri = photoUri;
                      this.isMine = isMine;
                  }
              }

              private static class SellerProfile {
                  String name;
                  String farmName;
                  String phone;
                  String location;
                  String about;

                  SellerProfile(
                          String name,
                          String farmName,
                          String phone,
                          String location,
                          String about
                  ) {
                      this.name = name;
                      this.farmName = farmName;
                      this.phone = phone;
                      this.location = location;
                      this.about = about;
                  }
              }
          }
          EOF

      - name: Create Gradle wrapper
        shell: bash
        run: |
          set -e

          cd FarmersMeet

          gradle wrapper \
            --gradle-version 8.9 \
            --distribution-type bin

          chmod +x gradlew

      - name: Build Stage 9 APK
        shell: bash
        run: |
          set -e

          cd FarmersMeet

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

      - name: Verify APK exists
        shell: bash
        run: |
          set -e

          APK="FarmersMeet/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "Stage 9 APK successfully created:"
          ls -lh "$APK"

      - name: Verify APK package
        shell: bash
        run: |
          set -e

          APK="FarmersMeet/app/build/outputs/apk/debug/app-debug.apk"

          if command -v aapt >/dev/null 2>&1; then
            aapt dump badging "$APK" | head -n 20
          else
            echo "aapt not directly available; APK existence already verified."
          fi

      - name: Upload Stage 9 APK
        uses: actions/upload-artifact@v4
        with:
          name: FarmersMeet-Stage-9-APK
          path: FarmersMeet/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
