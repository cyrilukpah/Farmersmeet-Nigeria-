name: Build FarmersMeet Nigeria

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create fresh project
        shell: bash
        run: |
          set -e
          mkdir -p FarmersMeet/app/src/main/java/ng/farmersmeet/nigeria
          mkdir -p FarmersMeet/app/src/main/res/layout
          mkdir -p FarmersMeet/app/src/main/res/values

          cd FarmersMeet

          printf '%s\n' \
          'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }' \
          'dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }' \
          'rootProject.name = "FarmersMeetNigeria"' \
          'include(":app")' > settings.gradle

          printf '%s\n' \
          'plugins {' \
          "    id 'com.android.application' version '8.7.3' apply false" \
          "    id 'org.jetbrains.kotlin.android' version '2.0.21' apply false" \
          '}' > build.gradle

          printf '%s\n' \
          'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' \
          'android.useAndroidX=true' \
          'kotlin.code.style=official' > gradle.properties

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'ng.farmersmeet.nigeria'
              compileSdk 35

              defaultConfig {
                  applicationId 'ng.farmersmeet.nigeria'
                  minSdk 24
                  targetSdk 35
                  versionCode 2
                  versionName '2.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.15.0'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.activity:activity-ktx:1.10.0'
              implementation 'com.google.android.material:material:1.12.0'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="FarmersMeet Nigeria"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MarketplaceActivity"
                      android:exported="false" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.Material3.DayNight.NoActionBar" />
          </resources>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="28dp">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="FarmersMeet Nigeria"
                  android:textSize="28sp"
                  android:textStyle="bold" />

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Connect - Buy - Sell - Grow"
                  android:textSize="17sp"
                  android:layout_marginTop="10dp" />

              <Button
                  android:id="@+id/marketplaceButton"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Enter Marketplace"
                  android:layout_marginTop="30dp" />

          </LinearLayout>
          EOF

          cat > app/src/main/res/layout/activity_marketplace.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:padding="24dp">

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="FarmersMeet Marketplace"
                      android:textSize="26sp"
                      android:textStyle="bold" />

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Choose a category"
                      android:textSize="17sp"
                      android:layout_marginTop="8dp"
                      android:layout_marginBottom="20dp" />

                  <Button
                      android:id="@+id/cropsButton"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Crops and Farm Produce" />

                  <Button
                      android:id="@+id/livestockButton"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Livestock" />

                  <Button
                      android:id="@+id/poultryButton"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Poultry" />

                  <Button
                      android:id="@+id/seedsButton"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Seeds and Seedlings" />

                  <Button
                      android:id="@+id/equipmentButton"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Farm Equipment" />

                  <Button
                      android:id="@+id/sellButton"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Sell an Item"
                      android:layout_marginTop="18dp" />

              </LinearLayout>
          </ScrollView>
          EOF

          cat > app/src/main/java/ng/farmersmeet/nigeria/MainActivity.kt <<'EOF'
          package ng.farmersmeet.nigeria

          import android.content.Intent
          import android.os.Bundle
          import android.widget.Button
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  findViewById<Button>(R.id.marketplaceButton).setOnClickListener {
                      startActivity(
                          Intent(this, MarketplaceActivity::class.java)
                      )
                  }
              }
          }
          EOF

          cat > app/src/main/java/ng/farmersmeet/nigeria/MarketplaceActivity.kt <<'EOF'
          package ng.farmersmeet.nigeria

          import android.os.Bundle
          import android.widget.Button
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity

          class MarketplaceActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_marketplace)

                  val buttons = listOf(
                      R.id.cropsButton to "Crops and Farm Produce",
                      R.id.livestockButton to "Livestock",
                      R.id.poultryButton to "Poultry",
                      R.id.seedsButton to "Seeds and Seedlings",
                      R.id.equipmentButton to "Farm Equipment",
                      R.id.sellButton to "Sell an Item"
                  )

                  buttons.forEach { (id, name) ->
                      findViewById<Button>(id).setOnClickListener {
                          Toast.makeText(
                              this,
                              "$name selected",
                              Toast.LENGTH_SHORT
                          ).show()
                      }
                  }
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build APK
        working-directory: FarmersMeet
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FarmersMeet-marketplace-apk
          path: FarmersMeet/app/build/outputs/apk/debug/app-debug.apk) ->
                      findViewById<Button>(id).setOnClickListener {
                          Toast.makeText(
                              this,
                              "$name selected",
                              Toast.LENGTH_SHORT
                          ).show()
                      }
                  }
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build APK
        working-directory: FarmersMeet
        run: gradle :app:assembleDebug

      - name: Upload FarmersMeet APK
        uses: actions/upload-artifact@v4
        with:
          name: FarmersMeet-marketplace-apk
          path: FarmersMeet/app/build/outputs/apk/debug/app-debug.apk       R.id.poultryButton to "Poultry",
                      R.id.seedsButton to "Seeds & Seedlings",
                      R.id.equipmentButton to "Farm Equipment",
                      R.id.sellButton to "Sell an Item"
                  )

                  buttons.forEach { (id, name) ->
                      findViewById<Button>(id).setOnClickListener {
                          Toast.makeText(
                              this,
                              "$name selected",
                              Toast.LENGTH_SHORT
                          ).show()
                      }
                  }
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build APK
        working-directory: FarmersMeet
        run: gradle :app:assembleDebug

      - name: Upload FarmersMeet APK
        uses: actions/upload-artifact@v4
        with:
          name: FarmersMeet-marketplace-apk
          path: FarmersMeet/app/build/outputs/apk/debug/app-debug.apk
