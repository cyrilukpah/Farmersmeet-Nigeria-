name: FarmersMeet Stage 9 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Create FarmersMeet project
        shell: bash
        run: |
          set -e

          rm -rf FarmersMeet

          mkdir -p FarmersMeet/app/src/main/java/ng/farmersmeet/nigeria
          mkdir -p FarmersMeet/app/src/main/res/values

          cat > FarmersMeet/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "FarmersMeet"
          include(":app")
          EOF

          cat > FarmersMeet/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat > FarmersMeet/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > FarmersMeet/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'ng.farmersmeet.nigeria'
              compileSdk 35

              defaultConfig {
                  applicationId 'ng.farmersmeet.nigeria'
                  minSdk 24
                  targetSdk 35
                  versionCode 9
                  versionName "9.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.15.0'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.activity:activity-ktx:1.10.1'
          }
          EOF

          cat > FarmersMeet/app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#176B35</item>
                  <item name="android:statusBarColor">#0D4D25</item>
                  <item name="android:navigationBarColor">#0D4D25</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > FarmersMeet/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/AppTheme"
                  android:label="FarmersMeet"
                  android:allowBackup="true"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > FarmersMeet/app/src/main/java/ng/farmersmeet/nigeria/MainActivity.kt <<'EOF'
          package ng.farmersmeet.nigeria

          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Typeface
          import android.net.Uri
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.ArrayAdapter
          import android.widget.Button
          import android.widget.EditText
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.Spinner
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import org.json.JSONArray
          import org.json.JSONObject

          data class Listing(
              val id: Long,
              val name: String,
              val category: String,
              val price: String,
              val quantity: String,
              val location: String,
              val seller: String,
              val phone: String,
              val description: String,
              val photoUri: String,
              val isMine: Boolean
          )

          class MainActivity : AppCompatActivity() {

              private val green = Color.rgb(23, 107, 53)
              private val darkGreen = Color.rgb(13, 77, 37)
              private val gold = Color.rgb(244, 196, 48)
              private val background = Color.rgb(247, 250, 245)
              private val textColor = Color.rgb(24, 53, 31)

              private val categories = arrayOf(
                  "Crops and Farm Produce",
                  "Pigs and Piglets",
                  "Fish and Aquaculture",
                  "Other Livestock",
                  "Poultry",
                  "Seeds and Seedlings",
                  "Farm Equipment"
              )

              private var selectedPhotoUri: Uri? = null
              private var selectedPhotoView: ImageView? = null

              private val photoPicker =
                  registerForActivityResult(
                      ActivityResultContracts.OpenDocument()
                  ) { uri ->

                      if (uri != null) {

                          try {
                              contentResolver.takePersistableUriPermission(
                                  uri,
                                  Intent.FLAG_GRANT_READ_URI_PERMISSION
                              )
                          } catch (_: Exception) {
                          }

                          selectedPhotoUri = uri

                          selectedPhotoView?.let { image ->
                              image.setImageURI(uri)
                              image.visibility = View.VISIBLE
                          }
                      }
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  seedListings()
                  showHome()
              }

              private fun baseLayout(): LinearLayout {
                  return LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(background)
                      setPadding(20, 20, 20, 20)
                  }
              }

              private fun heading(
                  value: String,
                  size: Float = 28f
              ): TextView {
                  return TextView(this).apply {
                      text = value
                      textSize = size
                      setTextColor(green)
                      setTypeface(null, Typeface.BOLD)
                      setPadding(0, 10, 0, 18)
                  }
              }

              private fun makeButton(
                  value: String,
                  goldButton: Boolean = false
              ): Button {

                  return Button(this).apply {

                      text = value
                      textSize = 15f
                      isAllCaps = false
                      isClickable = true
                      isFocusable = true

                      setTypeface(null, Typeface.BOLD)

                      setTextColor(
                          if (goldButton) textColor
                          else Color.WHITE
                      )

                      setBackgroundColor(
                          if (goldButton) gold
                          else green
                      )

                      layoutParams =
                          LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.WRAP_CONTENT
                          ).apply {
                              setMargins(0, 6, 0, 6)
                          }
                  }
              }

              private fun showHome() {

                  val root = baseLayout().apply {
                      gravity = Gravity.CENTER
                  }

                  root.addView(
                      heading(
                          "FarmersMeet",
                          40f
                      ).apply {
                          gravity = Gravity.CENTER
                      }
                  )

                  root.addView(
                      TextView(this).apply {
                          text =
                              "Connecting farmers, buyers and agricultural businesses"
                          textSize = 16f
                          setTextColor(textColor)
                          gravity = Gravity.CENTER
                          setPadding(10, 0, 10, 25)
                      }
                  )

                  root.addView(
                      makeButton(
                          "ENTER MARKETPLACE",
                          true
                      ).apply {
                          setOnClickListener {
                              showMarketplace()
                          }
                      }
                  )

                  setContentView(root)
              }

              private fun showMarketplace() {

                  val scroll = ScrollView(this)
                  val root = baseLayout()

                  root.addView(
                      heading("FarmersMeet Marketplace")
                  )

                  root.addView(
                      TextView(this).apply {
                          text =
                              "Buy and sell agricultural products"
                          textSize = 16f
                          setTextColor(textColor)
                          setPadding(0, 0, 0, 12)
                      }
                  )

                  val search = EditText(this).apply {
                      hint = "Search pigs, fish, crops..."
                      textSize = 16f
                      setSingleLine(true)
                      setTextColor(textColor)
                  }

                  root.addView(search)

                  root.addView(
                      makeButton("SEARCH", true).apply {
                          setOnClickListener {
                              showSearchResults(
                                  search.text.toString().trim()
                              )
                          }
                      }
                  )

                  root.addView(
                      makeButton("❤️ MY FAVORITES").apply {
                          setOnClickListener {
                              showFavorites()
                          }
                      }
                  )

                  root.addView(
                      makeButton("MY LISTINGS").apply {
                          setOnClickListener {
                              showMyListings()
                          }
                      }
                  )

                  root.addView(
                      TextView(this).apply {
                          text = "Browse Categories"
                          textSize = 21f
                          setTextColor(green)
                          setTypeface(null, Typeface.BOLD)
                          setPadding(0, 15, 0, 8)
                      }
                  )

                  categories.forEach { category ->

                      root.addView(
                          makeButton(category).apply {
                              setOnClickListener {
                                  showListings(category)
                              }
                          }
                      )
                  }

                  root.addView(
                      makeButton(
                          "SELL AN ITEM",
                          true
                      ).apply {
                          setOnClickListener {
                              showSell()
                          }
                      }
                  )

                  scroll.addView(root)
                  setContentView(scroll)
              }

              private fun showListings(category: String) {

                  val results =
                      getListings()
                          .filter {
                              it.category == category
                          }
                          .reversed()

                  showListingPage(
                      category,
                      results
                  )
              }

              private fun showSearchResults(
                  query: String
              ) {

                  val lower = query.lowercase()

                  val results =
                      if (lower.isEmpty()) {
                          getListings()
                      } else {
                          getListings().filter { listing ->

                              listing.name
                                  .lowercase()
                                  .contains(lower) ||

                              listing.category
                                  .lowercase()
                                  .contains(lower) ||

                              listing.location
                                  .lowercase()
                                  .contains(lower) ||

                              listing.seller
                                  .lowercase()
                                  .contains(lower)
                          }
                      }

                  showListingPage(
                      if (query.isEmpty())
                          "All Listings"
                      else
                          "Search: $query",
                      results.reversed()
                  )
              }

              private fun showFavorites() {

                  val results =
                      getListings()
                          .filter {
                              isFavorite(it.id)
                          }
                          .reversed()

                  showListingPage(
                      "My Favorites",
                      results
                  )
              }

              private fun showMyListings() {

                  val results =
                      getListings()
                          .filter {
                              it.isMine
                          }
                          .reversed()

                  showListingPage(
                      "My Listings",
                      results,
                      true
                  )
              }

              private fun showListingPage(
                  pageTitle: String,
                  results: List<Listing>,
                  mineOnly: Boolean = false
              ) {

                  val scroll = ScrollView(this)
                  val root = baseLayout()

                  root.addView(
                      heading(pageTitle)
                  )

                  if (results.isEmpty()) {

                      root.addView(
                          TextView(this).apply {
                              text =
                                  if (mineOnly)
                                      "You have not posted any listings yet."
                                  else
                                      "No listings found."

                              textSize = 18f
                              setTextColor(textColor)
                              setPadding(0, 20, 0, 30)
                          }
                      )

                  } else {

                      results.forEach { listing ->
                          addListingCard(
                              root,
                              listing,
                              mineOnly
                          )
                      }
                  }

                  root.addView(
                      makeButton(
                          "SELL AN ITEM",
                          true
                      ).apply {
                          setOnClickListener {
                              showSell()
                          }
                      }
                  )

                  root.addView(
                      makeButton(
                          "BACK TO MARKETPLACE"
                      ).apply {
                          setOnClickListener {
                              showMarketplace()
                          }
                      }
                  )

                  scroll.addView(root)
                  setContentView(scroll)
              }

              private fun addListingCard(
                  root: LinearLayout,
                  listing: Listing,
                  mineOnly: Boolean
              ) {

                  val card =
                      LinearLayout(this).apply {

                          orientation =
                              LinearLayout.VERTICAL

                          setBackgroundColor(Color.WHITE)

                          setPadding(
                              16,
                              14,
                              16,
                              14
                          )

                          layoutParams =
                              LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.WRAP_CONTENT
                              ).apply {
                                  setMargins(0, 0, 0, 14)
                              }
                      }

                  if (listing.photoUri.isNotEmpty()) {

                      try {

                          val image =
                              ImageView(this).apply {

                                  layoutParams =
                                      LinearLayout.LayoutParams(
                                          ViewGroup.LayoutParams.MATCH_PARENT,
                                          230
                                      )

                                  scaleType =
                                      ImageView.ScaleType.CENTER_CROP

                                  setImageURI(
                                      Uri.parse(
                                          listing.photoUri
                                      )
                                  )
                              }

                          card.addView(image)

                      } catch (_: Exception) {
                      }
                  }

                  card.addView(
                      TextView(this).apply {
                          text = listing.name
                          textSize = 21f
                          setTextColor(green)
                          setTypeface(null, Typeface.BOLD)
                          setPadding(0, 8, 0, 4)
                      }
                  )

                  card.addView(
                      TextView(this).apply {
                          text = listing.price
                          textSize = 20f
                          setTextColor(darkGreen)
                          setTypeface(null, Typeface.BOLD)
                      }
                  )

                  card.addView(
                      TextView(this).apply {
                          text =
                              "Quantity: ${listing.quantity}\n" +
                              "Location: ${listing.location}\n" +
                              "Seller: ${listing.seller}"

                          textSize = 15f
                          setTextColor(textColor)
                          setPadding(0, 5, 0, 8)
                      }
                  )

                  card.addView(
                      makeButton(
                          if (isFavorite(listing.id))
                              "❤️ REMOVE FAVORITE"
                          else
                              "♡ SAVE FAVORITE"
                      ).apply {

                          setOnClickListener {

                              toggleFavorite(
                                  listing.id
                              )

                              text =
                                  if (isFavorite(listing.id))
                                      "❤️ REMOVE FAVORITE"
                                  else
                                      "♡ SAVE FAVORITE"

                              Toast.makeText(
                                  this@MainActivity,
                                  if (isFavorite(listing.id))
                                      "Added to favorites."
                                  else
                                      "Removed from favorites.",
                                  Toast.LENGTH_SHORT
                              ).show()
                          }
                      }
                  )

                  card.addView(
                      makeButton(
                          "VIEW DETAILS"
                      ).apply {
                          setOnClickListener {
                              showDetails(listing)
                          }
                      }
                  )

                  if (mineOnly && listing.isMine) {

                      card.addView(
                          makeButton(
                              "DELETE LISTING"
                          ).apply {

                              setOnClickListener {

                                  deleteListing(
                                      listing.id
                                  )

                                  Toast.makeText(
                                      this@MainActivity,
                                      "Listing deleted.",
                                      Toast.LENGTH_SHORT
                                  ).show()

                                  showMyListings()
                              }
                          }
                      )
                  }

                  root.addView(card)
              }

              private fun showDetails(
                  listing: Listing
              ) {

                  val scroll = ScrollView(this)
                  val root = baseLayout()

                  root.addView(
                      heading(listing.name)
                  )

                  if (listing.photoUri.isNotEmpty()) {

                      try {

                          val image =
                              ImageView(this).apply {

                                  layoutParams =
                                      LinearLayout.LayoutParams(
                                          ViewGroup.LayoutParams.MATCH_PARENT,
                                          280
                                      )

                                  scaleType =
                                      ImageView.ScaleType.CENTER_CROP

                                  setImageURI(
                                      Uri.parse(
                                          listing.photoUri
                                      )
                                  )
                              }

                          root.addView(image)

                      } catch (_: Exception) {
                      }
                  }

                  root.addView(
                      TextView(this).apply {

                          text =
                              "PRICE\n${listing.price}\n\n" +
                              "CATEGORY\n${listing.category}\n\n" +
                              "QUANTITY\n${listing.quantity}\n\n" +
                              "LOCATION\n${listing.location}\n\n" +
                              "SELLER\n${listing.seller}\n\n" +
                              "PHONE\n${listing.phone}\n\n" +
                              "DESCRIPTION\n" +
                              if (listing.description.isEmpty())
                                  "No description provided."
                              else
                                  listing.description

                          textSize = 17f
                          setTextColor(textColor)
                          setPadding(0, 15, 0, 15)
                      }
                  )

                  root.addView(
                      makeButton(
                          if (isFavorite(listing.id))
                              "❤️ REMOVE FAVORITE"
                          else
                              "♡ SAVE FAVORITE"
                      ).apply {

                          setOnClickListener {

                              toggleFavorite(
                                  listing.id
                              )

                              text =
                                  if (isFavorite(listing.id))
                                      "❤️ REMOVE FAVORITE"
                                  else
                                      "♡ SAVE FAVORITE"
                          }
                      }
                  )

                  root.addView(
                      makeButton(
                          "CALL SELLER",
                          true
                      ).apply {

                          setOnClickListener {

                              if (listing.phone.isEmpty()) {

                                  Toast.makeText(
                                      this@MainActivity,
                                      "No phone number provided.",
                                      Toast.LENGTH_SHORT
                                  ).show()

                              } else {

                                  startActivity(
                                      Intent(
                                          Intent.ACTION_DIAL,
                                          Uri.parse(
                                              "tel:${listing.phone}"
                                          )
                                      )
                                  )
                              }
                          }
                      }
                  )

                  root.addView(
                      makeButton(
                          "WHATSAPP SELLER"
                      ).apply {

                          setOnClickListener {

                              if (listing.phone.isEmpty()) {

                                  Toast.makeText(
                                      this@MainActivity,
                                      "No phone number provided.",
                                      Toast.LENGTH_SHORT
                                  ).show()

                              } else {

                                  val clean =
                                      listing.phone
                                          .replace("+", "")
                                          .replace(" ", "")

                                  val message =
                                      "Hello, I saw your ${listing.name} listing on FarmersMeet."

                                  val uri =
                                      Uri.parse(
                                          "https://wa.me/$clean?text=" +
                                          Uri.encode(message)
                                      )

                                  startActivity(
                                      Intent(
                                          Intent.ACTION_VIEW,
                                          uri
                                      )
                                  )
                              }
                          }
                      }
                  )

                  if (listing.isMine) {

                      root.addView(
                          makeButton(
                              "DELETE LISTING"
                          ).apply {

                              setOnClickListener {

                                  deleteListing(
                                      listing.id
                                  )

                                  Toast.makeText(
                                      this@MainActivity,
                                      "Listing deleted.",
                                      Toast.LENGTH_SHORT
                                  ).show()

                                  showMyListings()
                              }
                          }
                      )
                  }

                  root.addView(
                      makeButton(
                          "BACK TO LISTINGS"
                      ).apply {

                          setOnClickListener {
                              showListings(
                                  listing.category
                              )
                          }
                      }
                  )

                  root.addView(
                      makeButton(
                          "MARKETPLACE",
                          true
                      ).apply {

                          setOnClickListener {
                              showMarketplace()
                          }
                      }
                  )

                  scroll.addView(root)
                  setContentView(scroll)
              }

              private fun showSell() {

                  selectedPhotoUri = null
                  selectedPhotoView = null

                  val scroll = ScrollView(this)
                  val root = baseLayout()

                  root.addView(
                      heading("Sell an Item")
                  )

                  root.addView(
                      TextView(this).apply {
                          text = "Category"
                          textSize = 18f
                          setTextColor(green)
                          setTypeface(null, Typeface.BOLD)
                      }
                  )

                  val category =
                      Spinner(this).apply {

                          adapter =
                              ArrayAdapter(
                                  this@MainActivity,
                                  android.R.layout.simple_spinner_dropdown_item,
                                  categories
                              )
                      }

                  root.addView(category)

                  root.addView(
                      TextView(this).apply {
                          text = "Product Photo"
                          textSize = 18f
                          setTextColor(green)
                          setTypeface(null, Typeface.BOLD)
                          setPadding(0, 15, 0, 5)
                      }
                  )

                  val photo =
                      ImageView(this).apply {

                          layoutParams =
                              LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  220
                              )

                          scaleType =
                              ImageView.ScaleType.CENTER_CROP

                          setBackgroundColor(
                              Color.LTGRAY
                          )

                          visibility = View.GONE
                      }

                  selectedPhotoView = photo
                  root.addView(photo)

                  root.addView(
                      makeButton(
                          "CHOOSE PHOTO",
                          true
                      ).apply {

                          setOnClickListener {

                              photoPicker.launch(
                                  arrayOf("image/*")
                              )
                          }
                      }
                  )

                  val name =
                      field("Product name")

                  val price =
                      field("Price in Naira")

                  val quantity =
                      field("Quantity")

                  val location =
                      field("Location")

                  val seller =
                      field("Seller name")

                  val phone =
                      field("Phone number")

                  val description =
                      field("Description").apply {
                          minLines = 4
                          gravity = Gravity.TOP
                      }

                  root.addView(name)
                  root.addView(price)
                  root.addView(quantity)
                  root.addView(location)
                  root.addView(seller)
                  root.addView(phone)
                  root.addView(description)

                  root.addView(
                      makeButton(
                          "POST LISTING",
                          true
                      ).apply {

                          setOnClickListener {

                              val required =
                                  listOf(
                                      name,
                                      price,
                                      quantity,
                                      location,
                                      seller,
                                      phone
                                  )

                              if (
                                  required.any {
                                      it.text
                                          .toString()
                                          .trim()
                                          .isEmpty()
                                  }
                              ) {

                                  Toast.makeText(
                                      this@MainActivity,
                                      "Please complete the required fields.",
                                      Toast.LENGTH_SHORT
                                  ).show()

                                  return@setOnClickListener
                              }

                              val listing =
                                  Listing(
                                      System.currentTimeMillis(),
                                      name.text
                                          .toString()
                                          .trim(),
                                      category
                                          .selectedItem
                                          .toString(),
                                      "₦" +
                                          price.text
                                              .toString()
                                              .trim(),
                                      quantity.text
                                          .toString()
                                          .trim(),
                                      location.text
                                          .toString()
                                          .trim(),
                                      seller.text
                                          .toString()
                                          .trim(),
                                      phone.text
                                          .toString()
                                          .trim(),
                                      description.text
                                          .toString()
                                          .trim(),
                                      selectedPhotoUri
                                          ?.toString()
                                          ?: "",
                                      true
                                  )

                              saveListing(
                                  listing
                              )

                              Toast.makeText(
                                  this@MainActivity,
                                  "Listing posted successfully!",
                                  Toast.LENGTH_LONG
                              ).show()

                              showListings(
                                  listing.category
                              )
                          }
                      }
                  )

                  root.addView(
                      makeButton(
                          "BACK TO MARKETPLACE"
                      ).apply {

                          setOnClickListener {
                              showMarketplace()
                          }
                      }
                  )

                  scroll.addView(root)
                  setContentView(scroll)
              }

              private fun field(
                  hintValue: String
              ): EditText {

                  return EditText(this).apply {

                      hint = hintValue
                      textSize = 16f
                      setTextColor(textColor)

                      layoutParams =
                          LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.WRAP_CONTENT
                          ).apply {
                              setMargins(0, 5, 0, 5)
                          }
                  }
              }

              private fun saveListing(
                  listing: Listing
              ) {

                  val prefs =
                      getSharedPreferences(
                          "farmersmeet",
                          Context.MODE_PRIVATE
                      )

                  val array =
                      JSONArray(
                          prefs.getString(
                              "listings",
                              "[]"
                          ) ?: "[]"
                      )

                  val item =
                      JSONObject()

                  item.put("id", listing.id)
                  item.put("name", listing.name)
                  item.put("category", listing.category)
                  item.put("price", listing.price)
                  item.put("quantity", listing.quantity)
                  item.put("location", listing.location)
                  item.put("seller", listing.seller)
                  item.put("phone", listing.phone)
                  item.put("description", listing.description)
                  item.put("photoUri", listing.photoUri)
                  item.put("isMine", listing.isMine)

                  array.put(item)

                  prefs.edit()
                      .putString(
                          "listings",
                          array.toString()
                      )
                      .apply()
              }

              private fun getListings(): List<Listing> {

                  val prefs =
                      getSharedPreferences(
                          "farmersmeet",
                          Context.MODE_PRIVATE
                      )

                  val array =
                      JSONArray(
                          prefs.getString(
                              "listings",
                              "[]"
                          ) ?: "[]"
                      )

                  val result =
                      mutableListOf<Listing>()

                  for (i in 0 until array.length()) {

                      val item =
                          array.getJSONObject(i)

                      result.add(
                          Listing(
                              item.optLong(
                                  "id",
                                  i.toLong()
                              ),
                              item.optString("name"),
                              item.optString("category"),
                              item.optString("price"),
                              item.optString("quantity"),
                              item.optString("location"),
                              item.optString("seller"),
                              item.optString("phone"),
                              item.optString("description"),
                              item.optString("photoUri"),
                              item.optBoolean(
                                  "isMine",
                                  false
                              )
                          )
                      )
                  }

                  return result
              }

              private fun isFavorite(
                  id: Long
              ): Boolean {

                  val prefs =
                      getSharedPreferences(
                          "farmersmeet",
                          Context.MODE_PRIVATE
                      )

                  val favorites =
                      prefs.getStringSet(
                          "favorites",
                          emptySet()
                      ) ?: emptySet()

                  return favorites.contains(
                      id.toString()
                  )
              }

              private fun toggleFavorite(
                  id: Long
              ) {

                  val prefs =
                      getSharedPreferences(
                          "farmersmeet",
                          Context.MODE_PRIVATE
                      )

                  val favorites =
                      prefs.getStringSet(
                          "favorites",
                          emptySet()
                      )?.toMutableSet()
                          ?: mutableSetOf()

                  val key = id.toString()

                  if (favorites.contains(key)) {
                      favorites.remove(key)
                  } else {
                      favorites.add(key)
                  }

                  prefs.edit()
                      .putStringSet(
                          "favorites",
                          favorites
                      )
                      .apply()
              }

              private fun deleteListing(
                  id: Long
              ) {

                  val prefs =
                      getSharedPreferences(
                          "farmersmeet",
                          Context.MODE_PRIVATE
                      )

                  val array =
                      JSONArray(
                          prefs.getString(
                              "listings",
                              "[]"
                          ) ?: "[]"
                      )

                  val newArray =
                      JSONArray()

                  for (i in 0 until array.length()) {

                      val item =
                          array.getJSONObject(i)

                      if (
                          item.optLong("id") != id
                      ) {
                          newArray.put(item)
                      }
                  }

                  val favorites =
                      prefs.getStringSet(
                          "favorites",
                          emptySet()
                      )?.toMutableSet()
                          ?: mutableSetOf()

                  favorites.remove(
                      id.toString()
                  )

                  prefs.edit()
                      .putString(
                          "listings",
                          newArray.toString()
                      )
                      .putStringSet(
                          "favorites",
                          favorites
                      )
                      .apply()
              }

