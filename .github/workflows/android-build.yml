name: FarmersMeet Stage 8 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Verify existing FarmersMeet project
        shell: bash
        run: |
          set -e
          test -f FarmersMeet/settings.gradle
          test -f FarmersMeet/build.gradle
          test -f FarmersMeet/app/build.gradle
          test -f FarmersMeet/app/src/main/AndroidManifest.xml
          test -f FarmersMeet/app/src/main/java/ng/farmersmeet/nigeria/MainActivity.kt
          echo "Existing FarmersMeet project verified."

      - name: Build Stage 8 APK
        working-directory: FarmersMeet
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e
          test -s FarmersMeet/app/build/outputs/apk/debug/app-debug.apk
          echo "FarmersMeet Stage 8 APK created successfully."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FarmersMeet-Stage8-APK
          path: FarmersMeet/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
