name: FarmersMeet Stage 9 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build FarmersMeet Stage 9
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ -z "$ANDROID_SDK_ROOT" ]; then
            echo "Android SDK was not found."
            exit 1
          fi

          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$GITHUB_WORKSPACE/local.properties"

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager was not found."
            find "$ANDROID_SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK installation complete."

      - name: Create FarmersMeet Stage 9 project
        shell: bash
        run: |
          set -e

          rm -rf FarmersMeet

          mkdir -p FarmersMeet/app/src/main/java/ng/farmersmeet/nigeria
          mkdir -p FarmersMeet/app/src/main/res/values

          cat > FarmersMeet/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "FarmersMeetNigeria"
          include(":app")
          EOF

          cat > FarmersMeet/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > FarmersMeet/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF

          cat > FarmersMeet/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'ng.farmersmeet.nigeria'
              compileSdk 35

              defaultConfig {
                  applicationId 'ng.farmersmeet.nigeria'
                  minSdk 24
                  targetSdk 35
                  versionCode 10
                  versionName "9.0"
              }

              buildTypes {
                  debug {
                      debuggable true
                      minifyEnabled false
                  }

                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > FarmersMeet/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="FarmersMeet"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > FarmersMeet/app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="@android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#176B35</item>
                  <item name="android:statusBarColor">#0D4D25</item>
                  <item name="android:navigationBarColor">#0D4D25</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowActionModeOverlay">true</item>

              </style>

          </resources>
          EOF

          cat > FarmersMeet/app/src/main/java/ng/farmersmeet/nigeria/MainActivity.java <<'EOF'
          package ng.farmersmeet.nigeria;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.Spinner;
          import android.widget.ArrayAdapter;
          import android.widget.TextView;
          import android.widget.Toast;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends Activity {

              private static final String PREFS = "farmersmeet_stage9";

              private static final int GREEN = Color.rgb(23, 107, 53);
              private static final int DARK_GREEN = Color.rgb(13, 77, 37);
              private static final int YELLOW = Color.rgb(244, 196, 48);
              private static final int BACKGROUND = Color.rgb(247, 250, 245);
              private static final int TEXT = Color.rgb(24, 53, 31);

              private final String[] categories = {
                      "Crops and Farm Produce",
                      "Pigs and Piglets",
                      "Fish and Aquaculture",
                      "Other Livestock",
                      "Poultry",
                      "Seeds and Seedlings",
                      "Farm Equipment"
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  try {
                      seedListings();
                      showHome();
                  } catch (Exception e) {
                      showFatalError(e);
                  }
              }

              private void showFatalError(Exception e) {
                  LinearLayout root = baseLayout();

                  TextView title = heading("FarmersMeet");
                  root.addView(title);

                  TextView error = textView(
                          "The app encountered an error while starting.\n\n" +
                          e.getClass().getSimpleName() + "\n" +
                          String.valueOf(e.getMessage())
                  );

                  root.addView(error);

                  Button retry = button("RESTART APP", true);
                  retry.setOnClickListener(v -> {
                      try {
                          showHome();
                      } catch (Exception ex) {
                          showFatalError(ex);
                      }
                  });

                  root.addView(retry);

                  setContentView(root);
              }

              private LinearLayout baseLayout() {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(BACKGROUND);
                  root.setPadding(20, 20, 20, 20);
                  return root;
              }

              private ScrollView scrollRoot() {
                  ScrollView scroll = new ScrollView(this);
                  scroll.setFillViewport(true);

                  LinearLayout root = baseLayout();
                  scroll.addView(root);

                  return scroll;
              }

              private TextView heading(String value) {
                  TextView view = new TextView(this);
                  view.setText(value);
                  view.setTextSize(28);
                  view.setTextColor(GREEN);
                  view.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  view.setPadding(0, 10, 0, 18);
                  return view;
              }

              private TextView textView(String value) {
                  TextView view = new TextView(this);
                  view.setText(value);
                  view.setTextSize(16);
                  view.setTextColor(TEXT);
                  view.setPadding(0, 8, 0, 12);
                  return view;
              }

              private EditText field(String hint) {
                  EditText edit = new EditText(this);
                  edit.setHint(hint);
                  edit.setTextSize(16);
                  edit.setTextColor(TEXT);
                  edit.setHintTextColor(Color.GRAY);

                  LinearLayout.LayoutParams params =
                          new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  LinearLayout.LayoutParams.WRAP_CONTENT
                          );

                  params.setMargins(0, 5, 0, 5);
                  edit.setLayoutParams(params);

                  return edit;
              }

              private Button button(String value, boolean yellow) {
                  Button b = new Button(this);

                  b.setText(value);
                  b.setTextSize(15);
                  b.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  b.setTextColor(yellow ? TEXT : Color.WHITE);
                  b.setBackgroundColor(yellow ? YELLOW : GREEN);

                  LinearLayout.LayoutParams params =
                          new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  LinearLayout.LayoutParams.WRAP_CONTENT
                          );

                  params.setMargins(0, 6, 0, 6);
                  b.setLayoutParams(params);

                  return b;
              }

              private Button button(String value) {
                  return button(value, false);
              }

              private void showHome() {
                  LinearLayout root = baseLayout();

                  root.setGravity(Gravity.CENTER);

                  TextView logo = heading("FarmersMeet");
                  logo.setTextSize(40);
                  logo.setGravity(Gravity.CENTER);

                  TextView stage = textView("STAGE 9");
                  stage.setGravity(Gravity.CENTER);
                  stage.setTextColor(GREEN);

                  TextView subtitle = textView(
                          "Connecting farmers, buyers and agricultural businesses"
                  );
                  subtitle.setGravity(Gravity.CENTER);

                  Button enter = button("ENTER MARKETPLACE", true);

                  enter.setOnClickListener(v -> showMarketplace());

                  root.addView(logo);
                  root.addView(stage);
                  root.addView(subtitle);
                  root.addView(enter);

                  setContentView(root);
              }

              private void showMarketplace() {
                  ScrollView scroll = scrollRoot();
                  LinearLayout root = (LinearLayout) scroll.getChildAt(0);

                  root.addView(heading("FarmersMeet Marketplace"));

                  root.addView(
                          textView("Buy and sell agricultural products")
                  );

                  EditText search = field(
                          "Search pigs, fish, crops..."
                  );

                  root.addView(search);

                  Button searchButton = button("SEARCH", true);

                  searchButton.setOnClickListener(v ->
                          showSearchResults(
                                  search.getText().toString().trim()
                          )
                  );

                  root.addView(searchButton);

                  Button profile = button("MY SELLER PROFILE");

                  profile.setOnClickListener(v -> showSellerProfile());

                  root.addView(profile);

                  Button favorites = button("MY FAVORITES");

                  favorites.setOnClickListener(v -> showFavorites());

                  root.addView(favorites);

                  Button myListings = button("MY LISTINGS");

                  myListings.setOnClickListener(v -> showMyListings());

                  root.addView(myListings);

                  TextView categoriesTitle =
                          textView("Browse Categories");

                  categoriesTitle.setTextSize(21);
                  categoriesTitle.setTextColor(GREEN);
                  categoriesTitle.setTypeface(
                          Typeface.DEFAULT,
                          Typeface.BOLD
                  );

                  root.addView(categoriesTitle);

                  for (String category : categories) {
                      Button b = button(category);

                      b.setOnClickListener(v ->
                              showListings(category)
                      );

                      root.addView(b);
                  }

                  Button sell = button("SELL AN ITEM", true);

                  sell.setOnClickListener(v -> showSell(null));

                  root.addView(sell);

                  setContentView(scroll);
              }

              private void showListings(String category) {
                  List<Listing> result = new ArrayList<>();

                  for (Listing item : getListings()) {
                      if (category.equals(item.category)) {
                          result.add(item);
                      }
                  }

                  showListingPage(category, result);
              }

              private void showSearchResults(String query) {
                  String q = query.toLowerCase();
                  List<Listing> result = new ArrayList<>();

                  for (Listing item : getListings()) {
                      if (
                              q.isEmpty() ||
                              item.name.toLowerCase().contains(q) ||
                              item.category.toLowerCase().contains(q) ||
                              item.location.toLowerCase().contains(q) ||
                              item.seller.toLowerCase().contains(q) ||
                              item.description.toLowerCase().contains(q)
                      ) {
                          result.add(item);
                      }
                  }

                  showListingPage(
                          q.isEmpty() ? "All Listings" : "Search Results",
                          result
                  );
              }

              private void showFavorites() {
                  List<Listing> result = new ArrayList<>();

                  for (Listing item : getListings()) {
                      if (isFavorite(item.id)) {
                          result.add(item);
                      }
                  }

                  showListingPage("My Favorites", result);
              }

              private void showMyListings() {
                  ScrollView scroll = scrollRoot();
                  LinearLayout root = (LinearLayout) scroll.getChildAt(0);

                  root.addView(heading("My Listings"));

                  List<Listing> result = new ArrayList<>();

                  for (Listing item : getListings()) {
                      if (item.isMine) {
                          result.add(item);
                      }
                  }

                  if (result.isEmpty()) {
                      root.addView(
                              textView(
                                      "You have not posted any listings yet."
                              )
                      );
                  } else {
                      for (Listing item : result) {
                          addListingCard(root, item, true);
                      }
                  }

                  Button sell = button("SELL AN ITEM", true);
                  sell.setOnClickListener(v -> showSell(null));
                  root.addView(sell);

                  Button back = button("BACK TO MARKETPLACE");
                  back.setOnClickListener(v -> showMarketplace());
                  root.addView(back);

                  setContentView(scroll);
              }

              private void showListingPage(
                      String title,
                      List<Listing> listings
              ) {
                  ScrollView scroll = scrollRoot();
                  LinearLayout root = (LinearLayout) scroll.getChildAt(0);

                  root.addView(heading(title));

                  if (listings.isEmpty()) {
                      root.addView(textView("No listings found."));
                  } else {
                      for (Listing item : listings) {
                          addListingCard(root, item, false);
                      }
                  }

                  Button sell = button("SELL AN ITEM", true);
                  sell.setOnClickListener(v -> showSell(null));
                  root.addView(sell);

                  Button back = button("BACK TO MARKETPLACE");
                  back.setOnClickListener(v -> showMarketplace());
                  root.addView(back);

                  setContentView(scroll);
              }

              private void addListingCard(
                      LinearLayout root,
                      Listing item,
                      boolean mineOnly
              ) {
                  LinearLayout card = new LinearLayout(this);
                  card.setOrientation(LinearLayout.VERTICAL);
                  card.setBackgroundColor(Color.WHITE);
                  card.setPadding(16, 14, 16, 14);

                  LinearLayout.LayoutParams cardParams =
                          new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  LinearLayout.LayoutParams.WRAP_CONTENT
                          );

                  cardParams.setMargins(0, 0, 0, 14);
                  card.setLayoutParams(cardParams);

                  TextView name = textView(item.name);
                  name.setTextSize(21);
                  name.setTextColor(GREEN);
                  name.setTypeface(
                          Typeface.DEFAULT,
                          Typeface.BOLD
                  );

                  card.addView(name);

                  TextView price = textView(item.price);
                  price.setTextSize(20);
                  price.setTextColor(DARK_GREEN);
                  price.setTypeface(
                          Typeface.DEFAULT,
                          Typeface.BOLD
                  );

                  card.addView(price);

                  card.addView(
                          textView(
                                  "Quantity: " + item.quantity +
                                  "\nLocation: " + item.location +
                                  "\nSeller: " + item.seller
                          )
                  );

                  Button favorite = button(
                          isFavorite(item.id)
                                  ? "REMOVE FAVORITE"
                                  : "SAVE FAVORITE"
                  );

                  favorite.setOnClickListener(v -> {
                      toggleFavorite(item.id);

                      favorite.setText(
                              isFavorite(item.id)
                                      ? "REMOVE FAVORITE"
                                      : "SAVE FAVORITE"
                      );
                  });

                  card.addView(favorite);

                  Button details = button("VIEW DETAILS");

                  details.setOnClickListener(
                          v -> showDetails(item)
                  );

                  card.addView(details);

                  if (!item.isMine) {
                      Button seller = button(
                              "VIEW SELLER PROFILE"
                      );

                      seller.setOnClickListener(
                              v -> showPublicSellerProfile(
                                      item.seller
                              )
                      );

                      card.addView(seller);
                  }

                  if (mineOnly && item.isMine) {
                      Button edit =
                              button("EDIT LISTING", true);

                      edit.setOnClickListener(
                              v -> showSell(item)
                      );

                      card.addView(edit);

                      Button delete =
                              button("DELETE LISTING");

                      delete.setOnClickListener(v -> {
                          deleteListing(item.id);

                          Toast.makeText(
                                  this,
                                  "Listing deleted.",
                                  Toast.LENGTH_SHORT
                          ).show();

                          showMyListings();
                      });

                      card.addView(delete);
                  }

                  root.addView(card);
              }

              private void showSellerProfile() {
                  ScrollView scroll = scrollRoot();
                  LinearLayout root = (LinearLayout) scroll.getChildAt(0);

                  root.addView(heading("My Seller Profile"));

                  SellerProfile profile = getProfile();

                  EditText name = field("Your name");
                  name.setText(profile.name);

                  EditText farm = field(
                          "Farm / Business name"
                  );
                  farm.setText(profile.farmName);

                  EditText phone = field("Phone number");
                  phone.setText(profile.phone);

                  EditText location = field(
                          "Farm / Business location"
                  );
                  location.setText(profile.location);

                  EditText about = field(
                          "About your farm or business"
                  );
                  about.setText(profile.about);
                  about.setMinLines(5);
                  about.setGravity(Gravity.TOP);

                  root.addView(name);
                  root.addView(farm);
                  root.addView(phone);
                  root.addView(location);
                  root.addView(about);

                  Button save = button(
                          "SAVE SELLER PROFILE",
                          true
                  );

                  save.setOnClickListener(v -> {
                      String n = name.getText().toString().trim();
                      String f = farm.getText().toString().trim();
                      String p = phone.getText().toString().trim();

                      if (
                              n.isEmpty() ||
                              f.isEmpty() ||
                              p.isEmpty()
                      ) {
                          Toast.makeText(
                                  this,
                                  "Please provide your name, farm/business name and phone.",
                                  Toast.LENGTH_LONG
                          ).show();

                          return;
                      }

                      saveProfile(
                              new SellerProfile(
                                      n,
                                      f,
                                      p,
                                      location.getText().toString().trim(),
                                      about.getText().toString().trim()
                              )
                      );

                      Toast.makeText(
                              this,
                              "Seller profile saved.",
                              Toast.LENGTH_SHORT
                      ).show();

                      showMarketplace();
                  });

                  root.addView(save);

                  Button listings =
                          button("VIEW MY LISTINGS");

                  listings.setOnClickListener(
                          v -> showMyListings()
                  );

                  root.addView(listings);

                  Button back =
                          button("BACK TO MARKETPLACE");

                  back.setOnClickListener(
                          v -> showMarketplace()
                  );

                  root.addView(back);

                  setContentView(scroll);
              }

              private void showPublicSellerProfile(
                      String sellerName
              ) {
                  ScrollView scroll = scrollRoot();
                  LinearLayout root = (LinearLayout) scroll.getChildAt(0);

                  SellerProfile profile =
                          getProfileForSeller(sellerName);

                  root.addView(
                          heading(
                                  profile.farmName.isEmpty()
                                          ? sellerName
                                          : profile.farmName
                          )
                  );

                  root.addView(
                          textView(
                                  "SELLER\n" +
                                  profile.name +
                                  "\n\nPHONE\n" +
                                  profile.phone +
                                  "\n\nLOCATION\n" +
                                  profile.location +
                                  "\n\nABOUT\n" +
                                  (
                                          profile.about.isEmpty()
                                                  ? "No description provided."
                                                  : profile.about
                                  )
                          )
                  );

                  Button call = button("CALL SELLER", true);

                  call.setOnClickListener(v -> {
                      if (!profile.phone.isEmpty()) {
                          try {
                              startActivity(
                                      new Intent(
                                              Intent.ACTION_DIAL,
                                              Uri.parse(
                                                      "tel:" +
                                                      profile.phone
                                              )
                                      )
                              );
                          } catch (Exception e) {
                              Toast.makeText(
                                      this,
                                      "Unable to open phone dialer.",
                                      Toast.LENGTH_SHORT
                              ).show();
                          }
                      }
                  });

                  root.addView(call);

                  Button back = button("BACK");

                  back.setOnClickListener(
                          v -> showMarketplace()
                  );

                  root.addView(back);

                  setContentView(scroll);
              }

              private SellerProfile getProfileForSeller(
                      String seller
              ) {
                  SellerProfile saved = getProfile();

                  if (
                          saved.name.equalsIgnoreCase(seller)
                  ) {
                      return saved;
                  }

                  return new SellerProfile(
                          seller,
                          seller,
                          "",
                          "",
                          ""
                  );
              }

              private void showDetails(Listing item) {
                  ScrollView scroll = scrollRoot();
                  LinearLayout root = (LinearLayout) scroll.getChildAt(0);

                  root.addView(heading(item.name));

                  root.addView(
                          textView(
                                  "PRICE\n" + item.price +
                                  "\n\nCATEGORY\n" + item.category +
                                  "\n\nQUANTITY\n" + item.quantity +
                                  "\n\nLOCATION\n" + item.location +
                                  "\n\nSELLER\n" + item.seller +
                                  "\n\nPHONE\n" + item.phone +
                                  "\n\nDESCRIPTION\n" +
                                  (
                                          item.description.isEmpty()
                                                  ? "No description provided."
                                                  : item.description
                                  )
                          )
                  );

                  Button favorite = button(
                          isFavorite(item.id)
                                  ? "REMOVE FAVORITE"
                                  : "SAVE FAVORITE"
                  );

                  favorite.setOnClickListener(v -> {
                      toggleFavorite(item.id);

                      favorite.setText(
                              isFavorite(item.id)
                                      ? "REMOVE FAVORITE"
                                      : "SAVE FAVORITE"
                      );
                  });

                  root.addView(favorite);

                  Button call = button(
                          "CALL SELLER",
                          true
                  );

                  call.setOnClickListener(v -> {
                      if (!item.phone.isEmpty()) {
                          try {
                              startActivity(
                                      new Intent(
                                              Intent.ACTION_DIAL,
                                              Uri.parse(
                                                      "tel:" +
                                                      item.phone
                                              )
                                      )
                              );
                          } catch (Exception e) {
                              Toast.makeText(
                                      this,
                                      "Unable to open phone dialer.",
                                      Toast.LENGTH_SHORT
                              ).show();
                          }
                      }
                  });

                  root.addView(call);

                  Button whatsapp =
                          button("WHATSAPP SELLER");

                  whatsapp.setOnClickListener(v -> {
                      if (!item.phone.isEmpty()) {
                          String clean =
                                  item.phone
                                          .replace("+", "")
                                          .replace(" ", "");

                          String message =
                                  "Hello, I saw your " +
                                  item.name +
                                  " listing on FarmersMeet.";

                          try {
                              Intent intent =
                                      new Intent(
                                              Intent.ACTION_VIEW,
                                              Uri.parse(
                                                      "https://wa.me/" +
                                                      clean +
                                                      "?text=" +
                                                      Uri.encode(message)
                                              )
                                      );

                              startActivity(intent);
                          } catch (Exception e) {
                              Toast.makeText(
                                      this,
                                      "WhatsApp could not be opened.",
                                      Toast.LENGTH_SHORT
                              ).show();
                          }
                      }
                  });

                  root.addView(whatsapp);

                  if (item.isMine) {
                      Button edit =
                              button("EDIT LISTING", true);

                      edit.setOnClickListener(
                              v -> showSell(item)
                      );

                      root.addView(edit);

                      Button delete =
                              button("DELETE LISTING");

                      delete.setOnClickListener(v -> {
                          deleteListing(item.id);
                          showMyListings();
                      });

                      root.addView(delete);
                  }

                  Button back = button("BACK");

                  back.setOnClickListener(
                          v -> showListings(item.category)
                  );

                  root.addView(back);

                  setContentView(scroll);
              }

              private void showSell(Listing existing) {
                  ScrollView scroll = scrollRoot();
                  LinearLayout root = (LinearLayout) scroll.getChildAt(0);

                  root.addView(
                          heading(
                                  existing == null
                                          ? "Sell an Item"
                                          : "Edit Listing"
                          )
                  );

                  Spinner category = new Spinner(this);

                  ArrayAdapter<String> adapter =
                          new ArrayAdapter<>(
                                  this,
                                  android.R.layout.simple_spinner_item,
                                  categories
                          );

                  adapter.setDropDownViewResource(
                          android.R.layout.simple_spinner_dropdown_item
                  );

                  category.setAdapter(adapter);

                  if (existing != null) {
                      int index = -1;

                      for (int i = 0; i < categories.length; i++) {
                          if (
                                  categories[i].equals(
                                          existing.category
                                  )
                          ) {
                              index = i;
                              break;
                          }
                      }

                      if (index >= 0) {
                          category.setSelection(index);
                      }
                  }

                  root.addView(category);

                  EditText name =
                          field("Product name");

                  EditText price =
                          field("Price in Naira");

                  EditText quantity =
                          field("Quantity");

                  EditText location =
                          field("Location");

                  EditText seller =
                          field("Seller name");

                  EditText phone =
                          field("Phone number");

                  EditText description =
                          field("Description");

                  description.setMinLines(4);
                  description.setGravity(Gravity.TOP);

                  if (existing != null) {
                      name.setText(existing.name);
                      price.setText(
                              existing.price.replace("₦", "")
                      );
                      quantity.setText(existing.quantity);
                      location.setText(existing.location);
                      seller.setText(existing.seller);
                      phone.setText(existing.phone);
                      description.setText(
                              existing.description
                      );
                  } else {
                      SellerProfile profile =
                              getProfile();

                      seller.setText(profile.name);
                      phone.setText(profile.phone);
                      location.setText(profile.location);
                  }

                  root.addView(name);
                  root.addView(price);
                  root.addView(quantity);
                  root.addView(location);
                  root.addView(seller);
                  root.addView(phone);
                  root.addView(description);

                  Button save = button(
                          existing == null
                                  ? "POST LISTING"
                                  : "SAVE CHANGES",
                          true
                  );

                  save.setOnClickListener(v -> {
                      String n =
                              name.getText().toString().trim();

                      String p =
                              price.getText().toString().trim();

                      String q =
                              quantity.getText().toString().trim();

                      String l =
                              location.getText().toString().trim();

                      String s =
                              seller.getText().toString().trim();

                      String ph =
                              phone.getText().toString().trim();

                      if (
                              n.isEmpty() ||
                              p.isEmpty() ||
                              q.isEmpty() ||
                              l.isEmpty() ||
                              s.isEmpty() ||
                              ph.isEmpty()
                      ) {
                          Toast.makeText(
                                  this,
                                  "Please complete all required fields.",
                                  Toast.LENGTH_LONG
                          ).show();

                          return;
                      }

                      long id =
                              existing == null
                                      ? System.currentTimeMillis()
                                      : existing.id;

                      Listing item =
                              new Listing(
                                      id,
                                      n,
                                      category.getSelectedItem().toString(),
                                      "₦" +
                                              p.replace("₦", ""),
                                      q,
                                      l,
                                      s,
                                      ph,
                                      description.getText()
                                              .toString()
                                              .trim(),
                                      existing == null
                                              ? ""
                                              : existing.photoUri,
                                      true
                              );

                      if (existing == null) {
                          saveListing(item);
                      } else {
                          updateListing(item);
                      }

                      Toast.makeText(
                              this,
                              existing == null
                                      ? "Listing posted successfully."
                                      : "Listing updated successfully.",
                              Toast.LENGTH_LONG
                      ).show();

                      showMyListings();
                  });

                  root.addView(save);

                  Button cancel = button("CANCEL");

                  cancel.setOnClickListener(
                          v -> showMyListings()
                  );

                  root.addView(cancel);

                  setContentView(scroll);
              }

              private void saveProfile(
                      SellerProfile profile
              ) {
                  getSharedPreferences(
                          PREFS,
                          Context.MODE_PRIVATE
                  )
                          .edit()
                          .putString(
                                  "profile_name",
                                  profile.name
                          )
                          .putString(
                                  "profile_farm",
                                  profile.farmName
                          )
                          .putString(
                                  "profile_phone",
                                  profile.phone
                          )
                          .putString(
                                  "profile_location",
                                  profile.location
                          )
                          .putString(
                                  "profile_about",
                                  profile.about
                          )
                          .apply();
              }

              private SellerProfile getProfile() {
                  android.content.SharedPreferences prefs =
                          getSharedPreferences(
                                  PREFS,
                                  Context.MODE_PRIVATE
                          );

                  return new SellerProfile(
                          prefs.getString(
                                  "profile_name",
                                  ""
                          ),
                          prefs.getString(
                                  "profile_farm",
                                  ""
                          ),
                          prefs.getString(
                                  "profile_phone",
                                  ""
                          ),
                          prefs.getString(
                                  "profile_location",
                                  ""
                          ),
                          prefs.getString(
                                  "profile_about",
                                  ""
                          )
                  );
              }

              private void saveListing(Listing item) {
                  android.content.SharedPreferences prefs =
                          getSharedPreferences(
                                  PREFS,
                                  Context.MODE_PRIVATE
                          );

                  JSONArray array;

                  try {
                      array = new JSONArray(
                              prefs.getString(
                                      "listings",
                                      "[]"
                              )
                      );
                  } catch (Exception e) {
                      array = new JSONArray();
                  }

                  array.put(toJson(item));

                  prefs.edit()
                          .putString(
                                  "listings",
                                  array.toString()
                          )
                          .apply();
              }

              private void updateListing(Listing item) {
                  android.content.SharedPreferences prefs =
                          getSharedPreferences(
                                  PREFS,
                                  Context.MODE_PRIVATE
                          );

                  JSONArray old;

                  try {
                      old = new JSONArray(
                              prefs.getString(
                                      "listings",
                                      "[]"
                              )
                      );
                  } catch (Exception e) {
                      old = new JSONArray();
                  }

                  JSONArray updated = new JSONArray();

                  for (int i = 0; i < old.length(); i++) {
                      try {
                          JSONObject object =
                                  old.getJSONObject(i);

                          if (
                                  object.optLong("id") ==
                                          item.id
                          ) {
                              updated.put(toJson(item));
                          } else {
                              updated.put(object);
                          }
                      } catch (Exception ignored) {
                      }
                  }

                  prefs.edit()
                          .putString(
                                  "listings",
                                  updated.toString()
                          )
                          .apply();
              }

              private JSONObject toJson(Listing item) {
                  JSONObject object = new JSONObject();

                  try {
                      object.put("id", item.id);
                      object.put("name", item.name);
                      object.put("category", item.category);
                      object.put("price", item.price);
                      object.put("quantity", item.quantity);
                      object.put("location", item.location);
                      object.put("seller", item.seller);
                      object.put("phone", item.phone);
                      object.put(
                              "description",
                              item.description
                      );
                      object.put(
                              "photoUri",
                              item.photoUri
                      );
                      object.put(
                              "isMine",
                              item.isMine
                      );
                  } catch (Exception ignored) {
                  }

                  return object;
              }

              private List<Listing> getListings() {
                  List<Listing> result =
                          new ArrayList<>();

                  android.content.SharedPreferences prefs =
                          getSharedPreferences(
                                  PREFS,
                                  Context.MODE_PRIVATE
                          );

                  JSONArray array;

                  try {
                      array = new JSONArray(
                              prefs.getString(
                                      "listings",
                                      "[]"
                              )
                      );
                  } catch (Exception e) {
                      return result;
                  }

                  for (int i = 0; i < array.length(); i++) {
                      try {
                          JSONObject object =
                                  array.getJSONObject(i);

                          result.add(
                                  new Listing(
                                          object.optLong(
                                                  "id",
                                                  i
                                          ),
                                          object.optString(
                                                  "name"
                                          ),
                                          object.optString(
                                                  "category"
                                          ),
                                          object.optString(
                                                  "price"
                                          ),
                                          object.optString(
                                                  "quantity"
                                          ),
                                          object.optString(
                                                  "location"
                                          ),
                                          object.optString(
                                                  "seller"
                                          ),
                                          object.optString(
                                                  "phone"
                                          ),
                                          object.optString(
                                                  "description"
                                          ),
                                          object.optString(
                                                  "photoUri"
                                          ),
                                          object.optBoolean(
                                                  "isMine",
                                                  false
                                          )
                                  )
                          );
                      } catch (Exception ignored) {
                      }
                  }

                  return result;
              }

              private boolean isFavorite(long id) {
                  android.content.SharedPreferences prefs =
                          getSharedPreferences(
                                  PREFS,
                                  Context.MODE_PRIVATE
                          );

                  return prefs.getBoolean(
                          "favorite_" + id,
                          false
                  );
              }

              private void toggleFavorite(long id) {
                  android.content.SharedPreferences prefs =
                          getSharedPreferences(
                                  PREFS,
                                  Context.MODE_PRIVATE
                          );

                  prefs.edit()
                          .putBoolean(
                                  "favorite_" + id,
                                  !isFavorite(id)
                          )
                          .apply();
              }

              private void deleteListing(long id) {
                  android.content.SharedPreferences prefs =
                          getSharedPreferences(
                                  PREFS,
                                  Context.MODE_PRIVATE
                          );

                  JSONArray old;

                  try {
                      old = new JSONArray(
                              prefs.getString(
                                      "listings",
                                      "[]"
                              )
                      );
                  } catch (Exception e) {
                      old = new JSONArray();
                  }

                  JSONArray updated = new JSONArray();

                  for (int i = 0; i < old.length(); i++) {
                      try {
                          JSONObject object =
                                  old.getJSONObject(i);

                          if (
                                  object.optLong("id") != id
                          ) {
                              updated.put(object);
                          }
                      } catch (Exception ignored) {
                      }
                  }

                  prefs.edit()
                          .putString(
                                  "listings",
                                  updated.toString()
                          )
                          .remove(
                                  "favorite_" + id
                          )
                          .apply();
              }

