name: FarmersMeet Stage 10 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build FarmersMeet Stage 10
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Verify Stage 9 FarmersMeet project
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " FARMERSMEET STAGE 10"
          echo " USING STAGE 9 PROJECT STRUCTURE"
          echo "=========================================="
          echo

          echo "Repository root:"
          pwd

          echo
          echo "Repository contents:"
          find . -maxdepth 3 -type f | sort | head -300

          echo
          echo "Checking Gradle project..."

          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts was not found."
            exit 1
          fi

          if [ -f "settings.gradle" ]; then
            echo "Found settings.gradle"
          else
            echo "Found settings.gradle.kts"
          fi

          if [ -f "build.gradle" ]; then
            echo "Found root build.gradle"
          elif [ -f "build.gradle.kts" ]; then
            echo "Found root build.gradle.kts"
          else
            echo "ERROR: Root Gradle build file is missing."
            exit 1
          fi

          if [ -f "app/build.gradle" ]; then
            echo "Found app/build.gradle"
          elif [ -f "app/build.gradle.kts" ]; then
            echo "Found app/build.gradle.kts"
          else
            echo "ERROR: app Gradle build file is missing."
            exit 1
          fi

          if [ ! -d "app/src/main" ]; then
            echo "ERROR: app/src/main is missing."
            exit 1
          fi

          echo
          echo "PROJECT VERIFICATION PASSED."

      - name: Enable AndroidX
        shell: bash
        run: |
          set -euo pipefail

          PROPERTIES_FILE="gradle.properties"

          touch "$PROPERTIES_FILE"

          if grep -q '^android.useAndroidX=' "$PROPERTIES_FILE"; then
            sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' "$PROPERTIES_FILE"
          else
            printf '\nandroid.useAndroidX=true\n' >> "$PROPERTIES_FILE"
          fi

          if ! grep -q '^android.nonTransitiveRClass=' "$PROPERTIES_FILE"; then
            printf 'android.nonTransitiveRClass=true\n' >> "$PROPERTIES_FILE"
          fi

          echo
          echo "Gradle properties:"
          cat "$PROPERTIES_FILE"

      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          if [ -s "app/google-services.json" ]; then
            echo "Firebase configuration found in app/."
            exit 0
          fi

          if [ -s "Settings/google-services.json" ]; then
            cp "Settings/google-services.json" "app/google-services.json"
            echo "Firebase configuration copied from Settings/."
            exit 0
          fi

          if [ -s "google-services.json" ]; then
            cp "google-services.json" "app/google-services.json"
            echo "Firebase configuration copied from repository root."
            exit 0
          fi

          echo "WARNING: google-services.json was not found."
          echo "Continuing with the existing Stage 9 project configuration."

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Existing Gradle wrapper found."
          else
            echo "No Gradle wrapper found."
            echo "Creating Gradle 8.10 wrapper."

            gradle wrapper \
              --gradle-version 8.10 \
              --distribution-type bin

            chmod +x ./gradlew
          fi

          test -x "./gradlew"

          echo "Gradle wrapper ready."

      - name: Show available Gradle tasks
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking available Gradle tasks..."

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:tasks \
            --all

      - name: Build FarmersMeet Stage 10 APK
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " BUILDING FARMERSMEET STAGE 10 APK"
          echo "=========================================="
          echo

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: Locate generated APK
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for generated APK..."

          APK="$(find app/build -type f -name "*.apk" 2>/dev/null | head -n 1 || true)"

          if [ -z "$APK" ]; then
            echo
            echo "ERROR: No APK was generated."

            echo
            echo "Contents of app/build:"
            if [ -d "app/build" ]; then
              find app/build -maxdepth 6 -type f | sort
            else
              echo "app/build does not exist."
            fi

            exit 1
          fi

          echo
          echo "=========================================="
          echo " FARMERSMEET STAGE 10 APK BUILT"
          echo "=========================================="
          echo
          echo "APK:"
          echo "$APK"
          echo

          ls -lh "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload FarmersMeet Stage 10 APK
        uses: actions/upload-artifact@v4
        with:
          name: FarmersMeet-Stage-10-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30
