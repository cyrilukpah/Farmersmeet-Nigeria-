name: FarmersMeet Stage 10 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build FarmersMeet Stage 10
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Inspect repository
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " FARMERSMEET STAGE 10"
          echo " REPOSITORY INSPECTION"
          echo "=========================================="
          echo

          echo "Repository:"
          pwd
          echo

          echo "Root contents:"
          find . -maxdepth 2 -type f \
            -not -path "*/.git/*" \
            -print | sort

          echo
          echo "Gradle files:"
          find . \
            -type f \
            \( \
              -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "gradlew" \
            \) \
            -not -path "*/.git/*" \
            -not -path "*/.gradle/*" \
            -print | sort

          echo
          echo "Android manifests:"
          find . \
            -type f \
            -name "AndroidManifest.xml" \
            -not -path "*/.git/*" \
            -not -path "*/build/*" \
            -print | sort

          echo
          echo "Android source directories:"
          find . \
            -type d \
            -path "*/src/main" \
            -not -path "*/.git/*" \
            -not -path "*/build/*" \
            -print | sort

      - name: Determine Gradle project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT=""

          echo "Searching for Android Gradle project..."

          while IFS= read -r SETTINGS_FILE; do

            ROOT="$(dirname "$SETTINGS_FILE")"

            echo
            echo "Checking:"
            echo "$SETTINGS_FILE"

            if [ -f "$ROOT/app/build.gradle" ] || \
               [ -f "$ROOT/app/build.gradle.kts" ]; then

              if [ -d "$ROOT/app/src/main" ]; then
                PROJECT_ROOT="$ROOT"
                break
              fi

            fi

          done < <(
            find . \
              -type f \
              \( \
                -name "settings.gradle" \
                -o -name "settings.gradle.kts" \
              \) \
              -not -path "*/.git/*" \
              -not -path "*/.gradle/*" \
              -print | sort
          )

          if [ -z "$PROJECT_ROOT" ]; then

            echo
            echo "No conventional app/ Gradle project found."
            echo
            echo "Searching for Android application modules..."

            while IFS= read -r APP_GRADLE; do

              MODULE="$(dirname "$APP_GRADLE")"

              if [ -d "$MODULE/src/main" ]; then
                PROJECT_ROOT="$(dirname "$(dirname "$MODULE")")"

                if [ "$PROJECT_ROOT" = "." ]; then
                  PROJECT_ROOT=""
                fi

                if [ -z "$PROJECT_ROOT" ]; then
                  PROJECT_ROOT="."
                fi

                break
              fi

            done < <(
              find . \
                -type f \
                \( \
                  -path "*/build.gradle" \
                  -o -path "*/build.gradle.kts" \
                \) \
                -not -path "*/.git/*" \
                -not -path "*/.gradle/*" \
                -not -path "*/build/*" \
                -print | sort
            )

          fi

          if [ -z "$PROJECT_ROOT" ]; then
            echo
            echo "ERROR: Android Gradle project could not be identified."
            echo
            echo "The repository contents above are the diagnostic evidence."
            exit 1
          fi

          PROJECT_ROOT="${PROJECT_ROOT#./}"

          if [ -z "$PROJECT_ROOT" ]; then
            PROJECT_ROOT="."
          fi

          echo
          echo "=========================================="
          echo " SELECTED PROJECT"
          echo "=========================================="
          echo "$PROJECT_ROOT"

          printf '%s\n' "$PROJECT_ROOT" \
            > "$GITHUB_WORKSPACE/.farmersmeet_project_root"

      - name: Validate selected project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT="$(cat "$GITHUB_WORKSPACE/.farmersmeet_project_root")"

          echo "Selected project:"
          echo "$PROJECT_ROOT"
          echo

          SETTINGS_OK=false
          BUILD_OK=false
          APP_OK=false
          MAIN_OK=false

          if [ -f "$PROJECT_ROOT/settings.gradle" ] || \
             [ -f "$PROJECT_ROOT/settings.gradle.kts" ]; then
            SETTINGS_OK=true
          fi

          if [ -f "$PROJECT_ROOT/build.gradle" ] || \
             [ -f "$PROJECT_ROOT/build.gradle.kts" ]; then
            BUILD_OK=true
          fi

          if [ -f "$PROJECT_ROOT/app/build.gradle" ] || \
             [ -f "$PROJECT_ROOT/app/build.gradle.kts" ]; then
            APP_OK=true
          fi

          if [ -d "$PROJECT_ROOT/app/src/main" ]; then
            MAIN_OK=true
          fi

          echo "settings.gradle: $SETTINGS_OK"
          echo "root build file:  $BUILD_OK"
          echo "app build file:   $APP_OK"
          echo "app/src/main:     $MAIN_OK"
          echo

          if [ "$APP_OK" != true ] || [ "$MAIN_OK" != true ]; then

            echo "ERROR: Selected project does not contain a conventional app module."

            echo
            echo "Build files found:"
            find "$PROJECT_ROOT" \
              -type f \
              \( \
                -name "build.gradle" \
                -o -name "build.gradle.kts" \
              \) \
              -not -path "*/.gradle/*" \
              -not -path "*/build/*" \
              -print | sort

            exit 1
          fi

          echo "PROJECT VALIDATION PASSED."

      - name: Enable AndroidX
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT="$(cat "$GITHUB_WORKSPACE/.farmersmeet_project_root")"

          PROPERTIES="$PROJECT_ROOT/gradle.properties"

          touch "$PROPERTIES"

          if grep -q '^android.useAndroidX=' "$PROPERTIES"; then
            sed -i \
              's/^android.useAndroidX=.*/android.useAndroidX=true/' \
              "$PROPERTIES"
          else
            printf '%s\n' \
              'android.useAndroidX=true' \
              >> "$PROPERTIES"
          fi

          if grep -q '^android.nonTransitiveRClass=' "$PROPERTIES"; then
            sed -i \
              's/^android.nonTransitiveRClass=.*/android.nonTransitiveRClass=true/' \
              "$PROPERTIES"
          else
            printf '%s\n' \
              'android.nonTransitiveRClass=true' \
              >> "$PROPERTIES"
          fi

          echo "AndroidX enabled."

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT="$(cat "$GITHUB_WORKSPACE/.farmersmeet_project_root")"

          cd "$PROJECT_ROOT"

          if [ -f "./gradlew" ]; then

            chmod +x ./gradlew
            echo "Existing Gradle wrapper found."

          else

            echo "No Gradle wrapper found."
            echo "Creating Gradle 8.10 wrapper."

            gradle wrapper \
              --gradle-version 8.10 \
              --distribution-type bin

            chmod +x ./gradlew

          fi

          test -x ./gradlew

          echo "Gradle wrapper ready."

      - name: Inspect Gradle tasks
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT="$(cat "$GITHUB_WORKSPACE/.farmersmeet_project_root")"

          cd "$PROJECT_ROOT"

          echo "Gradle project:"
          pwd

          echo
          echo "Gradle version:"
          ./gradlew --version

          echo
          echo "Available tasks:"
          ./gradlew \
            --no-daemon \
            --stacktrace \
            tasks \
            --all

      - name: Build Stage 10 APK
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT="$(cat "$GITHUB_WORKSPACE/.farmersmeet_project_root")"

          cd "$PROJECT_ROOT"

          echo "=========================================="
          echo " BUILDING FARMERSMEET STAGE 10"
          echo "=========================================="

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            :app:assembleDebug

      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT="$(cat "$GITHUB_WORKSPACE/.farmersmeet_project_root")"

          echo "Searching for APK..."

          APK="$(find "$PROJECT_ROOT" \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/*" \
            -print \
            | head -n 1)"

          if [ -z "$APK" ]; then

            echo
            echo "ERROR: No APK was produced."

            echo
            echo "Files under app/build:"
            find "$PROJECT_ROOT/app/build" \
              -type f \
              -print 2>/dev/null || true

            exit 1
          fi

          echo
          echo "=========================================="
          echo " FARMERSMEET STAGE 10 APK CREATED"
          echo "=========================================="
          echo
          echo "APK:"
          echo "$APK"
          echo

          ls -lh "$APK"

          printf 'APK_PATH=%s\n' "$APK" >> "$GITHUB_ENV"

      - name: Upload Stage 10 APK
        uses: actions/upload-artifact@v4
        with:
          name: FarmersMeet-Stage-10-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30
