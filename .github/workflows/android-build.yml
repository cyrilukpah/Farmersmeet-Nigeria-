name: FarmersMeet Stage 7 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build FarmersMeet Stage 7
        working-directory: FarmersMeet
        run: |
          gradle clean
          gradle :app:assembleDebug --stacktrace

      - name: Check APK
        run: |
          test -s FarmersMeet/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p release
          cp FarmersMeet/app/build/outputs/apk/debug/app-debug.apk release/FarmersMeet-Stage7.apk
          ls -lh release/FarmersMeet-Stage7.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FarmersMeet-Stage7-APK
          path: release/FarmersMeet-Stage7.apk
          if-no-files-found: error
          retention-days: 30
