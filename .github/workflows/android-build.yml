name: FarmersMeet Stage 9 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build FarmersMeet Stage 9
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Prepare Stage 9 project from Settings
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " FARMERSMEET STAGE 9"
          echo " USING SETTINGS PROJECT"
          echo "=========================================="

          echo
          echo "Checking Settings project..."

          test -d "Settings"
          test -f "Settings/Settings.gradle"
          test -f "Settings/build.gradle"
          test -f "Settings/app/build.gradle"

          echo "Settings directory found."
          echo "Settings/build.gradle found."
          echo "Settings/app/build.gradle found."

          echo
          echo "Preparing Gradle settings file..."

          cp "Settings/Settings.gradle" \
             "Settings/settings.gradle"

          echo "Settings/settings.gradle created."

          echo
          echo "Preparing application source..."

          if [ -d "Settings/app/src/main" ]; then
            echo "Settings/app/src/main already exists."
          elif [ -d "app/src/main" ]; then
            mkdir -p "Settings/app/src/main"
            cp -R "app/src/main/." "Settings/app/src/main/"
            echo "Application source copied into Settings/app/src/main."
          else
            echo "ERROR: No Android application source was found."
            exit 1
          fi

          echo
          echo "Preparing Firebase configuration..."

          if [ -s "Settings/app/google-services.json" ]; then
            echo "Firebase configuration already exists."
          elif [ -s "Settings/google-services.json" ]; then
            cp "Settings/google-services.json" \
               "Settings/app/google-services.json"

            echo "Firebase configuration copied from Settings/."
          elif [ -s "app/google-services.json" ]; then
            cp "app/google-services.json" \
               "Settings/app/google-services.json"

            echo "Firebase configuration copied from app/."
          else
            echo "WARNING: google-services.json was not found."
            echo "Continuing without copying Firebase configuration."
          fi

          echo
          echo "=========================================="
          echo " STAGE 9 PROJECT READY"
          echo "=========================================="

          echo
          echo "Settings project files:"

          find "Settings" \
            -maxdepth 3 \
            -type f \
            \( -name "*.gradle" \
            -o -name "*.gradle.kts" \
            -o -name "AndroidManifest.xml" \
            -o -name "google-services.json" \) \
            -print | sort

      - name: Enable AndroidX
        shell: bash
        run: |
          set -euo pipefail

          cd "Settings"

          PROPERTIES_FILE="gradle.properties"

          touch "$PROPERTIES_FILE"

          if grep -q '^android.useAndroidX=' "$PROPERTIES_FILE"; then
            sed -i \
              's/^android.useAndroidX=.*/android.useAndroidX=true/' \
              "$PROPERTIES_FILE"
          else
            printf '\nandroid.useAndroidX=true\n' >> "$PROPERTIES_FILE"
          fi

          if grep -q '^android.nonTransitiveRClass=' "$PROPERTIES_FILE"; then
            sed -i \
              's/^android.nonTransitiveRClass=.*/android.nonTransitiveRClass=true/' \
              "$PROPERTIES_FILE"
          else
            printf 'android.nonTransitiveRClass=true\n' >> "$PROPERTIES_FILE"
          fi

          echo "AndroidX enabled."

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "Settings"

          if [ -f "./gradlew" ]; then
            chmod +x "./gradlew"
            echo "Existing Gradle wrapper found."
          else
            echo "No Gradle wrapper found."
            echo "Creating Gradle 8.10 wrapper..."

            gradle wrapper \
              --gradle-version 8.10 \
              --distribution-type bin

            chmod +x "./gradlew"
          fi

          test -x "./gradlew"

          echo "Gradle wrapper ready."

      - name: Verify Stage 9 Gradle project
        shell: bash
        run: |
          set -euo pipefail

          cd "Settings"

          echo "=========================================="
          echo " VERIFYING STAGE 9"
          echo "=========================================="

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:tasks

          echo
          echo "STAGE 9 GRADLE VERIFICATION PASSED."

      - name: Build Stage 9 APK
        shell: bash
        run: |
          set -euo pipefail

          cd "Settings"

          echo "=========================================="
          echo " BUILDING FARMERSMEET STAGE 9 APK"
          echo "=========================================="

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

          echo
          echo "STAGE 9 APK BUILD COMPLETED."

      - name: Locate Stage 9 APK
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " LOCATING STAGE 9 APK"
          echo "=========================================="

          APK=""

          if [ -f "Settings/app/build/outputs/apk/debug/app-debug.apk" ]; then
            APK="Settings/app/build/outputs/apk/debug/app-debug.apk"
          else
            APK="$(find "Settings/app/build/outputs/apk" \
              -type f \
              -name "*.apk" \
              -print \
              | sort \
              | head -n 1 || true)"
          fi

          if [ -z "$APK" ]; then
            echo
            echo "ERROR: Stage 9 APK was not generated."

            echo
            echo "APK files found:"
            find "Settings/app/build" \
              -type f \
              -name "*.apk" \
              -print 2>/dev/null || true

            exit 1
          fi

          echo
          echo "=========================================="
          echo " FARMERSMEET STAGE 9 APK READY"
          echo "=========================================="

          echo
          echo "APK: $APK"

          ls -lh "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload Stage 9 APK
        uses: actions/upload-artifact@v4
        with:
          name: FarmersMeet-Stage-9-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30
