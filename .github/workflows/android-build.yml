name: FarmersMeet Stage 10 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build FarmersMeet Stage 10
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Check Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          test -d "$ANDROID_HOME"

          echo "Android platforms:"
          ls -la "$ANDROID_HOME/platforms"

          echo "Android build tools:"
          ls -la "$ANDROID_HOME/build-tools"

      - name: Locate Firebase configuration
        shell: bash
        run: |
          set -e

          echo "Searching repository for google-services.json..."

          if [ -f "android/app/google-services.json" ]; then
            echo "Found: android/app/google-services.json"
            mkdir -p FarmersMeet/app
            cp "android/app/google-services.json" \
               "FarmersMeet/app/google-services.json"

          elif [ -f "app/google-services.json" ]; then
            echo "Found: app/google-services.json"
            mkdir -p FarmersMeet/app
            cp "app/google-services.json" \
               "FarmersMeet/app/google-services.json"

          elif [ -f "google-services.json" ]; then
            echo "Found: google-services.json"
            mkdir -p FarmersMeet/app
            cp "google-services.json" \
               "FarmersMeet/app/google-services.json"

          else
            echo "ERROR: google-services.json was not found."
            echo
            echo "Expected one of:"
            echo "  android/app/google-services.json"
            echo "  app/google-services.json"
            echo "  google-services.json"
            exit 1
          fi

          test -f FarmersMeet/app/google-services.json

          echo "Firebase configuration copied successfully."

      - name: Verify Firebase package
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          import json

          path = "FarmersMeet/app/google-services.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          clients = data.get("client", [])

          found = False

          for client in clients:
              package_name = (
                  client
                  .get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name")
              )

              print("Firebase Android package:", package_name)

              if package_name == "ng.farmersmeet.nigeria":
                  found = True

          if not found:
              raise SystemExit(
                  "ERROR: google-services.json does not contain "
                  "the expected package ng.farmersmeet.nigeria"
              )

          print("Firebase package verification passed.")
          PY

      - name: Create FarmersMeet Stage 10 project
        shell: bash
        run: |
          set -e

          rm -rf FarmersMeet

          mkdir -p FarmersMeet/app/src/main/java/ng/farmersmeet/nigeria
          mkdir -p FarmersMeet/app/src/main/res/values

          # Restore Firebase configuration after recreating the project.
          if [ -f "android/app/google-services.json" ]; then
            cp "android/app/google-services.json" \
               "FarmersMeet/app/google-services.json"
          elif [ -f "app/google-services.json" ]; then
            cp "app/google-services.json" \
               "FarmersMeet/app/google-services.json"
          elif [ -f "google-services.json" ]; then
            cp "google-services.json" \
               "FarmersMeet/app/google-services.json"
          else
            echo "ERROR: google-services.json disappeared."
            exit 1
          fi

          cat > FarmersMeet/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "FarmersMeetNigeria"

          include(":app")
          EOF

          cat > FarmersMeet/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
              id 'com.google.gms.google-services' version '4.5.0' apply false
          }
          EOF

          cat > FarmersMeet/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > FarmersMeet/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
              id 'com.google.gms.google-services'
          }

          android {
              namespace 'ng.farmersmeet.nigeria'
              compileSdk 35

              defaultConfig {
                  applicationId 'ng.farmersmeet.nigeria'
                  minSdk 24
                  targetSdk 35
                  versionCode 11
                  versionName "10.0"
              }

              buildTypes {
                  debug {
                      debuggable true
                      minifyEnabled false
                  }

                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.15.0'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.activity:activity-ktx:1.10.1'

              implementation platform(
                  'com.google.firebase:firebase-bom:34.19.0'
              )

              implementation 'com.google.firebase:firebase-auth'
              implementation 'com.google.firebase:firebase-firestore'
          }
          EOF

          cat > FarmersMeet/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="FarmersMeet"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>
                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > FarmersMeet/app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="Theme.AppCompat.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#176B35</item>
                  <item name="android:statusBarColor">#0D4D25</item>
                  <item name="android:navigationBarColor">#0D4D25</item>
                  <item name="android:windowLightStatusBar">false</item>

              </style>

          </resources>
          EOF

          cat > FarmersMeet/app/src/main/java/ng/farmersmeet/nigeria/MainActivity.kt <<'EOF'
          package ng.farmersmeet.nigeria

          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast

          import androidx.appcompat.app.AppCompatActivity

          import com.google.firebase.auth.FirebaseAuth
          import com.google.firebase.firestore.FirebaseFirestore

          class MainActivity : AppCompatActivity() {

              private lateinit var auth: FirebaseAuth
              private lateinit var db: FirebaseFirestore

              private val green = Color.rgb(23, 107, 53)
              private val darkGreen = Color.rgb(13, 77, 37)
              private val yellow = Color.rgb(244, 196, 48)
              private val background = Color.rgb(247, 250, 245)
              private val textColor = Color.rgb(24, 53, 31)

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  auth = FirebaseAuth.getInstance()
                  db = FirebaseFirestore.getInstance()

                  if (auth.currentUser != null) {
                      showMarketplace()
                  } else {
                      showWelcome()
                  }
              }

              private fun base(): LinearLayout {
                  return LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(background)
                      setPadding(24, 24, 24, 24)
                  }
              }

              private fun title(text: String): TextView {
                  return TextView(this).apply {
                      this.text = text
                      textSize = 30f
                      setTextColor(green)
                      setTypeface(
                          null,
                          android.graphics.Typeface.BOLD
                      )
                      setPadding(0, 10, 0, 18)
                  }
              }

              private fun field(hint: String): EditText {
                  return EditText(this).apply {
                      this.hint = hint
                      textSize = 16f
                      setSingleLine(true)
                      setTextColor(textColor)

                      layoutParams =
                          LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT,
                              LinearLayout.LayoutParams.WRAP_CONTENT
                          ).apply {
                              setMargins(0, 6, 0, 6)
                          }
                  }
              }

              private fun button(
                  text: String,
                  yellowButton: Boolean = false
              ): Button {
                  return Button(this).apply {
                      this.text = text
                      textSize = 15f
                      setTypeface(
                          null,
                          android.graphics.Typeface.BOLD
                      )

                      setTextColor(
                          if (yellowButton) textColor
                          else Color.WHITE
                      )

                      setBackgroundColor(
                          if (yellowButton) yellow
                          else green
                      )

                      layoutParams =
                          LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT,
                              LinearLayout.LayoutParams.WRAP_CONTENT
                          ).apply {
                              setMargins(0, 6, 0, 6)
                          }
                  }
              }

              private fun showWelcome() {
                  val root = base()
                  root.gravity = Gravity.CENTER

                  val logo = title("FarmersMeet").apply {
                      textSize = 40f
                      gravity = Gravity.CENTER
                  }

                  val stage = TextView(this).apply {
                      text = "STAGE 10"
                      textSize = 13f
                      gravity = Gravity.CENTER
                      setTextColor(green)
                      setPadding(0, 0, 0, 12)
                  }

                  val description =
                      TextView(this).apply {
                          text =
                              "A marketplace connecting farmers, " +
                              "buyers and agricultural businesses."

                          textSize = 16f
                          gravity = Gravity.CENTER
                          setTextColor(textColor)
                          setPadding(10, 0, 10, 25)
                      }

                  val login =
                      button("LOGIN", true)

                  login.setOnClickListener {
                      showLogin()
                  }

                  val register =
                      button("CREATE ACCOUNT")

                  register.setOnClickListener {
                      showRegister()
                  }

                  root.addView(logo)
                  root.addView(stage)
                  root.addView(description)
                  root.addView(login)
                  root.addView(register)

                  setContentView(root)
              }

              private fun showLogin() {
                  val scroll = ScrollView(this)
                  val root = base()

                  root.addView(title("Login"))

                  val email =
                      field("Email address")

                  email.inputType =
                      android.text.InputType.TYPE_CLASS_TEXT or
                      android.text.InputType.TYPE_TEXT_VARIATION_EMAIL_ADDRESS

                  val password =
                      field("Password")

                  password.inputType =
                      android.text.InputType.TYPE_CLASS_TEXT or
                      android.text.InputType.TYPE_TEXT_VARIATION_PASSWORD

                  root.addView(email)
                  root.addView(password)

                  val login =
                      button("LOGIN", true)

                  login.setOnClickListener {

                      val emailText =
                          email.text.toString().trim()

                      val passwordText =
                          password.text.toString()

                      if (
                          emailText.isEmpty() ||
                          passwordText.isEmpty()
                      ) {
                          toast(
                              "Enter your email and password."
                          )
                          return@setOnClickListener
                      }

                      login.isEnabled = false
                      login.text = "LOGGING IN..."

                      auth.signInWithEmailAndPassword(
                          emailText,
                          passwordText
                      ).addOnCompleteListener { task ->

                          login.isEnabled = true
                          login.text = "LOGIN"

                          if (task.isSuccessful) {
                              toast("Login successful.")
                              showMarketplace()
                          } else {
                              toast(
                                  firebaseError(
                                      task.exception
                                  )
                              )
                          }
                      }
                  }

                  root.addView(login)

                  val forgot =
                      button("RESET PASSWORD")

                  forgot.setOnClickListener {

                      val emailText =
                          email.text.toString().trim()

                      if (emailText.isEmpty()) {
                          toast(
                              "Enter your email address first."
                          )
                          return@setOnClickListener
                      }

                      auth.sendPasswordResetEmail(
                          emailText
                      ).addOnCompleteListener { task ->

                          if (task.isSuccessful) {
                              toast(
                                  "Password reset email sent."
                              )
                          } else {
                              toast(
                                  firebaseError(
                                      task.exception
                                  )
                              )
                          }
                      }
                  }

                  root.addView(forgot)

                  val register =
                      button("CREATE NEW ACCOUNT")

                  register.setOnClickListener {
                      showRegister()
                  }

                  root.addView(register)

                  val back =
                      button("BACK")

                  back.setOnClickListener {
                      showWelcome()
                  }

                  root.addView(back)

                  scroll.addView(root)
                  setContentView(scroll)
              }

              private fun showRegister() {
                  val scroll = ScrollView(this)
                  val root = base()

                  root.addView(title("Create Account"))

                  val name =
                      field("Full name")

                  val email =
                      field("Email address")

                  email.inputType =
                      android.text.InputType.TYPE_CLASS_TEXT or
                      android.text.InputType.TYPE_TEXT_VARIATION_EMAIL_ADDRESS

                  val phone =
                      field("Phone number")

                  val location =
                      field("Location")

                  val password =
                      field("Password")

                  password.inputType =
                      android.text.InputType.TYPE_CLASS_TEXT or
                      android.text.InputType.TYPE_TEXT_VARIATION_PASSWORD

                  val confirm =
                      field("Confirm password")

                  confirm.inputType =
                      android.text.InputType.TYPE_CLASS_TEXT or
                      android.text.InputType.TYPE_TEXT_VARIATION_PASSWORD

                  root.addView(name)
                  root.addView(email)
                  root.addView(phone)
                  root.addView(location)
                  root.addView(password)
                  root.addView(confirm)

                  val create =
                      button(
                          "CREATE ACCOUNT",
                          true
                      )

                  create.setOnClickListener {

                      val nameText =
                          name.text.toString().trim()

                      val emailText =
                          email.text.toString().trim()

                      val phoneText =
                          phone.text.toString().trim()

                      val locationText =
                          location.text.toString().trim()

                      val passwordText =
                          password.text.toString()

                      val confirmText =
                          confirm.text.toString()

                      if (
                          nameText.isEmpty() ||
                          emailText.isEmpty() ||
                          phoneText.isEmpty() ||
                          locationText.isEmpty() ||
                          passwordText.isEmpty()
                      ) {
                          toast(
                              "Please complete all required fields."
                          )
                          return@setOnClickListener
                      }

                      if (passwordText.length < 6) {
                          toast(
                              "Password must be at least 6 characters."
                          )
                          return@setOnClickListener
                      }

                      if (passwordText != confirmText) {
                          toast(
                              "Passwords do not match."
                          )
                          return@setOnClickListener
                      }

                      create.isEnabled = false
                      create.text = "CREATING ACCOUNT..."

                      auth.createUserWithEmailAndPassword(
                          emailText,
                          passwordText
                      ).addOnCompleteListener { task ->

                          if (!task.isSuccessful) {
                              create.isEnabled = true
                              create.text = "CREATE ACCOUNT"

                              toast(
                                  firebaseError(
                                      task.exception
                                  )
                              )

                              return@addOnCompleteListener
                          }

                          val user =
                              auth.currentUser

                          if (user == null) {
                              create.isEnabled = true
                              create.text = "CREATE ACCOUNT"
                              toast(
                                  "Account was created but could not be opened."
                              )
                              return@addOnCompleteListener
                          }

                          val profile =
                              hashMapOf(
                                  "uid" to user.uid,
                                  "name" to nameText,
                                  "email" to emailText,
                                  "phone" to phoneText,
                                  "location" to locationText,
                                  "createdAt" to
                                      com.google.firebase.Timestamp.now()
                              )

                          db.collection("users")
                              .document(user.uid)
                              .set(profile)
                              .addOnCompleteListener { profileTask ->

                                  create.isEnabled = true
                                  create.text = "CREATE ACCOUNT"

                                  if (profileTask.isSuccessful) {
                                      toast(
                                          "Account created successfully."
                                      )

                                      showMarketplace()
                                  } else {
                                      toast(
                                          "Account created, but profile could not be saved."
                                      )

                                      showMarketplace()
                                  }
                              }
                      }
                  }

                  root.addView(create)

                  val login =
                      button("I ALREADY HAVE AN ACCOUNT")

                  login.setOnClickListener {
                      showLogin()
                  }

                  root.addView(login)

                  val back =
                      button("BACK")

                  back.setOnClickListener {
                      showWelcome()
                  }

                  root.addView(back)

                  scroll.addView(root)
                  setContentView(scroll)
              }

              private fun showMarketplace() {
                  val user = auth.currentUser

                  if (user == null) {
                      showLogin()
                      return
                  }

                  val scroll = ScrollView(this)
                  val root = base()

                  root.addView(
                      title("FarmersMeet Marketplace")
                  )

                  val account =
                      TextView(this).apply {
                          text =
                              "Signed in as:\n${user.email}"

                          textSize = 15f
                          setTextColor(textColor)
                          setPadding(0, 0, 0, 15)
                      }

                  root.addView(account)

                  val profile =
                      button("MY PROFILE")

                  profile.setOnClickListener {
                      showProfile()
                  }

                  root.addView(profile)

                  val listings =
                      button("BROWSE MARKETPLACE", true)

                  listings.setOnClickListener {
                      showComingSoon(
                          "Marketplace listings"
                      )
                  }

                  root.addView(listings)

                  val sell =
                      button("SELL AN ITEM")

                  sell.setOnClickListener {
                      showComingSoon(
                          "Selling an item"
                      )
                  }

                  root.addView(sell)

                  val favorites =
                      button("MY FAVORITES")

                  favorites.setOnClickListener {
                      showComingSoon(
                          "Favorites"
                      )
                  }

                  root.addView(favorites)

                  val logout =
                      button("LOG OUT")

                  logout.setOnClickListener {
                      auth.signOut()
                      showWelcome()
                  }

                  root.addView(logout)

                  setContentView(root)
              }

              private fun showProfile() {
                  val user = auth.currentUser

                  if (user == null) {
                      showLogin()
                      return
                  }

                  val scroll = ScrollView(this)
                  val root = base()

                  root.addView(title("My Profile"))

                  val name =
                      field("Full name")

                  val phone =
                      field("Phone number")

                  val location =
                      field("Location")

                  root.addView(name)
                  root.addView(phone)
                  root.addView(location)

                  db.collection("users")
                      .document(user.uid)
                      .get()
                      .addOnSuccessListener { document ->

                          if (document.exists()) {
                              name.setText(
                                  document.getString("name")
                                      ?: ""
                              )

                              phone.setText(
                                  document.getString("phone")
                                      ?: ""
                              )

                              location.setText(
                                  document.getString("location")
                                      ?: ""
                              )
                          }
                      }

                  val email =
                      TextView(this).apply {
                          text =
                              "Email:\n${user.email}"

                          textSize = 17f
                          setTextColor(textColor)
                          setPadding(0, 12, 0, 20)
                      }

                  root.addView(email)

                  val save =
                      button(
                          "SAVE PROFILE",
                          true
                      )

                  save.setOnClickListener {

                      val data =
                          hashMapOf(
                              "uid" to user.uid,
                              "name" to
                                  name.text.toString().trim(),
                              "email" to
                                  (user.email ?: ""),
                              "phone" to
                                  phone.text.toString().trim(),
                              "location" to
                                  location.text.toString().trim()
                          )

                      save.isEnabled = false
                      save.text = "SAVING..."

                      db.collection("users")
                          .document(user.uid)
                          .set(
                              data,
                              com.google.firebase.firestore.SetOptions.merge()
                          )
                          .addOnCompleteListener { task ->

                              save.isEnabled = true
                              save.text = "SAVE PROFILE"

                              if (task.isSuccessful) {
                                  toast(
                                      "Profile saved."
                                  )
                              } else {
                                  toast(
                                      "Could not save profile."
                                  )
                              }
                          }
                  }

                  root.addView(save)

                  val logout =
                      button("LOG OUT")

                  logout.setOnClickListener {
                      auth.signOut()
                      showWelcome()
                  }

                  root.addView(logout)

                  val back =
                      button("BACK TO MARKETPLACE")

                  back.setOnClickListener {
                      showMarketplace()
                  }

                  root.addView(back)

                  scroll.addView(root)
                  setContentView(scroll)
              }

              private fun showComingSoon(
                  feature: String
              ) {
                  val root = base()

                  root.addView(
                      title("Stage 10")
                  )

                  root.addView(
                      TextView(this).apply {
                          text =
                              "$feature will remain connected " +
                              "to your real Firebase account.\n\n" +
                              "The Stage 10 authentication system " +
                              "is active and your account is securely " +
                              "signed in."
                          textSize = 18f
                          setTextColor(textColor)
                          setPadding(0, 10, 0, 25)
                      }
                  )

                  val back =
                      button("BACK TO MARKETPLACE", true)

                  back.setOnClickListener {
                      showMarketplace()
                  }

                  root.addView(back)

                  setContentView(root)
              }

              private fun firebaseError(
                  exception: Exception?
              ): String {

                  val message =
                      exception?.message ?: ""

                  return when {
                      message.contains(
                          "already in use",
                          ignoreCase = true
                      ) ->
                          "That email address is already registered."

                      message.contains(
                          "badly formatted",
                          ignoreCase = true
                      ) ->
                          "Please enter a valid email address."

                      message.contains(
                          "password is invalid",
                          ignoreCase = true
                      ) ->
                          "Incorrect email or password."

                      message.contains(
                          "no user record",
                          ignoreCase = true
                      ) ->
                          "No account was found with those details."

                      message.contains(
                          "network",
                          ignoreCase = true
                      ) ->
                          "Network error. Check your internet connection."

                      else ->
                          message.ifEmpty {
                              "Authentication failed. Please try again."
                          }
                  }
              }

              private fun toast(message: String) {
                  Toast.makeText(
                      this,
                      message,
                      Toast.LENGTH_LONG
                  ).show()
              }
          }
          EOF

      - name: Create Gradle wrapper
        shell: bash
        run: |
          set -e

          cd FarmersMeet

          gradle wrapper \
            --gradle-version 8.9 \
            --distribution-type bin

      - name: Build Stage 10 debug APK
        shell: bash
        run: |
          set -e

          cd FarmersMeet

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

      - name: Verify Stage 10 APK
        shell: bash
        run: |
          set -e

          APK="FarmersMeet/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo
          echo "=========================================="
          echo "FarmersMeet Stage 10 APK CREATED"
          echo "=========================================="
          echo

          ls -lh "$APK"

      - name: Upload Stage 10 APK
        uses: actions/upload-artifact@v4
        with:
          name: FarmersMeet-Stage-10-APK
          path: FarmersMeet/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
