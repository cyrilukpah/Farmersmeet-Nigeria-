name: FarmersMeet Stage 10 - Firebase Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build FarmersMeet Stage 10
    runs-on: ubuntu-22.04

    steps:

      # ---------------------------------------------------------
      # 1. CHECKOUT
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # 2. JAVA 17
      # ---------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # ---------------------------------------------------------
      # 3. ANDROID SDK
      #
      # IMPORTANT:
      # We do NOT call sdkmanager before this step.
      # setup-android installs the command-line tools and
      # places sdkmanager on PATH.
      # ---------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0


      # ---------------------------------------------------------
      # 4. VERIFY SDK
      # ---------------------------------------------------------
      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID SDK CHECK"
          echo "=========================================="

          echo "ANDROID_HOME=${ANDROID_HOME:-not-set}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-not-set}"

          echo
          echo "sdkmanager location:"
          command -v sdkmanager

          echo
          echo "sdkmanager version:"
          sdkmanager --version

          echo
          echo "ADB location:"
          command -v adb

          echo
          echo "ADB version:"
          adb version

          echo
          echo "Installed Android platforms:"
          ls -la "$ANDROID_SDK_ROOT/platforms"

          echo
          echo "Installed Android build tools:"
          ls -la "$ANDROID_SDK_ROOT/build-tools"

          echo
          echo "=========================================="
          echo "ANDROID SDK CHECK PASSED"
          echo "=========================================="


      # ---------------------------------------------------------
      # 5. CHECK FARMERSMEET PROJECT
      # ---------------------------------------------------------
      - name: Check FarmersMeet project
        shell: bash
        run: |
          set -e

          if [ ! -d "FarmersMeet" ]; then
            echo "ERROR: FarmersMeet directory was not found."
            echo
            echo "Repository contents:"
            find . -maxdepth 2 -type f | sort
            exit 1
          fi

          if [ ! -f "FarmersMeet/settings.gradle" ] &&
             [ ! -f "FarmersMeet/settings.gradle.kts" ]; then
            echo "ERROR: FarmersMeet Gradle settings file was not found."
            exit 1
          fi

          if [ ! -d "FarmersMeet/app" ]; then
            echo "ERROR: FarmersMeet/app directory was not found."
            exit 1
          fi

          echo "FarmersMeet project found."


      # ---------------------------------------------------------
      # 6. CHECK FIREBASE CONFIGURATION
      # ---------------------------------------------------------
      - name: Check Firebase configuration
        shell: bash
        run: |
          set -e

          if [ ! -f "FarmersMeet/app/google-services.json" ]; then
            echo "ERROR: Firebase configuration file is missing:"
            echo "FarmersMeet/app/google-services.json"
            echo
            echo "Download google-services.json from your Firebase"
            echo "Android app settings and place it in:"
            echo
            echo "FarmersMeet/app/google-services.json"
            exit 1
          fi

          echo "Firebase google-services.json found."


      # ---------------------------------------------------------
      # 7. SHOW PROJECT STRUCTURE
      # ---------------------------------------------------------
      - name: Show project structure
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "FARMERSMEET PROJECT"
          echo "=========================================="

          find FarmersMeet \
            -maxdepth 4 \
            -type f \
            \( \
              -name "*.gradle" \
              -o -name "*.gradle.kts" \
              -o -name "AndroidManifest.xml" \
              -o -name "google-services.json" \
              -o -name "gradlew" \
            \) \
            -print | sort


      # ---------------------------------------------------------
      # 8. MAKE GRADLE WRAPPER EXECUTABLE
      # ---------------------------------------------------------
      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -e

          cd FarmersMeet

          if [ ! -f "gradlew" ]; then
            echo "ERROR: Gradle wrapper was not found."
            echo "Expected: FarmersMeet/gradlew"
            exit 1
          fi

          chmod +x gradlew

          echo "Gradle wrapper:"
          ./gradlew --version


      # ---------------------------------------------------------
      # 9. CLEAN BUILD
      # ---------------------------------------------------------
      - name: Clean project
        shell: bash
        run: |
          set -e

          cd FarmersMeet

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean


      # ---------------------------------------------------------
      # 10. BUILD STAGE 10 DEBUG APK
      # ---------------------------------------------------------
      - name: Build Stage 10 APK
        shell: bash
        run: |
          set -e

          cd FarmersMeet

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug


      # ---------------------------------------------------------
      # 11. VERIFY APK
      # ---------------------------------------------------------
      - name: Verify Stage 10 APK
        shell: bash
        run: |
          set -e

          APK="FarmersMeet/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not produced."
            echo
            echo "Build output:"
            find FarmersMeet/app/build \
              -type f \
              -name "*.apk" \
              -print 2>/dev/null || true
            exit 1
          fi

          echo
          echo "=========================================="
          echo "STAGE 10 APK CREATED"
          echo "=========================================="
          ls -lh "$APK"


      # ---------------------------------------------------------
      # 12. UPLOAD APK
      # ---------------------------------------------------------
      - name: Upload FarmersMeet Stage 10 APK
        uses: actions/upload-artifact@v4
        with:
          name: FarmersMeet-Stage-10-APK
          path: FarmersMeet/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
