name: FarmersMeet Stage 10 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build FarmersMeet Stage 10
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Verify Android SDK 35
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          echo "ANDROID_HOME=$SDK"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$SDK}"

          echo
          echo "Checking Android platform 35..."
          test -d "$SDK/platforms/android-35"

          echo "Android platform 35: OK"

          echo
          echo "Checking Build Tools 35.0.0..."
          test -d "$SDK/build-tools/35.0.0"

          echo "Build Tools 35.0.0: OK"

          echo
          echo "Checking platform-tools..."
          test -x "$SDK/platform-tools/adb"

          echo "Platform-tools: OK"

          echo
          echo "===== ANDROID SDK READY ====="

      - name: Show repository structure
        shell: bash
        run: |
          set -e

          echo "===== REPOSITORY ROOT ====="
          find . -maxdepth 2 -type f | sort

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo "Checking Android project..."

          test -f settings.gradle
          test -d app
          test -f app/build.gradle

          echo "settings.gradle: OK"
          echo "app/: OK"
          echo "app/build.gradle: OK"

      - name: Prepare Firebase configuration
        shell: bash
        run: |
          set -e

          echo "Checking Firebase configuration..."

          if [ -f "google-services.json" ]; then
            echo "Found google-services.json in repository root."

          elif [ -f "Settings/google-services.json" ]; then
            echo "Found Settings/google-services.json."
            cp "Settings/google-services.json" "google-services.json"

          else
            echo "ERROR: google-services.json was not found."
            echo
            echo "Expected:"
            echo "  ./google-services.json"
            echo "or:"
            echo "  ./Settings/google-services.json"
            exit 1
          fi

          cp "google-services.json" "app/google-services.json"

          test -s "app/google-services.json"

          echo "Firebase configuration: OK"

      - name: Prepare root Gradle build file
        shell: bash
        run: |
          set -e

          if [ -f "build.gradle" ]; then
            echo "Root build.gradle found."

          elif [ -f "app-build.gradle" ]; then
            echo "Root build.gradle not found."
            echo "Using existing app-build.gradle."
            cp "app-build.gradle" "build.gradle"

          else
            echo "ERROR: No root build.gradle or app-build.gradle found."
            exit 1
          fi

      - name: Show Gradle configuration
        shell: bash
        run: |
          set -e

          echo "===== settings.gradle ====="
          cat settings.gradle

          echo
          echo "===== build.gradle ====="
          cat build.gradle

          echo
          echo "===== app/build.gradle ====="
          cat app/build.gradle

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify Gradle
        shell: bash
        run: |
          set -e

          gradle --version

      - name: Create Gradle wrapper
        shell: bash
        run: |
          set -e

          if [ ! -f "gradlew" ]; then
            echo "Creating Gradle 8.9 wrapper..."

            gradle wrapper \
              --gradle-version 8.9 \
              --distribution-type bin
          else
            echo "Gradle wrapper already exists."
          fi

          chmod +x gradlew

          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.properties

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew --version

      - name: Clean project
        shell: bash
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            clean

      - name: Build FarmersMeet Stage 10
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo " BUILDING FARMERSMEET STAGE 10"
          echo "========================================"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          echo "Checking APK..."

          test -f "$APK"

          echo
          echo "========================================"
          echo " FARMERSMEET STAGE 10 SUCCESS"
          echo "========================================"

          ls -lh "$APK"

      - name: Upload Stage 10 APK
        uses: actions/upload-artifact@v4
        with:
          name: FarmersMeet-Stage-10-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
