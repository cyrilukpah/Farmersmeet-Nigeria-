          cat > FarmersMeet/app/src/main/java/ng/farmersmeet/nigeria/MarketplaceActivity.kt <<'EOF'
          package ng.farmersmeet.nigeria

          import android.content.Intent
          import android.os.Bundle
          import android.widget.Button
          import androidx.appcompat.app.AppCompatActivity

          class MarketplaceActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_marketplace)

                  val buttons = mapOf(
                      R.id.cropsButton to "Crops and Farm Produce",
                      R.id.pigsButton to "Pigs and Piglets",
                      R.id.fishButton to "Fish and Aquaculture",
                      R.id.livestockButton to "Other Livestock",
                      R.id.poultryButton to "Poultry",
                      R.id.seedsButton to "Seeds and Seedlings",
                      R.id.equipmentButton to "Farm Equipment"
                  )

                  buttons.forEach { (id, category) ->
                      findViewById<Button>(id).setOnClickListener {
                          startActivity(
                              Intent(this, ListingsActivity::class.java)
                                  .putExtra("category", category)
                          )
                      }
                  }

                  findViewById<Button>(R.id.sellButton).setOnClickListener {
                      startActivity(Intent(this, SellActivity::class.java))
                  }
              }
          }
          EOF

          cat > FarmersMeet/app/src/main/java/ng/farmersmeet/nigeria/ListingsActivity.kt <<'EOF'
          package ng.farmersmeet.nigeria

          import android.content.Intent
          import android.graphics.Color
          import android.os.Bundle
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity

          data class Listing(
              val name: String,
              val price: String,
              val quantity: String,
              val location: String,
              val seller: String,
              val description: String
          )

          class ListingsActivity : AppCompatActivity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_listings)

                  val category = intent.getStringExtra("category") ?: ""
                  findViewById<TextView>(R.id.categoryTitle).text = category

                  val container = findViewById<LinearLayout>(R.id.listingsContainer)

                  sampleListings(category).forEach {
                      addCard(container, it)
                  }
              }

              private fun sampleListings(category: String): List<Listing> {
                  return when (category) {
                      "Pigs and Piglets" -> listOf(
                          Listing("Large White Pig", "₦180,000", "1 pig", "Abakaliki, Ebonyi", "Peace Pig Farm", "Healthy Large White pig suitable for breeding or meat production."),
                          Listing("Weaner Piglets", "₦65,000", "5 piglets", "Aba, Abia", "Divine Pig Farm", "Healthy weaner piglets ready for farmers."),
                          Listing("Pregnant Sow", "₦350,000", "1 sow", "Enugu, Enugu", "Green Farm Nigeria", "Healthy pregnant sow available for serious farmers.")
                      )

                      "Fish and Aquaculture" -> listOf(
                          Listing("Table-size Catfish", "₦4,500", "20 fish", "Abakaliki, Ebonyi", "Fresh Waters Farm", "Healthy table-size catfish ready for sale."),
                          Listing("Catfish Fingerlings", "₦35,000", "1,000 fingerlings", "Aba, Abia", "Blue River Farm", "Strong catfish fingerlings for stocking ponds."),
                          Listing("Tilapia Fish", "₦3,500", "20 fish", "Umuahia, Abia", "Aqua Harvest", "Fresh farm-raised tilapia.")
                      )

                      "Crops and Farm Produce" -> listOf(
                          Listing("Fresh Maize", "₦150,000", "10 bags", "Abakaliki, Ebonyi", "John Farms", "Freshly harvested maize."),
                          Listing("Local Rice", "₦95,000", "5 bags", "Aba, Abia", "Green Valley Farm", "Quality locally produced rice.")
                      )

                      "Poultry" -> listOf(
                          Listing("Broiler Chickens", "₦8,500", "1 bird", "Abakaliki, Ebonyi", "Victory Poultry", "Healthy mature broilers."),
                          Listing("Day Old Chicks", "₦1,200", "1 chick", "Aba, Abia", "Sunrise Poultry", "Quality day-old chicks.")
                      )

                      "Other Livestock" -> listOf(
                          Listing("Goats", "₦120,000", "2 goats", "Aba, Abia", "Umuahia Livestock", "Healthy goats available."),
                          Listing("Sheep", "₦150,000", "1 sheep", "Enugu, Enugu", "Eastern Livestock", "Healthy sheep for sale.")
                      )

                      "Seeds and Seedlings" -> listOf(
                          Listing("Hybrid Maize Seeds", "₦25,000", "1 bag", "Enugu, Enugu", "Agro Seed Centre", "Quality hybrid maize seeds."),
                          Listing("Vegetable Seedlings", "₦5,000", "100 seedlings", "Aba, Abia", "Green Garden", "Healthy vegetable seedlings.")
                      )

                      else -> listOf(
                          Listing("Knapsack Sprayer", "₦45,000", "1 unit", "Aba, Abia", "Agro Tools Nigeria", "Farm sprayer suitable for crop protection."),
                          Listing("Water Pump", "₦120,000", "1 unit", "Abakaliki, Ebonyi", "Farm Equipment Hub", "Petrol water pump for irrigation.")
                      )
                  }
              }

              private fun addCard(container: LinearLayout, listing: Listing) {
                  val card = LinearLayout(this)
                  card.orientation = LinearLayout.VERTICAL
                  card.setPadding(20, 20, 20, 20)
                  card.setBackgroundResource(R.drawable.card_background)

                  val params = LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.WRAP_CONTENT
                  )
                  params.setMargins(0, 0, 0, 18)
                  card.layoutParams = params

                  fun makeText(value: String, size: Float): TextView {
                      return TextView(this).apply {
                          text = value
                          textSize = size
                          setTextColor(Color.parseColor("#18351F"))
                          setPadding(0, 4, 0, 4)
                      }
                  }

                  card.addView(makeText(listing.name, 21f))
                  card.addView(makeText(listing.price, 20f))
                  card.addView(makeText("Quantity: ${listing.quantity}", 15f))
                  card.addView(makeText("Location: ${listing.location}", 15f))
                  card.addView(makeText("Seller: ${listing.seller}", 15f))

                  val button = Button(this)
                  button.text = "VIEW DETAILS"
                  button.setTextColor(Color.WHITE)
                  button.setBackgroundResource(R.drawable.button_green)

                  button.setOnClickListener {
                      startActivity(
                          Intent(this, ProductActivity::class.java).apply {
                              putExtra("name", listing.name)
                              putExtra("price", listing.price)
                              putExtra("quantity", listing.quantity)
                              putExtra("location", listing.location)
                              putExtra("seller", listing.seller)
                              putExtra("description", listing.description)
                          }
                      )
                  }

                  card.addView(button)
                  container.addView(card)
              }
          }
          EOF

          cat > FarmersMeet/app/src/main/java/ng/farmersmeet/nigeria/ProductActivity.kt <<'EOF'
          package ng.farmersmeet.nigeria

          import android.os.Bundle
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity

          class ProductActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_product)

                  findViewById<TextView>(R.id.productName).text =
                      intent.getStringExtra("name")

                  findViewById<TextView>(R.id.productPrice).text =
                      intent.getStringExtra("price")

                  findViewById<TextView>(R.id.productQuantity).text =
                      "Quantity: ${intent.getStringExtra("quantity")}"

                  findViewById<TextView>(R.id.productLocation).text =
                      "Location: ${intent.getStringExtra("location")}"

                  findViewById<TextView>(R.id.productSeller).text =
                      "Seller: ${intent.getStringExtra("seller")}"

                  findViewById<TextView>(R.id.productDescription).text =
                      intent.getStringExtra("description")
              }
          }
          EOF

          cat > FarmersMeet/app/src/main/java/ng/farmersmeet/nigeria/SellActivity.kt <<'EOF'
          package ng.farmersmeet.nigeria

          import android.os.Bundle
          import android.widget.ArrayAdapter
          import android.widget.Button
          import android.widget.EditText
          import android.widget.Spinner
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity

          class SellActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_sell)

                  val categories = arrayOf(
                      "Crops and Farm Produce",
                      "Pigs and Piglets",
                      "Fish and Aquaculture",
                      "Other Livestock",
                      "Poultry",
                      "Seeds and Seedlings",
                      "Farm Equipment"
                  )

                  val spinner = findViewById<Spinner>(R.id.categorySpinner)

                  spinner.adapter = ArrayAdapter(
                      this,
                      android.R.layout.simple_spinner_dropdown_item,
                      categories
                  )

                  findViewById<Button>(R.id.postButton).setOnClickListener {
                      val item = findViewById<EditText>(R.id.itemName).text.toString().trim()
                      val price = findViewById<EditText>(R.id.itemPrice).text.toString().trim()
                      val quantity = findViewById<EditText>(R.id.itemQuantity).text.toString().trim()
                      val location = findViewById<EditText>(R.id.itemLocation).text.toString().trim()

                      if (item.isEmpty() || price.isEmpty() ||
                          quantity.isEmpty() || location.isEmpty()) {

                          Toast.makeText(
                              this,
                              "Please complete the required fields.",
                              Toast.LENGTH_SHORT
                          ).show()

                          return@setOnClickListener
                      }

                      Toast.makeText(
                          this,
                          "$item is ready to be posted under ${spinner.selectedItem}.",
                          Toast.LENGTH_LONG
                      ).show()
                  }
              }
          }
          EOF

