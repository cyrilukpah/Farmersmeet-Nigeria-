name: FarmersMeet Stage 10 - Firebase Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build FarmersMeet Stage 10
    runs-on: ubuntu-22.04

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. JAVA 17
      # ==========================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # ==========================================================
      # 3. ANDROID SDK
      # ==========================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0


      # ==========================================================
      # 4. VERIFY ANDROID SDK
      # ==========================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID SDK"
          echo "=========================================="

          echo "ANDROID_HOME=${ANDROID_HOME:-not-set}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-not-set}"

          echo
          echo "sdkmanager:"
          command -v sdkmanager
          sdkmanager --version

          echo
          echo "adb:"
          command -v adb
          adb version

          echo
          echo "Android platforms:"
          ls -la "$ANDROID_SDK_ROOT/platforms"

          echo
          echo "Android build tools:"
          ls -la "$ANDROID_SDK_ROOT/build-tools"


      # ==========================================================
      # 5. VERIFY ROOT ANDROID PROJECT
      # ==========================================================
      - name: Verify project files
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "REPOSITORY CONTENTS"
          echo "=========================================="

          find . -maxdepth 3 -type f | sort

          echo
          echo "=========================================="
          echo "CHECKING ROOT GRADLE PROJECT"
          echo "=========================================="

          test -f settings.gradle
          test -f app/build.gradle
          test -d app

          echo "Root Gradle project found."


      # ==========================================================
      # 6. PREPARE FIREBASE CONFIGURATION
      # ==========================================================
      - name: Prepare Firebase configuration
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "FIREBASE CONFIGURATION"
          echo "=========================================="

          if [ -f "app/google-services.json" ]; then
            echo "Firebase file already exists at:"
            echo "app/google-services.json"

          elif [ -f "Settings/google-services.json" ]; then
            echo "Firebase file found in Settings/."
            echo "Copying it to app/google-services.json..."

            cp "Settings/google-services.json" \
               "app/google-services.json"

          else
            echo "ERROR: google-services.json was not found."
            echo
            echo "Checked:"
            echo "  app/google-services.json"
            echo "  Settings/google-services.json"
            exit 1
          fi

          echo
          echo "Firebase configuration ready."

          ls -lh app/google-services.json


      # ==========================================================
      # 7. CHECK GOOGLE SERVICES PLUGIN
      # ==========================================================
      - name: Verify Google Services Gradle plugin
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "GOOGLE SERVICES PLUGIN"
          echo "=========================================="

          grep -n "google-services" settings.gradle || true
          grep -n "google-services" app/build.gradle || true

          echo
          echo "Gradle files:"
          echo "---------------- settings.gradle ----------------"
          cat settings.gradle

          echo
          echo "---------------- app/build.gradle ---------------"
          cat app/build.gradle


      # ==========================================================
      # 8. FIND GRADLE WRAPPER
      # ==========================================================
      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "GRADLE WRAPPER"
          echo "=========================================="

          if [ -f "./gradlew" ]; then
            echo "Gradle wrapper found."

            chmod +x ./gradlew

          else
            echo "Gradle wrapper not found."
            echo "Generating Gradle wrapper..."

            gradle wrapper \
              --gradle-version 8.9 \
              --distribution-type bin

            chmod +x ./gradlew
          fi

          echo
          echo "Gradle version:"
          ./gradlew --version


      # ==========================================================
      # 9. CHECK GRADLE TASKS
      # ==========================================================
      - name: Check Gradle tasks
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "AVAILABLE GRADLE TASKS"
          echo "=========================================="

          ./gradlew \
            --no-daemon \
            --stacktrace \
            tasks \
            --all


      # ==========================================================
      # 10. CLEAN
      # ==========================================================
      - name: Clean project
        shell: bash
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean


      # ==========================================================
      # 11. BUILD DEBUG APK
      # ==========================================================
      - name: Build Stage 10 debug APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING FARMERSMEET STAGE 10"
          echo "=========================================="

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug


      # ==========================================================
      # 12. VERIFY APK
      # ==========================================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING FOR APK"
          echo "=========================================="

          find app/build \
            -type f \
            -name "*.apk" \
            -print

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo
            echo "ERROR: Expected APK was not created:"
            echo "$APK"
            exit 1
          fi

          echo
          echo "=========================================="
          echo "APK SUCCESSFULLY CREATED"
          echo "=========================================="

          ls -lh "$APK"


      # ==========================================================
      # 13. UPLOAD APK
      # ==========================================================
      - name: Upload FarmersMeet Stage 10 APK
        uses: actions/upload-artifact@v4
        with:
          name: FarmersMeet-Stage-10-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
