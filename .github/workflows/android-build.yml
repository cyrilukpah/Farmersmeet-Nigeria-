name: FarmersMeet Stage 10 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build FarmersMeet Stage 10
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extract FarmersMeet source
        shell: bash
        run: |
          set -euo pipefail

          ZIP="FarmersMeet_Nigeria_V2_Full_Source.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP was not found."
            echo
            echo "Repository contents:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "Found source archive:"
          ls -lh "$ZIP"

          rm -rf FarmersMeet_V2

          unzip -q "$ZIP"

          echo
          echo "Extracted source:"
          find FarmersMeet_V2 -maxdepth 3 -type f | sort | head -100

          test -d FarmersMeet_V2/android

          echo
          echo "FarmersMeet Android source found."

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="FarmersMeet_V2/android"

          test -f "$PROJECT/settings.gradle"
          test -f "$PROJECT/build.gradle"
          test -f "$PROJECT/app/build.gradle"
          test -f "$PROJECT/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT/app/src/main/java/ng/farmersmeet/nigeria/MainActivity.kt"

          echo "Android project verification PASSED."

      - name: Install Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="FarmersMeet_V2/android"
          mkdir -p "$PROJECT/app"

          if [ -f "Settings/google-services.json" ]; then

            cp "Settings/google-services.json" \
              "$PROJECT/app/google-services.json"

          elif [ -f "google-services.json" ]; then

            cp "google-services.json" \
              "$PROJECT/app/google-services.json"

          else

            echo "ERROR: Firebase google-services.json was not found."
            echo
            echo "Repository contents:"
            find . -maxdepth 3 -type f | sort
            exit 1

          fi

          test -s "$PROJECT/app/google-services.json"

          echo "Firebase configuration installed."

      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "FarmersMeet_V2/android/app/google-services.json"
          )

          data = json.loads(path.read_text())

          expected_package = "ng.farmersmeet.nigeria"

          clients = data.get("client", [])

          if not clients:
              raise SystemExit(
                  "ERROR: google-services.json contains no Firebase client."
              )

          packages = []

          for client in clients:
              package_name = (
                  client
                  .get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name")
              )

              if package_name:
                  packages.append(package_name)

          print("Firebase Android package(s):")

          for package_name in packages:
              print(" - " + package_name)

          if expected_package not in packages:
              raise SystemExit(
                  "ERROR: Firebase package mismatch.\n"
                  f"Expected: {expected_package}\n"
                  f"Found: {packages}"
              )

          print("Firebase package verification PASSED.")
          PY

      - name: Configure Firebase Gradle plugin
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="FarmersMeet_V2/android"

          cat > "$PROJECT/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
              id 'com.google.gms.google-services' version '4.4.2' apply false
          }
          EOF

          cat > "$PROJECT/settings.gradle" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "FarmersMeetNigeria"

          include(":app")
          EOF

          echo "Gradle project configuration prepared."

      - name: Verify application Gradle configuration
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="FarmersMeet_V2/android"

          grep -q "com.android.application" \
            "$PROJECT/app/build.gradle"

          grep -q "org.jetbrains.kotlin.android" \
            "$PROJECT/app/build.gradle"

          grep -q "com.google.gms.google-services" \
            "$PROJECT/app/build.gradle"

          grep -q "firebase-auth" \
            "$PROJECT/app/build.gradle"

          grep -q "firebase-firestore" \
            "$PROJECT/app/build.gradle"

          grep -q "ng.farmersmeet.nigeria" \
            "$PROJECT/app/build.gradle"

          echo "Application Gradle configuration PASSED."

      - name: Create Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd FarmersMeet_V2/android

          gradle wrapper \
            --gradle-version 8.7 \
            --distribution-type bin

          chmod +x gradlew

          test -x gradlew

          echo "Gradle wrapper created."

      - name: Check Gradle version
        shell: bash
        run: |
          set -euo pipefail

          cd FarmersMeet_V2/android

          ./gradlew --version

      - name: Check Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"

          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ERROR: ANDROID_HOME is not configured."
            exit 1
          fi

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

          echo "Android SDK 35 is available."

      - name: Build FarmersMeet Stage 10
        shell: bash
        run: |
          set -euo pipefail

          cd FarmersMeet_V2/android

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="FarmersMeet_V2/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            echo
            echo "Available APK files:"
            find FarmersMeet_V2/android/app/build \
              -type f \
              -name "*.apk" \
              -print || true
            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK exists but is empty."
            exit 1
          fi

          echo
          echo "=========================================="
          echo " FARMERSMEET STAGE 10 APK BUILT"
          echo "=========================================="
          echo

          ls -lh "$APK"

      - name: Upload Stage 10 APK
        uses: actions/upload-artifact@v4
        with:
          name: FarmersMeet-Stage-10-APK
          path: FarmersMeet_V2/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
