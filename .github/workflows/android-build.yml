name: FarmersMeet Stage 9 Publish

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build FarmersMeet Stage 9
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Prepare Stage 9 project
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " FARMERSMEET STAGE 9"
          echo " USING THE EXISTING SETTINGS PROJECT"
          echo "=========================================="

          if [ ! -d "Settings" ]; then
            echo "ERROR: Settings/ directory was not found."
            exit 1
          fi

          if [ ! -f "Settings/Settings.gradle" ]; then
            echo "ERROR: Settings/Settings.gradle was not found."
            exit 1
          fi

          if [ ! -f "Settings/build.gradle" ]; then
            echo "ERROR: Settings/build.gradle was not found."
            exit 1
          fi

          if [ ! -f "Settings/app/build.gradle" ]; then
            echo "ERROR: Settings/app/build.gradle was not found."
            exit 1
          fi

          if [ ! -d "Settings/app/src/main" ]; then
            echo "ERROR: Settings/app/src/main was not found."
            exit 1
          fi

          echo
          echo "Stage 9 project files found."

          echo
          echo "Settings project:"
          find Settings \
            -maxdepth 3 \
            -type f \
            \( \
              -name "*.gradle" \
              -o -name "*.gradle.kts" \
              -o -name "AndroidManifest.xml" \
              -o -name "google-services.json" \
            \) \
            -print | sort

          echo
          echo "Creating temporary Stage 9 Gradle workspace..."

          rm -rf "$GITHUB_WORKSPACE/stage9-build"

          mkdir -p "$GITHUB_WORKSPACE/stage9-build"

          cp -a Settings/. \
            "$GITHUB_WORKSPACE/stage9-build/"

          cd "$GITHUB_WORKSPACE/stage9-build"

          cp Settings.gradle settings.gradle

          echo
          echo "Temporary Gradle project prepared."

          echo
          echo "Project root:"
          pwd

          echo
          echo "Root files:"
          ls -la

          echo
          echo "App files:"
          find app -maxdepth 3 -type f -print | sort | head -200

      - name: Prepare Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/stage9-build"

          if [ -s "app/google-services.json" ]; then
            echo "Firebase configuration already exists."
          elif [ -s "$GITHUB_WORKSPACE/Settings/google-services.json" ]; then
            cp "$GITHUB_WORKSPACE/Settings/google-services.json" \
              app/google-services.json

            echo "Firebase configuration copied from Settings/."
          else
            echo "WARNING: google-services.json was not found."
            echo "Continuing with the existing Stage 9 project."
          fi

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/stage9-build"

          if [ -f "gradlew" ]; then
            chmod +x gradlew
            echo "Existing Gradle wrapper found."
          else
            echo "No Gradle wrapper found."
            echo "Creating Gradle 8.10 wrapper."

            gradle wrapper \
              --gradle-version 8.10 \
              --distribution-type bin

            chmod +x gradlew
          fi

          test -x gradlew

          echo "Gradle wrapper ready."

      - name: Verify Stage 9 Gradle project
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/stage9-build"

          echo "=========================================="
          echo " VERIFYING STAGE 9 GRADLE PROJECT"
          echo "=========================================="

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:tasks

      - name: Build Stage 9 APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/stage9-build"

          echo "=========================================="
          echo " BUILDING FARMERSMEET STAGE 9 APK"
          echo "=========================================="

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: Locate Stage 9 APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/stage9-build"

          echo "=========================================="
          echo " LOCATING STAGE 9 APK"
          echo "=========================================="

          APK="$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print -quit 2>/dev/null || true)"

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated."

            echo
            echo "Files under app/build:"
            find app/build \
              -type f \
              -print 2>/dev/null || true

            exit 1
          fi

          echo
          echo "Stage 9 APK found:"
          echo "$APK"

          ls -lh "$APK"

          cp "$APK" \
            "$GITHUB_WORKSPACE/FarmersMeet-Stage-9.apk"

          echo
          echo "Final APK:"
          ls -lh "$GITHUB_WORKSPACE/FarmersMeet-Stage-9.apk"

      - name: Upload Stage 9 APK
        uses: actions/upload-artifact@v4
        with:
          name: FarmersMeet-Stage-9-APK
          path: FarmersMeet-Stage-9.apk
          if-no-files-found: error
          retention-days: 30

      - name: Stage 9 build completed
        shell: bash
        run: |
          echo "=========================================="
          echo " FARMERSMEET STAGE 9 BUILD SUCCESSFUL"
          echo "=========================================="
          echo
          echo "The Stage 9 APK has been uploaded as:"
          echo "FarmersMeet-Stage-9-APK"
